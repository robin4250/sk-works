name: Site order management foundation
on:
  pull_request:
    paths:
      - 'lib/features/sites/site_order_*.dart'
      - 'lib/features/companies/trade_company_page.dart'
      - 'test/site_order_*.dart'
      - 'docs/review/site-order-management/**'
      - 'tool/verify_site_order_archive_schema.mjs'
      - '.github/workflows/site-order-management.yml'
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Parse Dart source
        run: dart format --output=none lib/features/sites/site_order_*.dart test/site_order_*.dart
      - run: flutter analyze lib/features/sites/site_order_*.dart lib/features/companies/trade_company_page.dart test/site_order_*.dart test/trade_document_generator_routing_test.dart
      - run: flutter test --reporter expanded test/site_order_*.dart test/trade_document_generator_routing_test.dart test/trade_company_save_completion_test.dart test/trade_company_detail_edit_delete_contract_test.dart test/trade_company_master_contract_test.dart test/trade_company_dialog_test.dart
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
  archive-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        engine: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_site_order_fixture
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node --check tool/verify_site_order_archive_schema.mjs
      - run: node tool/verify_site_order_archive_schema.mjs ${{ matrix.engine }}
        env:
          SKO_SITE_ORDER_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_site_order_fixture
      - run: git diff --exit-code -- tool/security/fixture_dependencies/package.json tool/security/fixture_dependencies/package-lock.json
