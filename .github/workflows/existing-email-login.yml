name: Existing email login
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/auth/secure_onboarding_pages.dart'
      - 'lib/features/auth/secure_onboarding_repository.dart'
      - 'lib/features/help/manual_content.dart'
      - 'test/existing_email_login_test.dart'
      - 'lib/features/auth/auth_error_message.dart'
      - 'test/auth_error_message_test.dart'
      - 'test/phone_only_login_contract_test.dart'
      - '.github/workflows/existing-email-login.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - name: Analyze login and help
        run: dart analyze lib/features/auth/secure_onboarding_pages.dart lib/features/auth/secure_onboarding_repository.dart lib/features/help/manual_content.dart lib/features/auth/auth_error_message.dart test/existing_email_login_test.dart test/auth_error_message_test.dart
      - name: Verify email and existing Google flows
        run: flutter test test/phone_only_login_contract_test.dart test/auth_error_message_test.dart test/existing_email_login_test.dart test/existing_google_login_test.dart test/employee_password_preflight_test.dart test/primary_password_recovery_widget_test.dart --reporter expanded
