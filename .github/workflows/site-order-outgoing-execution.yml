name: Approved outgoing original and sharing source
on:
  pull_request:
    paths:
      - 'tool/site_order_outgoing*.mjs'
      - 'tool/site_order_canonical_core.mjs'
      - 'supabase/functions/site-order-workflow/*.mjs'
      - 'docs/review/site-order-outgoing-execution/**'
      - 'docs/review/site-order-outgoing-consent/**'
      - 'lib/features/sites/site_order_outgoing_execution.dart'
      - 'lib/features/sites/site_order_workflow_repository.dart'
      - 'test/site_order_outgoing_execution*.dart'
      - 'lib/features/sites/site_order_original_review*.dart'
      - 'lib/features/sites/site_order_outgoing_recovery_page.dart'
      - 'test/site_order_original_review*.dart'
      - '.github/workflows/site-order-outgoing-execution.yml'
permissions:
  contents: read
jobs:
  original-sharing-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        engine: [pglite, postgres]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_document_consent_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 14cf77f4b166bcb86d0f5fef68080841ac89a27a, path: .actual-source, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 6a24114471a9c264fad1aeec5dd2222915ddbedf, path: .c-source, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: de4d4bb018e8c8ca56b0c85bde09fadebca312a4, path: .reply-source, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: f4c6da47e8c6bd894c920ab1d85399a4dc5da7bb, path: .history-source, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: 8bd475b31f5b05788ea437f33e8825651ef54de0, path: .auth-source, persist-credentials: false}
      - uses: dart-lang/setup-dart@v1
        with: {sdk: '3.13.7'}
      - run: dart pub get --enforce-lockfile --directory=tool/canonical_renderer
      - uses: actions/setup-node@v4
        with: {node-version: '22.21.0'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: npm ci --prefix tool/site_order_edge_dependencies --ignore-scripts
      - run: node --test tool/site_order_outgoing_execution_contract.test.mjs tool/site_order_manager_renderer.test.mjs tool/site_order_reply_worker.test.mjs tool/site_order_canonical_renderer.test.mjs
      - name: Actual canonical PDF, same bytes, original and sharing ACK reconciliation
        env:
          SKO_CONSENT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_document_consent_fixture
        run: |
          test "$(id -u)" -ne 0
          export SKO_CANONICAL_DART="$(command -v dart)"
          export SKO_OUTGOING_EXECUTION_REVIEW_HOOK=contract-v1
          export SKO_EXECUTION_RECEIPT_PATH="$GITHUB_WORKSPACE/execution-receipt.json"
          export SKO_CONSENT_RECEIPT_PATH="$GITHUB_WORKSPACE/consent-receipt.json"
          export SKO_EXACT_EIGHT_SOURCE_ROOT="$GITHUB_WORKSPACE/.actual-source"
          export SKO_TRADE_C_SOURCE_ROOT="$GITHUB_WORKSPACE/.c-source"
          export SKO_SITE_REPLY_RECOVERY_SOURCE_ROOT="$GITHUB_WORKSPACE/.reply-source"
          export SKO_SITE_HISTORY_SOURCE_ROOT="$GITHUB_WORKSPACE/.history-source"
          export SKO_ACTUAL_AUTH_SOURCE_ROOT="$GITHUB_WORKSPACE/.auth-source"
          if [ '${{ matrix.engine }}' = postgres ]; then
            node docs/review/site-order-outgoing-consent/verify.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" postgres
          else
            node docs/review/site-order-outgoing-consent/verify.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
          fi
      - name: Hash Native execution and consent receipts
        if: matrix.engine == 'postgres'
        run: sha256sum execution-receipt.json consent-receipt.json > execution-receipt.sha256
      - uses: actions/upload-artifact@v4
        if: matrix.engine == 'postgres'
        with:
          name: order-execution-native-${{ github.sha }}
          path: |
            execution-receipt.json
            consent-receipt.json
            execution-receipt.sha256
          if-no-files-found: error
  execution-native-sdk:
    needs: original-sharing-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.5', cache: true}
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v4
        with: {name: 'order-execution-native-${{ github.sha }}'}
      - run: sha256sum --check execution-receipt.sha256
      - name: Actual SDK uses same-head Native HTTP execution receipts
        env:
          SKO_EXECUTION_RECEIPT_PATH: ${{ github.workspace }}/execution-receipt.json
          SKO_CONSENT_RECEIPT_PATH: ${{ github.workspace }}/consent-receipt.json
        run: flutter test test/site_order_outgoing_execution_test.dart test/site_order_outgoing_execution_repository_test.dart test/site_order_outgoing_consent_repository_test.dart test/site_order_original_review_page_test.dart test/site_order_outgoing_compose_page_test.dart
      - run: flutter analyze lib/features/sites/site_order_outgoing_execution.dart lib/features/sites/site_order_workflow_repository.dart test/site_order_outgoing_execution_test.dart test/site_order_outgoing_execution_repository_test.dart lib/features/sites/site_order_original_review.dart lib/features/sites/site_order_original_review_page.dart lib/features/sites/site_order_outgoing_recovery_page.dart test/site_order_original_review_page_test.dart
