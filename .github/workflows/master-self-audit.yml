name: Master self audit boundary
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261014061009_master_self_operation_audit.sql'
      - 'tool/security/master_self_audit_sql_check.mjs'
      - 'lib/features/security/master_self*'
      - 'test/master_self*'
      - '.github/workflows/master-self-audit.yml'
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/sko-master-audit --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node tool/security/master_self_audit_sql_check.mjs /tmp/sko-master-audit/node_modules/@electric-sql/pglite/dist/index.js
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_incident_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/security/master_self_audit_sql_check.mjs "file://$PWD/tool/security/incident_pg_adapter.mjs"
        env:
          SKO_INCIDENT_FIXTURE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/sko_incident_fixture
