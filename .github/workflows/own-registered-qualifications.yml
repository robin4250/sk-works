name: Own registered qualifications
on:
  pull_request:
    paths:
      - 'lib/features/qualifications/own_qualification_registration_page.dart'
      - 'test/own_registered_qualifications_test.dart'
      - '.github/workflows/own-registered-qualifications.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/qualifications/own_qualification_registration_page.dart test/own_registered_qualifications_test.dart
      - run: flutter test test/own_registered_qualifications_test.dart --reporter expanded
