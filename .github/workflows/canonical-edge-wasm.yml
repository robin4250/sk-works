name: Canonical Edge Wasm feasibility
on:
  pull_request:
    paths: ['tool/canonical_edge_wasm/**', '.github/workflows/canonical-edge-wasm.yml']
permissions: {contents: read}
jobs:
  actual-deno-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 65eb8fcec6af422c6a78269c273ec900db1d0d42
          path: .wasm-source
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with: {sdk: '3.13.7'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.21.0'}
      - name: Locked renderer dependencies and official pinned runtimes
        run: |
          dart pub get --enforce-lockfile --directory=.wasm-source/tool/canonical_renderer
          python3 tool/canonical_edge_wasm/install_runtimes.py
      - name: Verify frozen source and compile actual WasmGC
        run: python3 tool/canonical_edge_wasm/build.py --source-root .wasm-source --dart "$(command -v dart)"
      - name: Actual cold official Deno processes and rejected evidence
        run: |
          python3 tool/canonical_edge_wasm/measure.py
          tool/canonical_edge_wasm/build/deno146/node_modules/@deno/linux-x64-glibc/deno run --no-remote --allow-read=tool/canonical_edge_wasm/build tool/canonical_edge_wasm/negative_deno.mjs
      - name: Actual native Dart reference
        working-directory: .wasm-source
        env:
          SKO_CANONICAL_PDF_OUTPUT_DIR: /tmp/sko-wasm-reference
          SKO_CONFIRMED_TERMS_HOOK: content-v1
          SKO_MONTHLY_PAYMENT_REVIEW_HOOK: contract-v1
          SKO_TRADE_DOCUMENT_API_REVIEW_HOOK: contract-v1
        run: |
          export SKO_CANONICAL_DART="$(command -v dart)"
          node --test tool/site_order_canonical_pdf.test.mjs
      - run: python -m pip install PyMuPDF==1.26.4
      - name: Exact current Wasm versus native PDF text and pixels
        run: python3 tool/canonical_edge_wasm/compare.py --reference /tmp/sko-wasm-reference
