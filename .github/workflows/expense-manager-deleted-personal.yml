name: Expense manager-deleted personal history isolated review
on:
  pull_request:
    paths:
      - 'lib/features/expenses/**'
      - 'test/expense_manager_deleted_personal_test.dart'
      - '.github/workflows/expense-manager-deleted-personal.yml'
permissions:
  contents: read
jobs:
  personal-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/expenses test/expense_manager_deleted_personal_test.dart
      - run: flutter test test/expense_manager_deleted_personal_test.dart test/expense_personal_page_test.dart test/expense_personal_change_test.dart test/expense_receipt_amount_recognition_test.dart test/expense_receipt_amount_review_test.dart test/expense_camera_submission_test.dart test/expense_submission_completion_test.dart
