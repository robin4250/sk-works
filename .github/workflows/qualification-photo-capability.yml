name: Qualification photo capability guarded rollout
on:
  pull_request:
    paths:
      - 'docs/review/qualification-photo-capability/**'
      - '.github/workflows/qualification-photo-capability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture
      PGDATABASE: fixture
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/review/qualification-photo-capability/test_guard.py

