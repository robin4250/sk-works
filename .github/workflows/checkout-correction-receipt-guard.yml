name: Checkout approved correction receipt safety guard
on:
  pull_request:
    paths:
      - 'tool/verify_checkout_correction_receipt_guard.mjs'
      - 'tool/fixtures/checkout_attendance_correction_source.json'
      - 'tool/fixtures/checkout_daily_report_edit_sources.json'
      - 'tool/fixtures/checkout_receipt_pointer_guard_before.json'
      - 'docs/candidates/checkout_correction_receipt_guard.sql.review-only'
      - 'tool/fixtures/company_checkout_*'
      - 'tool/prepare_company_checkout_integration.py'
      - 'tool/verify_company_checkout_integration.mjs'
      - '.github/workflows/checkout-correction-receipt-guard.yml'
permissions:
  contents: read
jobs:
  native-approved-correction-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 -m py_compile tool/prepare_company_checkout_integration.py
      - run: node tool/verify_checkout_correction_receipt_guard.mjs --check-generated
      - name: Actual report/signature/calculator sources with private receipt contract
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
        run: node tool/verify_checkout_correction_receipt_guard.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
