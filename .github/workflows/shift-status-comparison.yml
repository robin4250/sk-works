name: Shift status comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/shifts/**'
      - 'test/shift_attendance_status_test.dart'
      - 'test/shift_people_picker_test.dart'
      - 'test/shift_day_editor_test.dart'
      - 'test/shift_draft_request_test.dart'
      - 'test/shift_schedule_editor_test.dart'
      - 'test/shift_draft_gateway_test.dart'
      - '.github/workflows/shift-status-comparison.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/shifts/shift_attendance_status.dart test/shift_attendance_status_test.dart lib/features/shifts/shift_people_picker.dart test/shift_people_picker_test.dart lib/features/shifts/shift_day_editor.dart test/shift_day_editor_test.dart lib/features/shifts/shift_draft_request.dart lib/features/shifts/shift_schedule_editor.dart test/shift_draft_request_test.dart test/shift_schedule_editor_test.dart lib/features/shifts/shift_draft_gateway.dart test/shift_draft_gateway_test.dart
      - run: flutter test --reporter expanded test/shift_attendance_status_test.dart test/shift_people_picker_test.dart test/shift_day_editor_test.dart test/shift_draft_request_test.dart test/shift_schedule_editor_test.dart test/shift_draft_gateway_test.dart
