name: Google UID protection and direct Apple linking boundary
on:
  pull_request:
    paths:
      - 'docs/review/apple-existing-login-candidate/google-protection.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/google_protection*'
      - 'docs/review/apple-existing-login-candidate/google-protection-review.md'
      - 'docs/review/apple-existing-login-candidate/owner-policy.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/owner_native_only_gotrue_test.go'
      - 'docs/review/apple-existing-login-candidate/native_apple_enrollment_native_runtime.mjs'
      - '.github/workflows/apple-google-protection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-sql-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: sko_apple_enrollment_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/sko-google-protection" --no-save --ignore-scripts @electric-sql/pglite@0.5.8 pg@8.16.3
      - name: Verify OFF, seed, ownership, deletion and rollback in PostgreSQL WASM
        env:
          SKO_APPLE_ENROLLMENT_PGLITE: ${{ runner.temp }}/sko-google-protection/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test docs/review/apple-existing-login-candidate/google_protection_sql.test.mjs
      - name: Verify actual Native PostgreSQL and Google/Apple write race
        env:
          SKO_APPLE_ENROLLMENT_NATIVE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/sko_apple_enrollment_fixture
          SKO_APPLE_ENROLLMENT_NATIVE_DRIVER: ${{ runner.temp }}/sko-google-protection/node_modules/pg/lib/index.js
        run: node --test docs/review/apple-existing-login-candidate/google_protection_sql.test.mjs
  official-auth-direct-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: supabase/auth
          ref: 4eee58f296d9698a1c2c0ae14d7a0b379c7622d3
          path: gotrue
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: gotrue/go.mod
          cache-dependency-path: gotrue/go.sum
      - name: Disposable official Auth schema
        working-directory: gotrue
        run: psql -f hack/init_postgres.sql postgresql://postgres:root@localhost:5432/postgres
      - name: Standard Supabase API roles in the disposable bare-Auth fixture
        run: |
          psql -v ON_ERROR_STOP=1 postgresql://postgres:root@localhost:5432/postgres <<'SQL'
          do $$declare r text;begin foreach r in array array['anon','authenticated','service_role'] loop
            if not exists(select 1 from pg_roles where rolname=r) then execute format('create role %I',r);end if;
          end loop;end$$;
          SQL
      - name: Official GoTrue migrations
        working-directory: gotrue
        run: make migrate_dev
      - name: Reuse native provider fixture and add identity-write proof
        run: |
          cp candidate/docs/review/apple-existing-login-candidate/owner_native_only_gotrue_test.go gotrue/internal/api/sko_native_only_test.go
          cp candidate/docs/review/apple-existing-login-candidate/google_protection_gotrue_test.go gotrue/internal/api/sko_google_protection_test.go
      - name: Actual reported-version HTTP, PKCE transaction and refresh preservation
        working-directory: gotrue
        env:
          SKO_APPLE_POLICY_FILE: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/owner-policy.sql.review-only
          SKO_APPLE_GOOGLE_PROTECTION_FILE: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/google-protection.sql.review-only
        run: go test ./internal/api -run '^TestSKOAppleGlobalGoogleProtection$' -count=1 -v
