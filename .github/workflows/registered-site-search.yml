name: Registered site local search
on:
  push:
    branches: [test/registered-site-search-20261017]
  pull_request:
    paths:
      - 'lib/features/sites/registered_site_search.dart'
      - 'lib/features/sites/site_cloud_page.dart'
      - 'lib/features/sites/site_page.dart'
      - 'lib/features/help/menu_help_catalog.dart'
      - 'lib/international/languages/en/english_language_pack.dart'
      - 'test/registered_site_search_test.dart'
      - '.github/workflows/registered-site-search.yml'
permissions:
  contents: read
jobs:
  local-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze lib/features/sites/registered_site_search.dart lib/features/sites/site_cloud_page.dart test/registered_site_search_test.dart
      - run: flutter test test/registered_site_search_test.dart test/site_fields_trade_company_delete_integrity_contract_test.dart test/site_detail_localization_contract_test.dart --reporter expanded
