name: Site-order package and legacy guard
on:
  pull_request:
    paths:
      - 'docs/review/site-order-package-flow/**'
      - 'tool/site_order_package_flow_fixture.mjs'
      - 'tool/site_order_approval_operation_fixture.mjs'
      - 'tool/site_order_refusal_fixture.mjs'
      - 'tool/site_order_reply_recovery_fixture.mjs'
      - 'tool/site_order_reply_recovery_worker.test.mjs'
      - 'tool/site_order_canonical_core.mjs'
      - 'tool/fixtures/site_order_legacy_public_respond.fixture.sql'
      - 'tool/site_order_canonical_renderer.mjs'
      - 'tool/verify_site_order_package_flow.mjs'
      - 'tool/fixtures/site_order_legacy_private_respond.fixture.sql'
      - '.github/workflows/site-order-package-flow.yml'
permissions:
  contents: read
jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        engine: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_document_consent_fixture
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@v1
        with: {sdk: '3.13.7'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.21.0'}
      - run: dart pub get --enforce-lockfile --directory=tool/canonical_renderer
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: npm ci --prefix tool/site_order_edge_dependencies --ignore-scripts
      - run: node --check tool/site_order_package_flow_fixture.mjs
      - run: node --check tool/verify_site_order_package_flow.mjs
      - run: node --test tool/site_order_manager_renderer.test.mjs tool/site_order_canonical_renderer.test.mjs tool/site_order_reply_recovery_worker.test.mjs
      - name: Canonical original, sanitized package, prepared legacy response guard
        env:
          SKO_CONFIRMED_TERMS_HOOK: content-v1
          SKO_MONTHLY_PAYMENT_REVIEW_HOOK: contract-v1
          SKO_TRADE_DOCUMENT_API_REVIEW_HOOK: contract-v1
          SKO_SITE_ORDER_ARTIFACT_REGISTRATION_HOOK: contract-v1
          SKO_CONSENT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_document_consent_fixture
        run: |
          export SKO_CANONICAL_DART="$(command -v dart)"
          if [ '${{ matrix.engine }}' = 'postgres' ]; then
            node tool/verify_site_order_package_flow.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" postgres
          else
            node tool/verify_site_order_package_flow.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
          fi
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock tool/canonical_renderer/pubspec.yaml tool/canonical_renderer/pubspec.lock tool/security/fixture_dependencies/package-lock.json tool/verify_trade_document_bound_seal_consent.mjs tool/fixtures/trade_reciprocal_gate/source_manifest.json
      - name: No temporary fixture modules
        run: node -e "if(require('node:fs').readdirSync('tool').some(n=>n.startsWith('.site-order-artifact-fixture-')))throw Error('Temporary fixture remains')"
