name: Isolated notice archive candidate
on:
  pull_request:
    paths:
      - 'tool/security/notice-archive-candidate/**'
      - 'tool/security/free-worker-candidate/src/security-audit.mjs'
      - 'tool/security/free-worker-candidate/src/anchor-authority.mjs'
      - '.github/workflows/notice-archive-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/security/free-worker-candidate --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts --no-audit --no-fund
      - run: node --test tool/security/notice-archive-candidate/tests/*.test.mjs
        env:
          SKO_WORKER_TEST_ROOT: ${{ github.workspace }}/tool/security/free-worker-candidate
          SKO_AUDIT_CORE: ${{ github.workspace }}/tool/security/free-worker-candidate/src/security-audit.mjs
          SKO_ANCHOR_CORE: ${{ github.workspace }}/tool/security/free-worker-candidate/src/anchor-authority.mjs
  real-gotrue-native-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts --no-audit --no-fund
      - run: node tool/security/notice-archive-candidate/tests/archive-readback-server-real-auth.mjs

  runtime-readiness-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts --no-audit --no-fund
      - run: node tool/security/notice-archive-candidate/tests/archive-runtime-readiness-native.mjs
