name: Communication content access UI
on:
  pull_request:
    paths:
      - 'lib/features/notes/notes_cloud_page.dart'
      - 'lib/features/albums/albums_cloud_page.dart'
      - 'test/communication_load_guard_test.dart'
      - '.github/workflows/communication-content-access-ui.yml'
jobs:
  scoped-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/notes/notes_cloud_page.dart lib/features/albums/albums_cloud_page.dart test/communication_load_guard_test.dart
      - run: flutter test test/communication_load_guard_test.dart --reporter expanded
