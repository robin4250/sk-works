name: Qualification native SQLite binding
on:
  push:
    branches: ['support/qualification-photo-sqflite-*']
    paths:
      - 'lib/features/qualifications/admin_saved_qualification_photo_*'
      - 'test/features/qualifications/*'
      - 'tool/verify_qualification_photo_store_factory.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/qualification-native-sqlite-binding.yml'
permissions:
  contents: read
jobs:
  sdk-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Analyze native adapter and focused verification
        run: dart analyze lib/features/qualifications/admin_saved_qualification_photo_store_factory.dart lib/features/qualifications/admin_saved_qualification_photo_private_path.dart lib/features/qualifications/admin_saved_qualification_photo_sqflite_connection.dart test/features/qualifications tool/verify_qualification_photo_store_factory.dart
      - name: Verify private filesystem confinement
        run: dart test/features/qualifications/verify_qualification_private_path.dart
      - name: Verify scoped store factory
        run: dart tool/verify_qualification_photo_store_factory.dart
      - name: Verify real SQLite transaction core
        run: dart tool/verify_qualification_photo_sqlite_store.dart
      - name: Verify pinned sqflite method channel behavior
        run: flutter test test/features/qualifications/admin_saved_qualification_photo_sqflite_connection_test.dart --reporter expanded
