name: Server reauthentication proofs
on:
  pull_request:
    paths:
      - 'supabase/functions/reauthenticate-operation/**'
      - 'tool/staged/reauthentication_proofs.sql'
      - 'supabase/tests/fixtures/reauthentication_master_before.sql'
      - 'tool/security/*reauthentication*'
      - 'lib/features/auth/operation_reauthentication_repository.dart'
      - 'lib/features/auth/secondary_password_reset_page.dart'
      - 'lib/features/auth/secondary_reset_session_guard.dart'
      - 'lib/features/auth/secondary_password_primary_verifier.dart'
      - 'test/secondary_password_primary_verifier_test.dart'
      - 'test/server_secondary_password_reset_test.dart'
      - 'test/operation_reauthentication_repository_test.dart'
      - '.github/workflows/reauthentication-proofs.yml'
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: sko_reauthentication_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tool/security/reauthentication_handler_test.mjs
      - run: npm install --prefix /tmp/reauth-deps --no-audit --no-fund pg@8.16.3
      - run: node tool/security/verify_reauthentication_postgres.mjs /tmp/reauth-deps/node_modules/pg/lib/index.js
        env:
          SKO_REAUTH_FIXTURE_URL: postgres://postgres:synthetic_fixture_only@127.0.0.1:5432/sko_reauthentication_fixture

  client:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/auth/secondary_reset_session_guard.dart lib/features/auth/secondary_password_primary_verifier.dart test/secondary_password_primary_verifier_test.dart lib/features/auth/operation_reauthentication_repository.dart lib/features/auth/secondary_password_reset_page.dart test/server_secondary_password_reset_test.dart test/operation_reauthentication_repository_test.dart
      - run: flutter test test/operation_reauthentication_repository_test.dart test/server_secondary_password_reset_test.dart test/secondary_password_reset_page_test.dart test/secondary_password_primary_verifier_test.dart test/secondary_auth_lifecycle_contract_test.dart

