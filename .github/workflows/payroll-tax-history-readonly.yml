name: Read-only payroll adjustment history
on:
  pull_request:
    paths:
      - 'lib/features/payroll/payroll_tax_adjustment_history.dart'
      - 'lib/features/payroll/individual_payroll_settings_page.dart'
      - 'lib/features/shared/trade_document_form_session.dart'
      - 'test/payroll_tax_adjustment_history_test.dart'
      - 'docs/review/payroll-tax-reason-deployment/history-ui.md'
      - '.github/workflows/payroll-tax-history-readonly.yml'
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/payroll/payroll_tax_adjustment_history.dart lib/features/payroll/individual_payroll_settings_page.dart lib/features/shared/trade_document_form_session.dart test/payroll_tax_adjustment_history_test.dart
      - run: flutter test test/payroll_tax_adjustment_history_test.dart test/payroll_fixed_deductions_test.dart test/individual_payroll_ui_tabs_test.dart test/individual_payroll_fixed_footer_test.dart
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
