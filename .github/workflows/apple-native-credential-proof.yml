name: Apple native credential source proof
on:
  pull_request:
    paths:
      - 'docs/review/apple-existing-login-candidate/native_AppleCredentialSource.swift.review-only'
      - '.github/workflows/apple-native-credential-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-typecheck:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compile real AuthenticationServices credential acquisition without signing
        run: |
          cp docs/review/apple-existing-login-candidate/native_AppleCredentialSource.swift.review-only /tmp/SKOAppleCredentialSource.swift
          xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios15.5 /tmp/SKOAppleCredentialSource.swift
