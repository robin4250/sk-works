name: Invoice approval readiness review
on:
  pull_request:
    paths:
      - 'lib/features/invoices/invoice_approval_readiness.dart'
      - 'lib/features/invoices/invoice_pdf_service.dart'
      - 'lib/features/invoices/invoice_approval_entry_actions.dart'
      - 'test/invoice_approval_off_compatibility_test.dart'
      - 'lib/features/invoices/invoice_cloud_page.dart'
      - 'lib/features/invoices/invoice_notification_page.dart'
      - 'lib/features/notifications/notifications_page.dart'
      - 'lib/features/invoices/invoice_notice_recovery_controller.dart'
      - 'test/invoice_notice_recovery_controller_test.dart'
      - 'test/invoice_notice_recovery_auth_panel_test.dart'
      - 'test/invoice_notice_preview_gate_test.dart'
      - 'lib/features/invoices/invoice_notice_ticket_controller.dart'
      - 'lib/features/invoices/invoice_notice_approval_panel.dart'
      - 'test/invoice_notice_approval_panel_test.dart'
      - 'lib/features/invoices/invoice_notice_candidate_rpc.dart'
      - 'test/invoice_notice_ticket_controller_test.dart'
      - 'test/invoice_notification_target_test.dart'
      - 'test/invoice_notification_route_scope_test.dart'
      - 'test/invoice_approval_readiness_test.dart'
      - '.github/workflows/invoice-approval-readiness-review.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze test/invoice_notice_preview_gate_test.dart test/invoice_notice_recovery_auth_panel_test.dart lib/features/invoices/invoice_notice_recovery_controller.dart test/invoice_notice_recovery_controller_test.dart lib/features/invoices/invoice_approval_entry_actions.dart test/invoice_approval_off_compatibility_test.dart lib/features/invoices/invoice_notice_approval_panel.dart test/invoice_notice_approval_panel_test.dart lib/features/invoices/invoice_notice_candidate_rpc.dart lib/features/notifications/notifications_page.dart lib/features/invoices/invoice_notice_ticket_controller.dart test/invoice_notice_ticket_controller_test.dart lib/features/invoices/invoice_cloud_page.dart lib/features/invoices/invoice_notification_page.dart test/invoice_notification_target_test.dart test/invoice_notification_route_scope_test.dart lib/features/invoices/invoice_pdf_service.dart lib/features/invoices/invoice_approval_readiness.dart test/invoice_approval_readiness_test.dart
      - run: flutter test --reporter expanded test/invoice_notice_preview_gate_test.dart test/invoice_notice_recovery_auth_panel_test.dart test/invoice_notice_recovery_controller_test.dart test/invoice_approval_off_compatibility_test.dart test/invoice_notice_approval_panel_test.dart test/invoice_notice_ticket_controller_test.dart test/invoice_approval_readiness_test.dart test/invoice_notification_target_test.dart test/invoice_notification_route_scope_test.dart
