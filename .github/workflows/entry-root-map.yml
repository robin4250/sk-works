name: Entry offline root map
on:
  pull_request:
    paths:
      - 'tool/security/restoration/entry_archive_map*'
      - 'tool/security/restoration/test_entry_archive_map.py'
      - '.github/workflows/entry-root-map.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tool/security/restoration -p 'test_entry_archive_map.py' -v
