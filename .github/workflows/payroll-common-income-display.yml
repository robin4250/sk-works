name: Payroll common allowance and income evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/payroll/payroll_recorded_unit_evidence.dart'
      - 'lib/features/payroll/payroll_recorded_income_tax_evidence.dart'
      - 'lib/features/payroll/payroll_pdf_service.dart'
      - 'test/payroll_zero_quantity_common_evidence_test.dart'
      - 'test/payroll_recorded_income_tax_evidence_test.dart'
      - 'test/payroll_common_income_display_pdf_test.dart'
      - '.github/workflows/payroll-common-income-display.yml'
permissions:
  contents: read
jobs:
  saved-evidence-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKO_PDF_FONT_PATH: build/pdf-fixtures/NotoSansJP-Regular.ttf
      SKO_PDF_OUTPUT_DIR: build/pdf-fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: |
          flutter pub get --enforce-lockfile
          python3 -m pip install PyMuPDF==1.26.6 fonttools==4.61.1
          python3 tool/prepare_pdf_fixture_font.py
      - run: flutter analyze lib/features/payroll/payroll_recorded_unit_evidence.dart lib/features/payroll/payroll_recorded_income_tax_evidence.dart test/payroll_zero_quantity_common_evidence_test.dart test/payroll_recorded_income_tax_evidence_test.dart test/payroll_common_income_display_pdf_test.dart
      - run: flutter test --reporter expanded test/payroll_zero_quantity_common_evidence_test.dart test/payroll_recorded_income_tax_evidence_test.dart test/payroll_common_income_display_pdf_test.dart test/payroll_recorded_unit_evidence_test.dart test/payroll_saved_unit_pdf_test.dart test/payroll_tax_pdf_test.dart test/payroll_insurance_evidence_pdf_test.dart
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: payroll-common-income-display
          path: |
            build/pdf-fixtures/payroll_common_income_evidence*.pdf
            build/pdf-fixtures/payroll_common_income_evidence*.pdf.png
          if-no-files-found: warn
