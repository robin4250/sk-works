name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'tool/prepare_ios.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'tool/prepare_ios.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS project
        run: bash tool/prepare_ios.sh

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Verify iOS permission descriptions
        run: |
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" ios/Runner/Info.plist

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS debug without codesigning
        run: flutter build ios --debug --no-codesign
