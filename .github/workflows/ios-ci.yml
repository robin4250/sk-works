name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'tool/prepare_ios.sh'
      - 'tool/check_ios_readiness.sh'
      - 'tool/run_ios_device.sh'
      - 'tool/ios_install_assistant.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'tool/prepare_ios.sh'
      - 'tool/check_ios_readiness.sh'
      - 'tool/run_ios_device.sh'
      - 'tool/ios_install_assistant.sh'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate iOS helper scripts
        run: |
          bash -n tool/prepare_ios.sh
          bash -n tool/check_ios_readiness.sh
          bash -n tool/run_ios_device.sh
          bash -n tool/ios_install_assistant.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS project
        run: bash tool/prepare_ios.sh

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Verify iOS permission descriptions
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" ios/Runner/Info.plist

      - name: Verify Personal Team bundle identifier
        run: grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.robin4250.sko;' ios/Runner.xcodeproj/project.pbxproj

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS debug without codesigning
        run: flutter build ios --debug --no-codesign
