name: Self primary password boolean isolated proof
on:
  pull_request:
    paths:
      - 'docs/candidates/primary_password_self_status_20261025.sql.review-only'
      - 'docs/review/primary-password-self-status-20261025.md'
      - 'tool/security/primary_password_self_status_*.mjs'
      - 'tool/security/login_method_enrollment_gotrue_e2e.mjs'
      - 'tool/security/fixture_dependencies/package.json'
      - 'tool/security/fixture_dependencies/package-lock.json'
      - '.github/workflows/primary-password-self-status.yml'
permissions:
  contents: read
jobs:
  synthetic-sql-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node --check tool/security/login_method_enrollment_gotrue_e2e.mjs
      - run: node --check tool/security/primary_password_self_status_fixture.mjs
      - run: node --check tool/security/primary_password_self_status_pglite.mjs
      - name: Exact candidate SQL with synthetic self-only role and session denials
        run: node tool/security/primary_password_self_status_pglite.mjs "$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
  isolated-real-gotrue:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - name: Real JWT false to true with existing same-user password enrollment
        run: node tool/security/login_method_enrollment_gotrue_e2e.mjs
        env:
          SKO_PRIMARY_PASSWORD_STATUS_REVIEW: contract-v1
