name: Self primary password boolean isolated proof
on:
  pull_request:
    paths:
      - 'docs/candidates/primary_password_self_status_20261025.sql.review-only'
      - 'docs/candidates/primary_password_self_status_restore_20261025.sql.review-only'
      - 'docs/review/primary-password-self-status-20261025.md'
      - 'tool/security/primary_password_self_status_*.mjs'
      - 'tool/security/login_method_enrollment_gotrue_e2e.mjs'
      - 'tool/security/fixture_dependencies/package.json'
      - 'tool/security/fixture_dependencies/package-lock.json'
      - '.github/workflows/primary-password-self-status.yml'
permissions:
  contents: read
jobs:
  synthetic-sql-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node --check tool/security/login_method_enrollment_gotrue_e2e.mjs
      - run: node --check tool/security/primary_password_self_status_fixture.mjs
      - run: node --check tool/security/primary_password_self_status_pglite.mjs
      - name: Exact candidate SQL with synthetic self-only role and session denials
        run: node tool/security/primary_password_self_status_pglite.mjs "$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Exact two-routine restore and stale/dependency rollback guards
        run: node tool/security/primary_password_self_status_restore.mjs "$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
  isolated-native-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_primary_status_restore_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node --check tool/security/primary_password_self_status_restore.mjs
      - name: Same restore SQL on owned native PostgreSQL 17
        run: node tool/security/primary_password_self_status_restore.mjs "$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" postgres
        env:
          SKO_PRIMARY_STATUS_RESTORE_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_primary_status_restore_fixture
  isolated-real-gotrue:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - name: Real JWT false to true with existing same-user password enrollment
        run: node tool/security/login_method_enrollment_gotrue_e2e.mjs
        env:
          SKO_PRIMARY_PASSWORD_STATUS_REVIEW: contract-v1
