name: Authenticated navigation reset
on:
  pull_request:
    paths:
      - 'lib/app_v2.dart'
      - 'lib/features/auth/auth_gate.dart'
      - 'lib/features/auth/authenticated_navigation_boundary.dart'
      - 'test/authenticated_navigation_boundary_test.dart'
      - 'lib/features/attendance/attendance_protected_routes.dart'
      - 'lib/features/attendance/checkout_report_gate.dart'
      - 'lib/features/people/people_cloud_page.dart'
      - 'lib/features/payroll/payroll_pending_attendance_panel.dart'
      - 'test/attendance_secondary_entry_test.dart'
      - 'test/attendance_management_page_contract_test.dart'
      - 'test/attendance_qualification_split_20261003_contract_test.dart'
      - 'test/payroll_pending_attendance_panel_test.dart'
      - '.github/workflows/authenticated-navigation-reset.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/attendance/attendance_protected_routes.dart test/attendance_secondary_entry_test.dart test/payroll_pending_attendance_panel_test.dart lib/app_v2.dart lib/features/auth/auth_gate.dart lib/features/auth/authenticated_navigation_boundary.dart test/authenticated_navigation_boundary_test.dart
      - run: flutter test test/attendance_management_page_contract_test.dart test/attendance_qualification_split_20261003_contract_test.dart test/attendance_secondary_entry_test.dart test/payroll_pending_attendance_panel_test.dart test/authenticated_navigation_boundary_test.dart test/secondary_password_reset_page_test.dart test/security_actor_boundary_test.dart
