name: Canonical common payroll client
on:
  pull_request:
    paths:
      - 'lib/features/payroll/company_common_canonical_publication_*.dart'
      - 'lib/features/payroll/company_common_payroll_publication_surface.dart'
      - 'lib/features/payroll/company_common_payroll_page.dart'
      - 'test/fixtures/company_common_canonical_publication_contract3.json'
      - 'test/support/common_canonical_client_fixture.dart'
      - 'test/company_common_canonical_publication_*_test.dart'
      - 'lib/features/payroll/company_common_calculation_resolution.dart'
      - 'lib/features/payroll/payroll_company_common_card.dart'
      - 'lib/features/payroll/payroll_unit_conditions_page.dart'
      - 'lib/features/payroll/payroll_unit_conditions_repository.dart'
      - 'test/company_common_calculation_resolution_test.dart'
      - '.github/workflows/company-common-canonical-ui.yml'
permissions:
  contents: read
jobs:
  canonical-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze
      - run: timeout 240s flutter test --reporter expanded --timeout 60s test/company_common_canonical_publication_panel_test.dart test/company_common_canonical_publication_pending_test.dart test/company_common_canonical_publication_approval_test.dart test/company_common_calculation_resolution_test.dart test/company_common_canonical_publication_repository_test.dart test/company_common_payroll_publication_test.dart test/payroll_company_common_test.dart test/payroll_unit_conditions_repository_test.dart test/payroll_unit_conditions_editor_test.dart
