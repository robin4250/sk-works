name: Invoice notice seal composition review
on:
  pull_request:
    paths:
      - 'lib/features/invoices/invoice_notice_recovery_controller.dart'
      - 'test/invoice_notice_native_receipt_test.dart'
      - 'docs/candidates/trade_document_notice_seal_20261028.sql.review-only'
      - 'tool/trade_document_notice_seal_fixture.mjs'
      - 'tool/trade_document_notice_result_races.mjs'
      - 'tool/trade_document_notice_commit_ack*'
      - 'tool/trade_document_notice_source_integrity_fixture.mjs'
      - 'tool/trade_document_notice_daily_preview_fixture.mjs'
      - 'tool/trade_document_notice_adjustment_provider_fixture.mjs'
      - 'tool/trade_document_notice_expense_provider_fixture.mjs'
      - 'tool/trade_document_notice_route_provider_fixture.mjs'
      - 'docs/review/invoice-month-close/route_helpers.production.sql.review-only'
      - 'docs/review/invoice-month-close/route_components.production.sql.review-only'
      - 'supabase/migrations/20261012053842_route_customer_billing_connection.sql'
      - 'supabase/migrations/20261013181708_route_signed_checkout_customer_billing.sql'
      - 'supabase/migrations/20261012142138_expense_document_original_costs.sql'
      - 'tool/trade_document_notice_calculated_confirmation_fixture.mjs'
      - 'supabase/review/document_adjustment_install.incomplete.sql'
      - 'supabase/migrations/20261006180455_fix_rate_formula_combined_multipliers.sql'
      - 'supabase/migrations/20261008035509_invoice_registered_method_amounts_and_formula_labels.sql'
      - 'docs/review/invoice-month-close/generate_approver_core.py'
      - 'tool/verify_trade_document_notice_seal.mjs'
      - 'docs/review/invoice-month-close/notification.sql.review-only'
      - 'docs/review/invoice-month-close/guarded.sql.review-only'
      - 'docs/review/invoice-month-close/precheck.sql.review-only'
      - 'docs/review/invoice-month-close/notification_readiness.sql.review-only'
      - 'tool/trade_document_invoice_confirmation_fixture.mjs'
      - '.github/workflows/invoice-notice-seal-composition.yml'
permissions:
  contents: read
jobs:
  isolated-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [pglite, postgres]
    env:
      SKO_NOTICE_SOURCE_PREVIEW: ${{ github.workspace }}/invoice-calculation-candidate/docs/review/invoice-correction-preview/preview.sql.review-only
      SKO_NOTICE_APPROVER_CORE: /tmp/sko-notice-approver-core.sql
    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_document_consent_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 4f04488f77ff909d0d48a9a74247eb549823ca83
          path: invoice-calculation-candidate
      - run: python3 docs/review/invoice-month-close/generate_approver_core.py "$SKO_NOTICE_SOURCE_PREVIEW" "$SKO_NOTICE_APPROVER_CORE"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts --no-audit --no-fund
      - if: matrix.runtime == 'postgres'
        run: node --test tool/trade_document_notice_commit_ack_proxy.test.mjs
      - if: matrix.runtime == 'pglite'
        run: node tool/verify_trade_document_notice_seal.mjs "$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
      - if: matrix.runtime == 'postgres'
        run: node tool/verify_trade_document_notice_seal.mjs "$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" postgres
        env:
          SKO_NOTICE_NATIVE_RECEIPT_REQUIRED: 'true'
          SKO_NOTICE_CLIENT_RECEIPT_FIXTURE: ${{ runner.temp }}/invoice-notice-scoped-receipt.json
          SKO_CONSENT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_document_consent_fixture
      - if: matrix.runtime == 'postgres'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - if: matrix.runtime == 'postgres'
        run: flutter pub get --enforce-lockfile
      - if: matrix.runtime == 'postgres'
        run: flutter analyze lib/features/invoices/invoice_notice_recovery_controller.dart test/invoice_notice_native_receipt_test.dart
      - if: matrix.runtime == 'postgres'
        run: flutter test --reporter expanded test/invoice_notice_native_receipt_test.dart
        env:
          SKO_NOTICE_NATIVE_RECEIPT_REQUIRED: 'true'
          SKO_NOTICE_CLIENT_RECEIPT_FIXTURE: ${{ runner.temp }}/invoice-notice-scoped-receipt.json
