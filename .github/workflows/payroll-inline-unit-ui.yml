name: Payroll inline unit UI
on:
  pull_request:
    paths:
      - 'lib/features/payroll/individual_payroll_settings_page.dart'
      - 'lib/features/payroll/payroll_unit*'
      - 'lib/features/payroll/payroll_fixed_deductions.dart'
      - 'lib/features/payroll/resident_tax_section.dart'
      - 'test/features/payroll/resident_tax_section_test.dart'
      - 'lib/features/payroll/payroll_review_page.dart'
      - 'test/payroll_review_settings_entry_test.dart'
      - 'test/payroll_roster_review_test.dart'
      - 'lib/features/payroll/payroll_review_repository.dart'
      - 'lib/features/payroll/individual_payroll_settings_repository.dart'
      - 'lib/features/payroll/payroll_tax_conditions_page.dart'
      - 'test/payroll_fixed_deductions_test.dart'
      - 'test/features/payroll/payroll_tax_conditions_page_test.dart'
      - 'test/payroll_inline_unit_sections_test.dart'
      - 'test/individual_payroll_ui_tabs_test.dart'
      - '.github/workflows/payroll-inline-unit-ui.yml'
  push:
    branches: [main]
    paths:
      - 'lib/features/payroll/individual_payroll_settings_page.dart'
      - 'lib/features/payroll/payroll_unit*'
      - 'lib/features/payroll/payroll_fixed_deductions.dart'
      - 'lib/features/payroll/resident_tax_section.dart'
      - 'test/features/payroll/resident_tax_section_test.dart'
      - 'lib/features/payroll/payroll_review_page.dart'
      - 'test/payroll_review_settings_entry_test.dart'
      - 'test/payroll_roster_review_test.dart'
      - 'lib/features/payroll/payroll_review_repository.dart'
      - 'lib/features/payroll/individual_payroll_settings_repository.dart'
      - 'lib/features/payroll/payroll_tax_conditions_page.dart'
      - 'test/payroll_fixed_deductions_test.dart'
      - 'test/features/payroll/payroll_tax_conditions_page_test.dart'
      - '.github/workflows/payroll-inline-unit-ui.yml'
permissions:
  contents: read
jobs:
  inline-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter test test/payroll_roster_review_test.dart test/ui_organization_navigation_test.dart test/payroll_review_settings_entry_test.dart test/home_tax_entry_test.dart test/payroll_fixed_deductions_test.dart test/features/payroll/resident_tax_section_test.dart test/features/payroll/payroll_tax_conditions_page_test.dart test/payroll_inline_unit_sections_test.dart test/individual_payroll_ui_tabs_test.dart test/payroll_unit_conditions_editor_test.dart test/payroll_unit_item_editor_test.dart test/individual_payroll_company_scope_test.dart --reporter expanded
      - run: flutter analyze
