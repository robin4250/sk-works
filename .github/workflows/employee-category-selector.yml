name: Employee category selector candidate
on:
  pull_request:
    paths:
      - 'lib/features/people/employee_category_selector.dart'
      - 'test/employee_category_selector_test.dart'
      - '.github/workflows/employee-category-selector.yml'
permissions:
  contents: read
jobs:
  selector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/people/employee_category_selector.dart test/employee_category_selector_test.dart
      - run: flutter test test/employee_category_selector_test.dart
  sql-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: fixture
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Test role boundaries and approval with synthetic rows
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/fixture.sql
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/live-session-fixture.sql
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/require_session.fixture.sql
          for name in apply_worker_personnel_payload worker_personnel_payload save_worker_personnel_profile; do psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/$name.before.sql; done
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/legacy-client-compat-test.sql
          python3 docs/review/employee-category-candidate/native-install-guard-test.py
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/worker_personnel_payload.after.sql
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/employee_personnel_view.after.sql
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/apply_worker_personnel_payload.after.sql
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/save_worker_personnel_profile.after.sql
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/decide.before.sql
          psql -v ON_ERROR_STOP=1 -f docs/review/employee-category-candidate/sql-test.sql
          bash docs/review/employee-category-candidate/concurrency-test.sh
