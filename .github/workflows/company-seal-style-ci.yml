name: Company seal style contracts
on:
  push:
    branches: [main, 'fix/company-seal-aoyagi-*']
    paths:
      - 'assets/fonts/company-seal/aoyagi-reisho/**'
      - 'lib/features/shared/company_seal_pdf.dart'
      - 'lib/features/settings/company_seal*'
      - 'test/company_seal_reisho_pdf_test.dart'
      - 'supabase/migrations/*company_seal_aoyagi_style.sql'
      - 'tool/verify_company_seal_style_sql.mjs'
      - '.github/workflows/company-seal-style-ci.yml'
  pull_request:
    paths:
      - 'assets/fonts/company-seal/aoyagi-reisho/**'
      - 'lib/features/shared/company_seal_pdf.dart'
      - 'lib/features/settings/company_seal*'
      - 'test/company_seal_reisho_pdf_test.dart'
      - 'supabase/migrations/*company_seal_aoyagi_style.sql'
      - 'tool/verify_company_seal_style_sql.mjs'
      - '.github/workflows/company-seal-style-ci.yml'
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/sko-seal-runtime" @electric-sql/pglite@0.3.14
      - run: node tool/verify_company_seal_style_sql.mjs "$RUNNER_TEMP/sko-seal-runtime/node_modules/@electric-sql/pglite/dist/index.js"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/company_seal_reisho_pdf_test.dart
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Render actual Flutter proof
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          path = Path('build/company-seal-proof/company_seal_reisho_balanced.pdf')
          with fitz.open(path) as document:
              for number, page in enumerate(document):
                  page.get_pixmap(matrix=fitz.Matrix(2,2)).save(path.with_name(f'company_seal_reisho_balanced_{number}.png'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: company-seal-reisho-proof
          path: build/company-seal-proof/
