name: Master enrollment intent candidate
on:
  pull_request:
    paths:
      - 'tool/security/master-device-enrollment-candidate/**'
      - '.github/workflows/master-enrollment-intent-candidate.yml'
permissions:
  contents: read
jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts --no-audit --no-fund
      - run: node tool/security/master-device-enrollment-candidate/check-intent.mjs
