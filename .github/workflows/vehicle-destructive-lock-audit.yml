name: Vehicle Destructive Lock Audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'tool/audit_vehicle_destructive_lock_interleavings.mjs'
      - 'tool/fixtures/attendance_race/**'
      - 'supabase/migrations/20261008042058_fix_managed_attendance_overnight_chronology.sql'
      - 'supabase/migrations/20261008124940_gps_shift_work_date_evidence.sql'
      - 'supabase/migrations/20261001232457_add_daily_report_vehicle_usage_rpc.sql'
      - '.github/workflows/vehicle-destructive-lock-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [company-start, company-meter, admin-meter]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: sko_race_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_race_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable fixture provenance
        run: |
          sha256sum --check tool/fixtures/attendance_race/SHA256SUMS
      - name: Audit strict destructive-operation lock ordering
        env:
          SKO_RACE_DATABASE_URL: postgres://postgres:fixture-only-password@127.0.0.1:5432/sko_race_fixture
          SKO_LOCK_SCENARIO: ${{ matrix.scenario }}
        run: |
          npm install --prefix "$RUNNER_TEMP/sko-race-runtime" --save-exact pg@8.16.3
          node tool/audit_vehicle_destructive_lock_interleavings.mjs "$RUNNER_TEMP/sko-race-runtime/node_modules/pg/lib/index.js" "$SKO_LOCK_SCENARIO"
