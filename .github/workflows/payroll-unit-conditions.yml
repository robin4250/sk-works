name: Payroll unit conditions
on:
  pull_request:
    paths:
      - 'lib/features/payroll/payroll_unit*'
      - 'lib/features/payroll/individual_payroll_settings*'
      - 'supabase/migrations/20261013175452_payroll_unit_conditions.sql'
      - 'tool/verify_payroll_unit_conditions.mjs'
      - 'test/payroll_unit_conditions*'
      - '.github/workflows/payroll-unit-conditions.yml'
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/sko-unit-sql --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node tool/verify_payroll_unit_conditions.mjs /tmp/sko-unit-sql/node_modules/@electric-sql/pglite/dist/index.js
