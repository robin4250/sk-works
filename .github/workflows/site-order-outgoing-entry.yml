name: Site-order RAM input and company selection
on:
  pull_request:
    paths:
      - 'lib/features/sites/site_order_outgoing_entries.dart'
      - 'lib/features/sites/site_order_outgoing_entry_page.dart'
      - 'test/site_order_outgoing_entry_page_test.dart'
      - '.github/workflows/site-order-outgoing-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outgoing-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib/features/sites/site_order_outgoing_entries.dart lib/features/sites/site_order_outgoing_entry_page.dart test/site_order_outgoing_entry_page_test.dart
      - run: flutter test test/site_order_outgoing_entry_page_test.dart --reporter expanded
