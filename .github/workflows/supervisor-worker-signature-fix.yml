name: Supervisor trusted worker materialization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/review/supervisor-worker-signature-fix/**'
      - '.github/workflows/supervisor-worker-signature-fix.yml'
permissions:
  contents: read
jobs:
  focused-native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 tool/prepare_checkout_paid_hours.py --output "$RUNNER_TEMP/paid-hours-v1-patches.sql"
      - run: python3 tool/prepare_checkout_shared_hours_v2.py --output "$RUNNER_TEMP/shared-hours-v2-patches.sql"
      - name: Check generated regression syntax without connecting
        env:
          SKO_SUPERVISOR_WORKER_EMIT_ONLY: ${{ runner.temp }}/supervisor-worker-regression.mjs
        run: |
          node --check docs/review/supervisor-worker-signature-fix/verify_native.mjs
          node docs/review/supervisor-worker-signature-fix/verify_native.mjs
          node --check "$RUNNER_TEMP/supervisor-worker-regression.mjs"
      - name: Reproduce observed nullable shape then verify minimal fix and financial retry
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
          SKO_PAID_HOURS_PATCHES: ${{ runner.temp }}/paid-hours-v1-patches.sql
          SKO_SHARED_HOURS_V2_PATCHES: ${{ runner.temp }}/shared-hours-v2-patches.sql
        run: >-
          node docs/review/supervisor-worker-signature-fix/verify_native.mjs
          "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
