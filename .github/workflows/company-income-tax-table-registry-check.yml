name: Company income tax table registry SQL
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*company_income_tax_table_registry.sql'
      - 'supabase/tests/company_income_tax_table_registry_bootstrap.sql'
      - 'tool/verify_company_income_tax_table_registry.mjs'
      - '.github/workflows/company-income-tax-table-registry-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*company_income_tax_table_registry.sql'
      - 'supabase/tests/company_income_tax_table_registry_bootstrap.sql'
      - 'tool/verify_company_income_tax_table_registry.mjs'
      - '.github/workflows/company-income-tax-table-registry-check.yml'
permissions:
  contents: read
jobs:
  isolated-income-tax-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated pinned SQL runtime
        run: npm install --prefix "$RUNNER_TEMP/sko-income-tax" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Check harness syntax
        run: node --check tool/verify_company_income_tax_table_registry.mjs
      - name: Exercise exact staged migration and non-owner access
        run: node tool/verify_company_income_tax_table_registry.mjs "$RUNNER_TEMP/sko-income-tax/node_modules/@electric-sql/pglite/dist/index.js"
