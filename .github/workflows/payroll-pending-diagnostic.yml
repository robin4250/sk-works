name: Payroll pending attendance diagnostic
on:
  push:
    branches: [support/payroll-pending-diagnostic-20261019]
permissions:
  contents: read
jobs:
  exact-six-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c00bb19e85fcb517ffed7b29b3f59db4e8fd203a
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Exact PR source, time bounded new tests
        run: timeout --signal=TERM 180s flutter test test/payroll_pending_attendance_test.dart test/payroll_pending_attendance_panel_test.dart --reporter expanded
