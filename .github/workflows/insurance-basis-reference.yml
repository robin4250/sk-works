name: Insurance basis reference
on:
  pull_request:
    paths:
      - 'docs/candidates/insurance_basis_reference_20261024.sql.review-only'
      - 'tool/verify_insurance_basis_reference.mjs'
      - 'tool/prepare_insurance_basis_reference.py'
      - 'tool/insurance_basis_reference_inventory.read-only.sql'
      - 'tool/fixtures/insurance_reference_*.sql'
      - '.github/workflows/insurance-basis-reference.yml'
permissions:
  contents: read
jobs:
  native-reference-save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: insurance_reference_fixture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d insurance_reference_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_INSURANCE_REFERENCE_FIXTURE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/insurance_reference_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/insurance-reference" --no-save --ignore-scripts --no-audit --no-fund pg@8.16.3
      - run: node tool/verify_insurance_basis_reference.mjs "$RUNNER_TEMP/insurance-reference/node_modules/pg/lib/index.js"
