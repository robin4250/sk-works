name: Shared checkout complete unused OFF restore
on:
  pull_request:
    paths:
      - 'docs/candidates/*checkout*.sql.review-only'
      - 'docs/candidates/shared_daily_report*.sql.review-only'
      - 'docs/candidates/closed_day_paid_hours_scope.sql.review-only'
      - 'tool/security/shared_checkout_unused_restore.mjs'
      - 'tool/verify_shared_checkout_unused_restore.mjs'
      - 'tool/prepare_checkout_paid_hours.py'
      - 'tool/prepare_checkout_shared_hours_v2.py'
      - 'tool/fixtures/checkout_shared_hours_v2_helpers.json'
      - '.github/workflows/shared-checkout-unused-restore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-off-unused-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 tool/prepare_checkout_paid_hours.py --output "$RUNNER_TEMP/paid-hours-v1-patches.sql"
      - run: python3 tool/prepare_checkout_shared_hours_v2.py --output "$RUNNER_TEMP/shared-hours-v2-patches.sql"
      - run: node --check tool/security/shared_checkout_unused_restore.mjs && node --check tool/verify_shared_checkout_unused_restore.mjs
      - name: Full OFF install, exact unused restore and all original source cases
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
          SKO_PAID_HOURS_PATCHES: ${{ runner.temp }}/paid-hours-v1-patches.sql
          SKO_SHARED_HOURS_V2_PATCHES: ${{ runner.temp }}/shared-hours-v2-patches.sql
          SKO_RESTORE_PROOF_OUTPUT: ${{ runner.temp }}/shared-checkout-restore-proof
        run: |
          mkdir -p "$SKO_RESTORE_PROOF_OUTPUT"
          node tool/verify_shared_checkout_unused_restore.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: shared-checkout-unused-restore-proof
          path: ${{ runner.temp }}/shared-checkout-restore-proof
          retention-days: 7
