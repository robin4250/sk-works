name: Payroll position transfer
on:
  pull_request:
    paths:
      - 'lib/features/payroll/payroll_position_transfer.dart'
      - 'lib/features/payroll/payroll_pdf_service.dart'
      - 'test/payroll_position_transfer_test.dart'
      - '.github/workflows/payroll-position-transfer.yml'
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/payroll/payroll_position_transfer.dart lib/features/payroll/payroll_pdf_service.dart test/payroll_position_transfer_test.dart
      - run: flutter test --reporter expanded test/payroll_position_transfer_test.dart test/payroll_recorded_unit_evidence_test.dart
  snapshot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare actual functions using synthetic data
        env:
          PGPASSWORD: synthetic_only
        run: psql -h localhost -U postgres -d postgres -f docs/review/payroll-position-transfer/sql/synthetic-test.sql
