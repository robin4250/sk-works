name: Atomic canonical document evidence review
on:
  pull_request:
    paths:
      - 'docs/review/atomic-document-evidence/**'
      - '.github/workflows/atomic-document-evidence.yml'
permissions:
  contents: read
jobs:
  actual-helpers-pglite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: |
          ln -s "$PWD/tool/security/fixture_dependencies/node_modules" docs/review/atomic-document-evidence/node_modules
          node docs/review/atomic-document-evidence/verify.mjs
  actual-helpers-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_scoped_attention_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SKO_SCOPED_ATTENTION_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_scoped_attention_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: |
          ln -s "$PWD/tool/security/fixture_dependencies/node_modules" docs/review/atomic-document-evidence/node_modules
          node docs/review/atomic-document-evidence/verify.mjs
