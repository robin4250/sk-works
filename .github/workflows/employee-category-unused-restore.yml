name: Employee category unused restore
on:
  pull_request:
    paths:
      - 'docs/review/employee-category-candidate/**'
      - '.github/workflows/employee-category-unused-restore.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGPASSWORD: fixture
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Guarded install then unused-only restore on synthetic rows
        run: |
          dir=docs/review/employee-category-candidate
          psql -X -v ON_ERROR_STOP=1 -f "$dir/fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$dir/live-session-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$dir/require_session.fixture.sql"
          python3 "$dir/native-install-guard-test.py"
          python3 "$dir/native-unused-restore-test.py"
