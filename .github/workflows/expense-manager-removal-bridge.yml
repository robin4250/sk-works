name: Expense manager removal Native SDK UI bridge isolated review
on:
  pull_request:
    paths:
      - 'tool/review/expense_manager_removal_bridge_20261101/**'
      - 'test/expense_manager_removal_bridge_test.dart'
      - '.github/workflows/expense-manager-removal-bridge.yml'
concurrency:
  group: expense-manager-removal-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_expense_manager_removal_fixture
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze test/expense_manager_removal_bridge_test.dart
      - run: npm install --prefix "$RUNNER_TEMP/expense-bridge-pg" --no-audit --no-fund --ignore-scripts pg@8.16.3
      - name: Bind disposable server address and start exact loopback bridge
        run: |
          fixture_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')
          test -n "$fixture_ip"
          export SKO_EXPENSE_FIXTURE_SERVER_IP="$fixture_ip"
          node tool/review/expense_manager_removal_bridge_20261101/server.mjs "$RUNNER_TEMP/expense-bridge-pg/node_modules/pg/lib/index.js" > "$RUNNER_TEMP/expense-bridge.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/expense-bridge.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:55439/bridge-info > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/expense-bridge.log"
          exit 1
      - name: Real SDK UI Native round trip only
        env:
          SKO_EXPENSE_NATIVE_BRIDGE: fixture-only
        run: flutter test test/expense_manager_removal_bridge_test.dart --reporter expanded
      - name: Preserve synthetic bridge evidence and close server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/expense-bridge.log"; then cat "$RUNNER_TEMP/expense-bridge.log"; fi
          if test -f "$RUNNER_TEMP/expense-bridge.pid"; then kill "$(cat "$RUNNER_TEMP/expense-bridge.pid")" 2>/dev/null || true; fi
