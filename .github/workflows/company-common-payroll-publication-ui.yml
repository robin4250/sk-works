name: Company common payroll publication UI
on:
  pull_request:
    paths:
      - 'lib/features/payroll/company_common_payroll_page.dart'
      - 'lib/features/payroll/company_common_allowance_repository.dart'
      - 'lib/features/payroll/company_common_allowance_pending_store.dart'
      - 'test/company_common_allowance_connected_test.dart'
      - 'test/company_common_payroll_page_test.dart'
      - 'lib/features/payroll/company_common_allowance_entry_page.dart'
      - 'test/company_common_allowance_entry_test.dart'
      - 'lib/app_v2.dart'
      - 'test/fixtures/company_common_allowance_sql_response.json'
      - 'lib/features/payroll/company_common_payroll_publication_repository.dart'
      - 'lib/features/payroll/company_common_payroll_publication_panel.dart'
      - 'test/company_common_payroll_publication_test.dart'
      - 'lib/features/payroll/company_common_payroll_publication_summary.dart'
      - 'tool/verify_common_payroll_publication_summary.dart'
      - '.github/workflows/company-common-payroll-publication-ui.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart tool/verify_common_payroll_publication_summary.dart
      - run: flutter analyze
      - run: timeout 240s flutter test --reporter expanded --timeout 60s test/company_common_payroll_publication_test.dart test/company_common_allowance_entry_test.dart test/company_common_allowance_connected_test.dart test/company_common_payroll_page_test.dart test/individual_payroll_fixed_footer_test.dart
