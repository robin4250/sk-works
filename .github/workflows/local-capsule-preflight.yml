name: Offline capsule boundary
on:
  pull_request:
    paths:
      - 'tool/security/restoration/**'
      - '.github/workflows/local-capsule-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'tool/security/restoration/**'
      - '.github/workflows/local-capsule-preflight.yml'
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tool/security/restoration -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node tool/security/restoration/verify_catalog.mjs "$PWD/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
