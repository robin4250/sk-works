name: Master dedicated credential settings candidate
on:
  pull_request:
    paths:
      - 'lib/features/settings/master_credential_repository.dart'
      - 'lib/features/settings/master_credential_setup_page.dart'
      - 'test/master_credential_*_test.dart'
      - '.github/workflows/master-credential-settings-ui.yml'
permissions:
  contents: read
jobs:
  isolated-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/settings/master_credential_repository.dart lib/features/settings/master_credential_setup_page.dart test/master_credential_setup_page_test.dart test/master_credential_repository_test.dart
      - run: flutter test test/master_credential_setup_page_test.dart test/master_credential_repository_test.dart
