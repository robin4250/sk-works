name: LINE release capability preparation
on:
  pull_request:
    paths:
      - 'supabase/migrations/*line_general_release_capability*'
      - 'tool/verify_line_release*'
      - 'tool/fixtures/line_release*'
      - 'tool/line_release_fixture_dependencies/**'
      - '.github/workflows/line-release-capability.yml'
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/line_release_fixture_dependencies
      - run: node tool/verify_line_release_fixture_url.mjs
      - run: node tool/verify_line_release_capability.mjs "$PWD/tool/line_release_fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
      - run: node tool/verify_line_release_capability.mjs "$PWD/tool/line_release_fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js" --drift
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_line_release_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_line_release_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_LINE_RELEASE_POSTGRES_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_line_release_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/line_release_fixture_dependencies
      - run: node tool/verify_line_release_fixture_url.mjs
      - run: node tool/verify_line_release_capability.mjs "$PWD/tool/fixtures/line_release_pg_adapter.mjs"
