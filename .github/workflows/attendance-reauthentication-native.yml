name: Attendance server second authentication
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/review/security-server-stepup-candidate/**'
      - 'tool/staged/attendance_reauthentication*.sql'
      - 'tool/staged/reauthentication_proofs.sql'
      - '.github/workflows/attendance-reauthentication-native.yml'
permissions:
  contents: read
jobs:
  attendance-reauthentication-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 tool/prepare_checkout_paid_hours.py --output "$RUNNER_TEMP/paid-hours-v1-patches.sql"
      - run: python3 tool/prepare_checkout_shared_hours_v2.py --output "$RUNNER_TEMP/shared-hours-v2-patches.sql"
      - name: Validate focused loader and generated proof syntax
        env:
          SKO_ATTENDANCE_STEPUP_EMIT_ONLY: ${{ runner.temp }}/management-registered-native.mjs
        run: |
          node --check docs/review/security-server-stepup-candidate/verify_attendance_reauthentication.mjs
          node docs/review/security-server-stepup-candidate/verify_attendance_reauthentication.mjs
          node --check "$RUNNER_TEMP/management-registered-native.mjs"
      - name: Actual force gate, exact proof target, lockout, rollback and concurrent company membership
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
          SKO_PAID_HOURS_PATCHES: ${{ runner.temp }}/paid-hours-v1-patches.sql
          SKO_SHARED_HOURS_V2_PATCHES: ${{ runner.temp }}/shared-hours-v2-patches.sql
        run: node docs/review/security-server-stepup-candidate/verify_attendance_reauthentication.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
