name: Personnel direct read RLS
on:
  pull_request:
    paths:
      - 'supabase/migrations/*personnel_direct_read_permission_guard.sql'
      - 'tool/security/personnel_rls/**'
      - '.github/workflows/personnel-direct-read-rls.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*personnel_direct_read_permission_guard.sql'
      - 'tool/security/personnel_rls/**'
      - '.github/workflows/personnel-direct-read-rls.yml'
permissions:
  contents: read
jobs:
  pglite-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node tool/security/personnel_rls/verify.mjs "$PWD/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
  postgres-rest-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_personnel_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_personnel_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgrest:
        image: postgrest/postgrest:v16.4
        env:
          PGRST_DB_URI: postgres://postgres:fixture-only@postgres:5432/sko_personnel_fixture
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_JWT_SECRET: synthetic-personnel-fixture-secret-at-least-32-characters
        ports: ['3000:3000']
    env:
      SKO_PERSONNEL_FIXTURE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/sko_personnel_fixture
      SKO_PERSONNEL_POSTGREST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node tool/security/personnel_rls/verify.mjs "$PWD/tool/security/personnel_rls/pg_adapter.mjs"
