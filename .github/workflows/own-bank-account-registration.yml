name: Own bank account registration
on:
  pull_request:
    paths:
      - 'lib/features/people/own_bank_account_*'
      - 'lib/features/people/own_document_registration_page.dart'
      - 'test/own_bank_account_*'
      - 'tool/security/own_bank_account_*'
      - '.github/workflows/own-bank-account-registration.yml'
permissions:
  contents: read
jobs:
  client:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/own_bank_account_entry_test.dart
