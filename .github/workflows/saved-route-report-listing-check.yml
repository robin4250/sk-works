name: Saved route report listing
on:
  pull_request:
    paths: ['supabase/migrations/*route_saved_report_listing.sql', 'tool/verify_route_saved_report_listing.mjs', '.github/workflows/saved-route-report-listing-check.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/*route_saved_report_listing.sql', 'tool/verify_route_saved_report_listing.mjs', '.github/workflows/saved-route-report-listing-check.yml']
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm install --prefix "$RUNNER_TEMP/sko-route-reading" --save-exact --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - run: node tool/verify_route_saved_report_listing.mjs "$RUNNER_TEMP/sko-route-reading/node_modules/@electric-sql/pglite/dist/index.js"
