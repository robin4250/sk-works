name: Compact Financial Preview
on:
  pull_request:
    paths:
      - 'lib/features/invoices/invoice_cloud_page.dart'
      - 'lib/features/invoices/invoice_pdf_service.dart'
      - 'lib/features/payroll/payment_certificates_page.dart'
      - 'lib/features/shared/financial_preview_chrome.dart'
      - 'lib/features/shared/trade_document_output_page.dart'
      - 'test/financial_preview*'
      - '.github/workflows/financial-preview-compact.yml'
jobs:
  viewport-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/shared/financial_preview_chrome.dart lib/features/shared/trade_document_output_page.dart lib/features/invoices/invoice_pdf_service.dart lib/features/invoices/invoice_cloud_page.dart lib/features/payroll/payment_certificates_page.dart test/financial_preview_chrome_test.dart test/financial_preview_entry_test.dart test/financial_preview_uses_template_pdf_contract_test.dart
      - run: flutter test test/financial_preview_chrome_test.dart test/financial_preview_entry_test.dart test/financial_preview_uses_template_pdf_contract_test.dart test/trade_document_output_page_scope_test.dart test/invoice_preview_guidance_test.dart test/trade_document_format_ui_connection_test.dart test/payment_certificate_pdf_contract_test.dart test/invoice_approval_and_zoom_contract_test.dart test/pdf_pinch_pages_test.dart
