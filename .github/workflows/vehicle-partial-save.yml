name: Vehicle partial save protection
on:
  pull_request:
    paths:
      - 'lib/features/operations/vehicle_editor_page.dart'
      - 'test/vehicle_editor_partial_save_test.dart'
      - '.github/workflows/vehicle-partial-save.yml'
permissions:
  contents: read
jobs:
  vehicle-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/operations/vehicle_editor_page.dart test/vehicle_editor_partial_save_test.dart
      - run: flutter test test/vehicle_editor_partial_save_test.dart
