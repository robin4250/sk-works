name: Home scroll regressions
on:
  pull_request:
    paths:
      - 'lib/app_v2.dart'
      - 'test/home_scroll_rebuild_scope_test.dart'
      - 'lib/features/home/friendly_home_content.dart'
      - 'lib/widgets/sko_scroll_chrome.dart'
      - 'lib/features/notifications/notification_bell.dart'
      - 'test/sko_scroll_chrome*'
      - '.github/workflows/home-scroll-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'lib/app_v2.dart'
      - 'test/home_scroll_rebuild_scope_test.dart'
      - 'lib/features/home/friendly_home_content.dart'
      - 'lib/widgets/sko_scroll_chrome.dart'
      - 'lib/features/notifications/notification_bell.dart'
      - '.github/workflows/home-scroll-regressions.yml'
permissions:
  contents: read
jobs:
  home-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter test test/home_scroll_rebuild_scope_test.dart test/navigation_test.dart --reporter expanded
      - run: flutter test test/device_ui_review_20261002_contract_test.dart test/sko_scroll_chrome_direction_test.dart test/sko_scroll_chrome_widget_test.dart test/home_footer_and_scroll_ui_test.dart test/home_button_reorder_geometry_test.dart test/weather_home_card_geometry_test.dart test/traffic_home_card_test.dart test/route_billing_notification_entry_test.dart --reporter expanded
      - run: flutter analyze
