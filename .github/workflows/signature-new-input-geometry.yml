name: New signature input geometry
on:
  pull_request:
    paths:
      - 'docs/review/signature-new-input-geometry/**'
      - 'tool/verify_signature_new_input_geometry.mjs'
      - 'test/fixtures/signature_input_geometry_cases.json'
      - 'test/signature_server_geometry_contract_test.dart'
      - '.github/workflows/signature-new-input-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-new-signature-input:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_signature_input_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 docs/review/signature-new-input-geometry/prepare.py
      - run: git diff --exit-code -- docs/review/signature-new-input-geometry
      - run: node --check tool/verify_signature_new_input_geometry.mjs
      - name: Actual captured writers reject blank and dot-only new signatures
        env:
          SKO_SIGNATURE_INPUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_signature_input_fixture
        run: node tool/verify_signature_new_input_geometry.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
  client-shared-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze test/signature_server_geometry_contract_test.dart
      - run: flutter test --reporter expanded test/signature_server_geometry_contract_test.dart test/signature_blank_keyboard_test.dart test/signature_point_only_regression_test.dart test/signature_ink_frame_test.dart
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
