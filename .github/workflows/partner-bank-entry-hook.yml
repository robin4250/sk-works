name: Partner company bank entry connection
on:
  pull_request:
    paths:
      - 'lib/features/people/people_cloud_page.dart'
      - 'lib/features/people/partner_company_bank_page.dart'
      - 'test/partner_bank_entry_hook_test.dart'
      - '.github/workflows/partner-bank-entry-hook.yml'
permissions:
  contents: read
jobs:
  partner-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/people/people_cloud_page.dart test/partner_bank_entry_hook_test.dart
      - run: flutter test test/partner_bank_entry_hook_test.dart
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
