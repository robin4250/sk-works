name: Management common allowance UI
on:
  pull_request:
    paths:
      - 'lib/features/attendance/attendance_management*.dart'
      - 'test/attendance_management*.dart'
      - '.github/workflows/management-common-allowance-ui.yml'
permissions:
  contents: read
jobs:
  registered-allowance-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Analyze affected management components
        run: >-
          flutter analyze
          lib/features/attendance/attendance_management_page.dart
          lib/features/attendance/attendance_management_repository.dart
          lib/features/attendance/attendance_management_company_allowances.dart
          lib/features/attendance/attendance_management_company_allowance_field.dart
          test/attendance_management_company_allowance_test.dart
      - name: Registered identities, stale reads and unchanged management operations
        run: >-
          timeout 420s flutter test --reporter expanded --timeout 60s
          test/attendance_management_company_allowance_test.dart
          test/attendance_management_clock_precision_test.dart
          test/attendance_management_report_navigation_test.dart
          test/attendance_management_page_contract_test.dart
          test/attendance_unrecorded_punches_test.dart
