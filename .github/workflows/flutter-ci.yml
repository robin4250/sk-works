name: Flutter CI

on:
  push:
    branches: [main, 'fix/**']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell helpers
        run: |
          set -e
          for script in tool/*.sh; do
            bash -n "$script"
          done

      - name: Verify migration file integrity
        run: bash tool/check_migration_files.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify pinned Flutter
        run: flutter --version

      - name: Create Android project files
        run: flutter create . --platforms=android --project-name sk_works --org com.skworks

      - name: Scan tracked files for production secrets
        run: bash tool/check_no_client_secrets.sh

      - name: Verify dependency pins
        run: bash tool/check_dependency_pins.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock

      - name: Verify isolated approval and bank SQL
        run: |
          npm install --prefix "$RUNNER_TEMP/sko-sql-runtime" --save-exact @electric-sql/pglite@0.3.14
          node tool/verify_invoice_approval_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_payroll_calculation_invariants.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/audit_payment_certificate_math.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_invoice_calculation_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/audit_payroll_empty_month.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_attendance_overnight.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_paid_leave_overlap_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_payroll_live_linkage.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js" supabase/migrations/20261008042817_prevent_paid_leave_attendance_overlap.sql supabase/migrations/20261008043151_align_future_attendance_monthly_payroll_boundary.sql
          node tool/verify_future_attendance_payroll_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_company_rate_atomic_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_calculation_source_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_payroll_financial_conditions_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node tool/verify_payroll_named_financial_detail_sql.mjs "$RUNNER_TEMP/sko-sql-runtime/node_modules/@electric-sql/pglite/dist/index.js" supabase/migrations/20261008045401_preserve_payroll_named_financial_details.sql

      - name: Prepare adopted PDF verification
        run: |
          python -m pip install PyMuPDF==1.26.6 fonttools==4.61.1
          python tool/prepare_pdf_fixture_font.py

      - name: Test
        env:
          SKO_PDF_FONT_PATH: build/pdf-fixtures/NotoSansJP-Regular.ttf
          SKO_PDF_OUTPUT_DIR: build/pdf-fixtures
        run: flutter test

      - name: Save generated adopted PDF comparison files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopted-report-pdf-comparison
          path: build/pdf-fixtures/*.pdf
          if-no-files-found: warn

      - name: Pre-device release gate
        run: bash tool/pre_device_release_gate.sh

      - name: Build Android debug APK
        run: flutter build apk --debug
