name: Flutter CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'README.md'

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Verify pinned Flutter
        run: flutter --version

      - name: Create Android project files
        run: flutter create . --platforms=android --project-name sk_works --org com.skworks

      - name: Scan tracked files for production secrets
        run: bash tool/check_no_client_secrets.sh

      - name: Verify dependency pins
        run: bash tool/check_dependency_pins.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
