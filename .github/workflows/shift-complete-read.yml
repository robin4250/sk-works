name: Shift complete attendance read
on:
  pull_request:
    branches: [main, draft/shift-status-20261027]
    paths:
      - 'lib/features/shifts/shift_schedule_editor.dart'
      - 'test/shift_schedule_editor_test.dart'
      - 'lib/features/shifts/shift_attendance_status.dart'
      - 'test/shift_attendance_status_test.dart'
      - '.github/workflows/shift-complete-read.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/shifts/shift_attendance_status.dart test/shift_attendance_status_test.dart lib/features/shifts/shift_schedule_editor.dart test/shift_schedule_editor_test.dart
      - run: flutter test --reporter expanded test/shift_attendance_status_test.dart test/shift_schedule_editor_test.dart
