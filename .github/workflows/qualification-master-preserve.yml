name: Qualification master preserve references
on:
  pull_request:
    paths:
      - 'docs/review/qualification-master-access/delete-preserve*'
      - '.github/workflows/qualification-master-preserve.yml'
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f docs/review/qualification-master-access/delete-preserve-test.sql
        env:
          PGPASSWORD: postgres
