name: Employee retirement roster return
on:
  pull_request:
    paths:
      - 'lib/features/people/people_cloud_page.dart'
      - 'test/employee_retirement_roster_refresh_test.dart'
      - '.github/workflows/employee-retirement-roster-refresh.yml'
permissions:
  contents: read
jobs:
  roster-return:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze lib/features/people/people_cloud_page.dart test/employee_retirement_roster_refresh_test.dart
      - run: flutter test test/employee_retirement_roster_refresh_test.dart test/employee_retirement_test.dart test/personnel_privacy_session_test.dart --reporter expanded
