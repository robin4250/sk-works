name: Payroll draft current seal
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261011053152_payroll_draft_current_seal.sql'
      - 'tool/verify_payroll_draft_current_seal.mjs'
      - 'test/payroll_current_seal_pdf_test.dart'
      - '.github/workflows/payroll-draft-current-seal.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261011053152_payroll_draft_current_seal.sql'
      - 'tool/verify_payroll_draft_current_seal.mjs'
      - 'test/payroll_current_seal_pdf_test.dart'
      - '.github/workflows/payroll-draft-current-seal.yml'
permissions:
  contents: read
jobs:
  sql-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/payroll-seal" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify real draft metadata and first finalization
        run: node tool/verify_payroll_draft_current_seal.mjs "$RUNNER_TEMP/payroll-seal/node_modules/@electric-sql/pglite/dist/index.js" supabase/migrations/20261011053152_payroll_draft_current_seal.sql
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python -m pip install PyMuPDF==1.26.6 fonttools==4.61.1
      - run: python tool/prepare_pdf_fixture_font.py
      - name: Verify actual SQL rows in adopted payslip PDF
        env:
          SKO_PAYROLL_SEAL_FIXTURE_PATH: build/payroll-current-seal/response.json
          SKO_PDF_FONT_PATH: build/pdf-fixtures/NotoSansJP-Regular.ttf
        run: flutter test test/payroll_current_seal_pdf_test.dart
      - name: Render proof pages
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          for path in Path('build/payroll-current-seal-proof').glob('*.pdf'):
              with fitz.open(path) as document:
                  document[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(str(path.with_suffix('.png')))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: payroll-current-seal-proof
          path: |
            build/payroll-current-seal/response.json
            build/payroll-current-seal-proof/*
          if-no-files-found: error
  postgres17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: sko_payroll_scope_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/payroll-seal" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Verify current draft seal and immutable finalized rows
        env:
          SKO_PAYROLL_SCOPE_FIXTURE_URL: postgres://postgres:fixture-only-password@127.0.0.1:5432/sko_payroll_scope_fixture
        run: node tool/verify_payroll_draft_current_seal.mjs "$RUNNER_TEMP/payroll-seal/node_modules/pg/lib/index.js" supabase/migrations/20261011053152_payroll_draft_current_seal.sql --postgres
