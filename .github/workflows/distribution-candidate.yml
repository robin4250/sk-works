name: Invitation distribution candidate
on:
  pull_request:
    paths:
      - 'docs/candidates/app_distribution_channels_20261020.sql.review-only'
      - 'docs/review/app_distribution_channels_20261020.md'
      - 'tool/verify_distribution_candidate.mjs'
      - 'tool/security/distribution_*'
      - 'supabase/migrations/*app_referral_invites.sql'
      - 'tool/security/fixture_dependencies/**'
      - '.github/workflows/distribution-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'docs/candidates/app_distribution_channels_20261020.sql.review-only'
      - 'tool/verify_distribution_candidate.mjs'
      - 'tool/security/distribution_*'
      - 'supabase/migrations/*app_referral_invites.sql'
      - 'tool/security/fixture_dependencies/**'
      - '.github/workflows/distribution-candidate.yml'
permissions:
  contents: read
jobs:
  channel-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/verify_distribution_candidate.mjs
        env:
          PGLITE_PACKAGE: ${{ github.workspace }}/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js
  native-channel-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_distribution_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_distribution_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/security/distribution_fixture_guard_test.mjs
      - run: node tool/verify_distribution_candidate.mjs
        env:
          PGLITE_PACKAGE: ${{ github.workspace }}/tool/security/distribution_pg_adapter.mjs
          SKO_DISTRIBUTION_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_distribution_fixture
