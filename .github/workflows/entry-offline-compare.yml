name: Offline entry comparison
on:
  pull_request:
    paths:
      - 'tool/security/restoration/entry_compare.py'
      - 'tool/security/restoration/test_entry_compare.py'
      - '.github/workflows/entry-offline-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Synthetic boundary tests without credentials or database
        run: python -m unittest discover -s tool/security/restoration -p 'test_entry_compare.py' -v
