name: Custom chat photo object paths
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261013193329_qualify_custom_chat_photo_object_paths.sql'
      - 'tool/chat_photo_policy_before_fixture.sql'
      - 'tool/verify_custom_chat_photo_path_policies.mjs'
      - '.github/workflows/custom-chat-photo-path-policies.yml'
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/sko-photo-policy-test --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node tool/verify_custom_chat_photo_path_policies.mjs /tmp/sko-photo-policy-test/node_modules/@electric-sql/pglite/dist/index.js
