name: Document financial re-signing UI
on:
  pull_request:
    paths:
      - 'lib/features/daily_reports/daily_report_page.dart'
      - 'lib/features/daily_reports/shared_daily_report_repository.dart'
      - 'lib/features/daily_reports/shared_worker_facts_repository.dart'
      - 'test/daily_report_shared_hours_integration_test.dart'
      - 'test/shared_daily_report_repository_test.dart'
      - '.github/workflows/document-financial-resigning-ui.yml'
permissions:
  contents: read
concurrency:
  group: financial-resigning-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Analyze touched financial transition UI
        run: >-
          flutter analyze
          lib/features/daily_reports/daily_report_page.dart
          lib/features/daily_reports/shared_daily_report_repository.dart
          lib/features/daily_reports/shared_worker_facts_repository.dart
          test/daily_report_shared_hours_integration_test.dart
          test/shared_daily_report_repository_test.dart
      - name: Context contract and actual report page flow
        run: >-
          timeout 480s flutter test --reporter expanded --timeout 60s
          test/shared_daily_report_repository_test.dart
          test/shared_worker_facts_repository_test.dart
          test/daily_report_shared_hours_integration_test.dart
