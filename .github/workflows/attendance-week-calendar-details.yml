name: Attendance week and calendar details
on:
  pull_request:
    paths:
      - 'lib/features/attendance/worker_attendance_sheet*.dart'
      - 'lib/features/attendance/attendance_pending_report_details.dart'
      - 'test/attendance_week_calendar_details_test.dart'
      - 'test/worker_attendance_registered_allowances_test.dart'
      - '.github/workflows/attendance-week-calendar-details.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/attendance/worker_attendance_sheet_page.dart lib/features/attendance/worker_attendance_sheet_repository.dart lib/features/attendance/attendance_pending_report_details.dart test/attendance_week_calendar_details_test.dart test/worker_attendance_registered_allowances_test.dart
      - run: flutter test test/attendance_week_calendar_details_test.dart test/worker_attendance_registered_allowances_test.dart test/attendance_week_holiday_label_test.dart test/attendance_calendar_weekend_color_contract_test.dart test/attendance_sheet_paid_leave_footer_actions_contract_test.dart test/attendance_sheet_correction_entry_contract_test.dart test/attendance_restore_contract_test.dart
