name: Invoice order acceptance PDF proof
on:
  pull_request:
    paths:
      - 'lib/features/invoices/**'
      - 'lib/features/shared/trade_document*'
      - 'test/invoice_order_acceptance_pdf_test.dart'
      - 'test/invoice_acceptance_resolver_test.dart'
      - '.github/workflows/invoice-order-acceptance-pdf.yml'
  push:
    branches: [main, 'feat/invoice-order-*', 'feat/payment-order-*']
    paths:
      - 'lib/features/invoices/**'
      - 'lib/features/shared/trade_document*'
      - 'test/invoice_order_acceptance_pdf_test.dart'
      - 'test/invoice_acceptance_resolver_test.dart'
      - '.github/workflows/invoice-order-acceptance-pdf.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/invoice_order_acceptance_pdf_test.dart test/invoice_acceptance_resolver_test.dart
        env:
          SKO_PDF_OUTPUT_DIR: build/invoice-acceptance-proof
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Check actual page order, date, parties and invoice amounts
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          paths = list(Path('build/invoice-acceptance-proof').glob('*.pdf'))
          assert len(paths) == 4, paths
          for path in paths:
              with fitz.open(path) as doc:
                  expected = 3 if 'automatic' in path.stem else 2 if path.stem.startswith('invoice-with-') else 1
                  assert len(doc) == expected, (path, len(doc))
                  page = doc[1] if path.stem.startswith('invoice-with-') else doc[0]
                  if 'automatic' in path.stem:
                      assert '工事請負契約条項' in ''.join(doc[2].get_text().split()),path
                  text = ''.join(page.get_text().split())
                  order_date = '2026-09-15' if 'automatic' in path.stem else '2026年10月15日'
                  acceptance_date = '2026年9月30日' if 'automatic' in path.stem else '2026年10月16日'
                  assert ('請書' if 'automatic' in path.stem else '注文請書') in text and order_date in text and acceptance_date in text, (path, text)
                  assert '株式会社発注' in text and '株式会社受注' in text
                  assert '9876543210987' in text and ('殿' if 'automatic' in path.stem else '御中') in text
                  assert '2026-10月分' in text and '代表者名' in text
                  if path.stem.endswith('-long'):
                      assert '備考条件確認済み。' * 60 in text
                      assert '追加条件を確認します。' * 30 in text
                      assert '代表' * 40 in text
                  if expected >= 2:
                      first = ''.join(doc[0].get_text().split())
                      assert '請求書' in first and '注文請書' not in first
                      assert '110,000' in first and '100,000' in first and '10,000' in first, first
                  for block in page.get_text('dict')['blocks']:
                      if block['type']==0:
                          for line in block['lines']:
                              for span in line['spans']:
                                  if '代表代表' in span['text']:
                                      assert span['bbox'][2] <= page.rect.width-48+1,(path,span)
                  # The seal now overlays the issuer company name, not the representative row.
                  spans = [s for b in page.get_text('dict')['blocks'] for l in b.get('lines', []) for s in l['spans']]
                  # Find the complete issuer text across wrapped lines, then use
                  # the final printed line: the seal is centered on its right end.
                  chars = [c for b in page.get_text('rawdict')['blocks']
                           for l in b.get('lines', []) for s in l['spans']
                           if s.get('color', 0) == 0 for c in s['chars']
                           if not c['c'].isspace()]
                  visible = ''.join(c['c'] for c in chars)
                  expected_name = '株式会社受注' * (20 if path.stem.endswith('-long') else 1)
                  start = visible.find(expected_name)
                  assert start >= 0, (path, 'full issuer name missing', expected_name)
                  name = chars[start:start + len(expected_name)]
                  final_y = max((c['bbox'][1] + c['bbox'][3]) / 2 for c in name)
                  final_line = [c['bbox'] for c in name
                                if abs((c['bbox'][1] + c['bbox'][3]) / 2 - final_y) < 2]
                  issuer = (min(b[0] for b in final_line), min(b[1] for b in final_line),
                            max(b[2] for b in final_line), max(b[3] for b in final_line))
                  image = page.get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
                  samples = image.samples
                  red = [(x/1.5, y/1.5) for y in range(image.height) for x in range(image.width)
                         if samples[y*image.stride+x*image.n] > 170
                         and samples[y*image.stride+x*image.n+1] < 110
                         and samples[y*image.stride+x*image.n+2] < 110]
                  assert red, (path, 'issuer seal missing')
                  seal = (min(x for x,y in red), min(y for x,y in red), max(x for x,y in red), max(y for x,y in red))
                  if 'automatic' in path.stem:
                      assert seal[0]>=34-1 and seal[2]<=page.rect.width-34+1 and seal[3]<174,(path,'new form issuer seal outside header',seal)
                      assert min(seal[2],issuer[2])>max(seal[0],issuer[0]) and min(seal[3],issuer[3])>max(seal[1],issuer[1]),(path,'new form seal must overlap name end',seal,issuer)
                      assert abs((seal[0]+seal[2])/2-issuer[2])<=4 and abs((seal[1]+seal[3]-issuer[1]-issuer[3])/2)<=6,(path,'new form name anchor',seal,issuer)
                  else:
                      assert min(seal[2],issuer[2]) > max(seal[0],issuer[0]) and min(seal[3],issuer[3]) > max(seal[1],issuer[1]), (path, seal, issuer)
                      assert abs((seal[0]+seal[2])/2-issuer[2]) <= 4, (path, 'seal not centered at name end', seal, issuer)
                      assert abs((seal[1]+seal[3]-issuer[1]-issuer[3])/2) <= 6, (path, seal, issuer)
                      assert seal[0] >= 48-1 and seal[2] <= page.rect.width-48+1, (path, 'seal outside party column', seal)
                  for span in spans:
                      if '代表代表' in span['text']:
                          box = span['bbox']
                          assert min(seal[2],box[2]) <= max(seal[0],box[0]) or min(seal[3],box[3]) <= max(seal[1],box[1]), (path, 'seal overlaps representative', seal, box)
                  for index, rendered in enumerate(doc):
                      for block in rendered.get_text('blocks'):
                          assert block[0] >= -1 and block[1] >= -1 and block[2] <= rendered.rect.width+1 and block[3] <= rendered.rect.height+1, (path, index, block[:4])
                      rendered.get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(path.with_name(f'{path.stem}-{index+1}.png'))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: invoice-acceptance-pdf-proof
          path: build/invoice-acceptance-proof/

