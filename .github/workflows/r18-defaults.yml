name: R18 initial appendix defaults
on:
  pull_request:
    paths:
      - 'lib/features/invoices/invoice_acceptance_resolver.dart'
      - 'test/invoice_acceptance_resolver_test.dart'
      - 'lib/features/shared/r18_defaults.dart'
      - 'lib/features/shared/trade_document_attachment_editor_page.dart'
      - 'test/r18*'
      - '.github/workflows/r18-defaults.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/invoice_acceptance_resolver_test.dart test/r18_defaults_test.dart test/r18_editor_defaults_contract_test.dart test/trade_document_actor_boundary_test.dart test/invoice_order_acceptance_pdf_test.dart test/payment_order_pdf_test.dart
