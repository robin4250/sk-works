name: Worker document photo upload scope
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*worker_document_photo_upload_scope.sql'
      - 'tool/verify_worker_document_photo_upload_scope.mjs'
      - 'supabase/tests/license_document_upload_pilot_assertions.sql'
      - '.github/workflows/worker-document-photo-upload-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: sko_paid_leave_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_paid_leave_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned disposable database clients
        run: npm install --prefix "$RUNNER_TEMP/worker-photo-sql" --save-exact --ignore-scripts --no-audit --no-fund pg@8.16.3 @electric-sql/pglite@0.5.8
      - name: PGlite role and preservation checks
        run: node tool/verify_worker_document_photo_upload_scope.mjs "$RUNNER_TEMP/worker-photo-sql/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Real PostgreSQL 17 role and preservation checks
        env:
          SKO_PAID_LEAVE_FIXTURE_URL: postgres://postgres:fixture-only-password@127.0.0.1:5432/sko_paid_leave_fixture
        run: node tool/verify_worker_document_photo_upload_scope.mjs "$RUNNER_TEMP/worker-photo-sql/node_modules/pg/lib/index.js" --pg17
