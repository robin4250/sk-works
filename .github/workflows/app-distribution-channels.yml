name: App distribution channels
on:
  pull_request:
    paths:
      - 'tool/staged/app_distribution_channels.sql'
      - 'lib/features/referrals/**'
      - 'lib/features/people/employee_initial_registration_page.dart'
      - 'lib/features/companies/trade_company_page.dart'
      - 'test/app_referral_distribution_test.dart'
      - 'tool/test_app_distribution_channels.mjs'
      - '.github/workflows/app-distribution-channels.yml'
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --prefix /tmp/distribution-sql --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node tool/test_app_distribution_channels.mjs
        env:
          PGLITE_PACKAGE: /tmp/distribution-sql/node_modules/@electric-sql/pglite/dist/index.js
  distribution-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/referrals lib/features/people/employee_initial_registration_page.dart test/app_referral_distribution_test.dart
      - run: flutter test test/app_referral_distribution_test.dart test/app_referral_composer_test.dart test/app_referral_personal_entry_test.dart test/app_referral_master_entry_test.dart --reporter expanded
