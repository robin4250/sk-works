name: LINE historical invoice bridge
on:
  pull_request:
    paths:
      - 'lib/features/chat/line_historical_invoice*'
      - 'supabase/migrations/*line_historical_invoice_bridge*'
      - 'tool/verify_line_historical_invoice_bridge*'
      - 'tool/fixtures/line_historical_invoice_bridge_fixture.mjs'
      - 'test/line_historical_invoice_bridge*'
      - '.github/workflows/line-historical-invoice-bridge.yml'
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/line-bridge-sql" --save-exact @electric-sql/pglite@0.3.14
      - run: node tool/verify_line_historical_invoice_bridge.mjs "$RUNNER_TEMP/line-bridge-sql/node_modules/@electric-sql/pglite/dist/index.js"
  postgres-races:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_line_import_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_line_import_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_LINE_IMPORT_POSTGRES_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_line_import_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/line-bridge-pg" --save-exact pg@8.16.3
      - run: ln -s "$RUNNER_TEMP/line-bridge-pg/node_modules" node_modules
      - run: node tool/verify_line_historical_invoice_bridge.mjs tool/fixtures/line_import_pg_adapter.mjs
      - run: node tool/verify_line_historical_invoice_bridge_races.mjs
