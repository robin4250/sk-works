name: Payroll refresh scope order SQL
on:
  pull_request:
    branches: [main]
    paths: ['supabase/migrations/*payroll_refresh_scope_order.sql', 'supabase/tests/payroll_refresh_scope*', 'tool/payroll_scope*', 'tool/verify_payroll_refresh_scope_order.mjs', 'tool/verify_payroll_scope_postgres_race.mjs', '.github/workflows/payroll-refresh-scope-order-check.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/*payroll_refresh_scope_order.sql', 'supabase/tests/payroll_refresh_scope*', 'tool/payroll_scope*', 'tool/verify_payroll_refresh_scope_order.mjs', 'tool/verify_payroll_scope_postgres_race.mjs', '.github/workflows/payroll-refresh-scope-order-check.yml']
permissions:
  contents: read
jobs:
  pglite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix "$RUNNER_TEMP/sko-scope" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node --test tool/payroll_scope_pg17_database_guard.test.mjs
      - run: node tool/verify_payroll_refresh_scope_order.mjs "$RUNNER_TEMP/sko-scope/node_modules/@electric-sql/pglite/dist/index.js"
  native-pg17:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture-only-password, POSTGRES_DB: sko_payroll_scope_fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_PAYROLL_SCOPE_FIXTURE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/sko_payroll_scope_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix "$RUNNER_TEMP/sko-scope" --no-save --ignore-scripts pg@8.16.3
      - run: node tool/verify_payroll_refresh_scope_order.mjs "file://$PWD/tool/payroll_scope_native_pg17_runtime.mjs" "$RUNNER_TEMP/sko-scope/node_modules/pg/lib/index.js"
      - run: node tool/verify_payroll_scope_postgres_race.mjs "$RUNNER_TEMP/sko-scope/node_modules/pg/lib/index.js"
