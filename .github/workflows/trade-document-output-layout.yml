name: Trade document output layout
on:
  pull_request:
    paths:
      - 'lib/features/shared/trade_document_output_layout.dart'
      - 'test/trade_document_output_layout*'
      - '.github/workflows/trade-document-output-layout.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/shared/trade_document_output_layout.dart test/trade_document_output_layout_test.dart
      - run: flutter test test/trade_document_output_layout_test.dart
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python test/trade_document_output_layout_artifact_check.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trade-document-output-layout-proof
          path: build/trade-document-output-layout/
