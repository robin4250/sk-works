name: First-use auth policy
on:
  pull_request:
    paths:
      - lib/features/auth/first_use_auth_policy.dart
      - test/first_use_auth_policy_test.dart
      - .github/workflows/first-use-auth-policy.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/auth/first_use_auth_policy.dart test/first_use_auth_policy_test.dart
      - run: flutter test test/first_use_auth_policy_test.dart --reporter expanded
