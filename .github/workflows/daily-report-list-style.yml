name: Daily report consistent outlined list presentation
on:
  pull_request:
    paths:
      - 'lib/features/daily_reports/daily_report_month_page.dart'
      - 'lib/features/daily_reports/daily_report_save_badge.dart'
      - 'test/daily_report_list_style_test.dart'
      - 'test/daily_report_pending_site_test.dart'
      - 'test/daily_report_visible_status_test.dart'
      - '.github/workflows/daily-report-list-style.yml'
permissions:
  contents: read
jobs:
  list-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: >-
          flutter analyze
          lib/features/daily_reports/daily_report_month_page.dart
          lib/features/daily_reports/daily_report_save_badge.dart
          test/daily_report_list_style_test.dart
          test/daily_report_pending_site_test.dart
          test/daily_report_visible_status_test.dart
      - run: >-
          flutter test --reporter expanded
          test/daily_report_list_style_test.dart
          test/daily_report_pending_site_test.dart
          test/daily_report_visible_status_test.dart
          test/daily_report_calendar_opening_test.dart
          test/daily_report_month_navigation_test.dart
          test/daily_report_site_history_navigation_test.dart
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
