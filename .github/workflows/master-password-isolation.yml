name: Isolated Master password credentials
on:
  pull_request:
    paths:
      - 'tool/staged/master_password_credentials.sql.review-only'
      - 'tool/security/master_password_isolation_check.mjs'
      - 'tool/security/master_password_client_fixture*'
      - 'test/server_master_credential_http_integration_test.dart'
      - '.github/workflows/master-password-isolation.yml'
permissions:
  contents: read
jobs:
  postgres-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKO_MASTER_PASSWORD_FIXTURE_URL: postgres://postgres:master-password-fixture-only@127.0.0.1:5432/sko_master_password_fixture
      SKO_MASTER_PASSWORD_POSTGREST_URL: http://127.0.0.1:3000
      SKO_MASTER_CREDENTIAL_HTTP_FIXTURE: /tmp/sko-master-client-fixture.json
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: master-password-fixture-only
          POSTGRES_DB: sko_master_password_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_master_password_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgrest:
        image: postgrest/postgrest:v16.4
        env:
          PGRST_DB_URI: postgres://postgres:master-password-fixture-only@postgres:5432/sko_master_password_fixture
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_JWT_SECRET: master-password-fixture-only-key-at-least-32-characters
        ports: ['3000:3000']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node --check tool/security/master_password_isolation_check.mjs
      - run: node tool/security/master_password_isolation_check.mjs "$PWD/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze test/server_master_credential_http_integration_test.dart
      - run: node tool/security/master_password_client_fixture.mjs "$PWD/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" seed
      - run: flutter test test/server_master_credential_http_integration_test.dart
      - run: node tool/security/master_password_client_fixture.mjs "$PWD/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" verify
      - name: Remove disposable session fixture
        if: always()
        run: rm -f /tmp/sko-master-client-fixture.json
