name: Checkout explicit paid-hours ledger candidate
on:
  pull_request:
    paths:
      - 'docs/candidates/checkout_paid_hours_ledger.sql.review-only'
      - 'tool/fixtures/checkout_paid_hours_actual_sources.json'
      - 'tool/prepare_checkout_paid_hours.py'
      - 'tool/verify_checkout_paid_hours_ledger.mjs'
      - 'tool/verify_checkout_paid_hours_source_chain.mjs'
      - '.github/workflows/checkout-paid-hours-ledger.yml'
permissions:
  contents: read
jobs:
  native-paid-hours-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_paid_hours_scope_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 tool/prepare_checkout_paid_hours.py --output "$RUNNER_TEMP/paid-hours-patches.sql"
      - run: node --check tool/verify_checkout_paid_hours_ledger.mjs
      - name: Explicit hours revision, signatures, final scope and immutable prices
        env:
          SKO_PAID_HOURS_SCOPE_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_paid_hours_scope_fixture
          SKO_PAID_HOURS_PATCHES: ${{ runner.temp }}/paid-hours-patches.sql
        run: node tool/verify_checkout_paid_hours_ledger.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
  actual-sign-payroll-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 tool/prepare_checkout_paid_hours.py --output "$RUNNER_TEMP/paid-hours-patches.sql"
      - run: node --check tool/verify_checkout_paid_hours_source_chain.mjs
      - name: Actual existing save-sign-formal-entry-payroll plus explicit signed hours
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
          SKO_PAID_HOURS_PATCHES: ${{ runner.temp }}/paid-hours-patches.sql
        run: node tool/verify_checkout_paid_hours_source_chain.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
