name: Guarded payroll tax reason installation review
on:
  pull_request:
    paths:
      - 'tool/build_payroll_tax_reason_review.py'
      - 'tool/build_payroll_tax_reason_pause.py'
      - 'tool/verify_payroll_tax_reason_deployment.mjs'
      - 'tool/verify_payroll_tax_adjustment_reason.mjs'
      - 'tool/fixtures/payroll_tax_reason_*.sql'
      - 'docs/candidates/payroll_tax_adjustment_reason.sql.review-only'
      - 'docs/review/payroll-tax-reason-deployment/**'
      - '.github/workflows/payroll-tax-reason-deployment.yml'
permissions:
  contents: read
jobs:
  guarded-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: sko_tax_reason_fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '22.21.0'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts --no-audit --no-fund
      - run: python3 -m py_compile tool/build_payroll_tax_reason_review.py tool/build_payroll_tax_reason_pause.py
      - run: node --check tool/verify_payroll_tax_reason_deployment.mjs
      - name: PGlite guarded installation and non-destructive pause
        run: node tool/verify_payroll_tax_reason_deployment.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
      - name: PostgreSQL guarded installation, pause and legacy concurrency
        env:
          SKO_TAX_REASON_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_tax_reason_fixture
        run: node tool/verify_payroll_tax_reason_deployment.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" postgres
      - run: git diff --exit-code -- tool/security/fixture_dependencies/package.json tool/security/fixture_dependencies/package-lock.json
