name: Apple native enrollment core
on:
  pull_request:
    paths:
      - 'docs/review/apple-existing-login-candidate/native_apple_enrollment*'
      - 'docs/review/apple-existing-login-candidate/native_apple_password_port*'
      - 'docs/review/apple-existing-login-candidate/native_apple_auth_port*'
      - 'docs/review/apple-existing-login-candidate/native_apple_successor_handoff*'
      - 'docs/review/apple-existing-login-candidate/native_apple_successor_db_port*'
      - 'docs/review/apple-existing-login-candidate/native_apple_successor_broker*'
      - 'docs/review/apple-existing-login-candidate/native_apple_successor_tls_response*'
      - 'docs/review/apple-existing-login-candidate/native_apple_successor_password_broker*'
      - 'docs/review/apple-existing-login-candidate/native-enrollment-endpoint.md'
      - 'docs/review/apple-existing-login-candidate/native-enrollment.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/native-enrollment-successor.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/native-enrollment-password-successor.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/native-enrollment-adapters.md'
      - 'docs/review/apple-existing-login-candidate/owner-policy.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/existing_apple_login.mjs'
      - '.github/workflows/apple-native-enrollment-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-session-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test docs/review/apple-existing-login-candidate/native_apple_enrollment.test.mjs docs/review/apple-existing-login-candidate/native_apple_password_port.test.mjs docs/review/apple-existing-login-candidate/native_apple_enrollment_sql_port.test.mjs docs/review/apple-existing-login-candidate/native_apple_auth_port.test.mjs docs/review/apple-existing-login-candidate/native_apple_successor_handoff.test.mjs docs/review/apple-existing-login-candidate/native_apple_successor_db_port.test.mjs docs/review/apple-existing-login-candidate/native_apple_successor_broker.test.mjs docs/review/apple-existing-login-candidate/native_apple_auth_port_password_successor.test.mjs docs/review/apple-existing-login-candidate/native_apple_successor_password_broker.test.mjs
      - name: Verify original-response-only TLS handoff with synthetic credentials
        run: node --test docs/review/apple-existing-login-candidate/native_apple_successor_tls_response.test.mjs
      - name: Install isolated pinned PostgreSQL WASM runtime
        run: npm install --prefix "$RUNNER_TEMP/sko-apple-enrollment" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
      - name: Verify exact SQL reservation and completion with isolated synthetic users
        env:
          SKO_APPLE_ENROLLMENT_PGLITE: ${{ runner.temp }}/sko-apple-enrollment/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test docs/review/apple-existing-login-candidate/native_apple_enrollment_sql.test.mjs
  native-postgresql-reservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: sko_apple_enrollment_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned fixture-only PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/sko-apple-native-pg" --no-save --ignore-scripts pg@8.16.3
      - name: Verify exact SQL and real concurrent reservations in disposable databases
        env:
          SKO_APPLE_ENROLLMENT_NATIVE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/sko_apple_enrollment_fixture
          SKO_APPLE_ENROLLMENT_NATIVE_DRIVER: ${{ runner.temp }}/sko-apple-native-pg/node_modules/pg/lib/index.js
        run: node --test docs/review/apple-existing-login-candidate/native_apple_enrollment_sql.test.mjs
