name: Route visit report Postgres races
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261011121738_route_visit_report_documents.sql'
      - 'tool/verify_route_visit_reports.mjs'
      - 'tool/verify_route_visit_report_postgres_races.mjs'
      - '.github/workflows/route-visit-report-postgres-races.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261011121738_route_visit_report_documents.sql'
      - 'tool/verify_route_visit_reports.mjs'
      - 'tool/verify_route_visit_report_postgres_races.mjs'
      - '.github/workflows/route-visit-report-postgres-races.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visit-document-races:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: visit-report-fixture
          POSTGRES_DB: sko_visit_report_race_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_visit_report_race_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKO_VISIT_REPORT_RACE_DATABASE_URL: postgres://postgres:visit-report-fixture@127.0.0.1:5432/sko_visit_report_race_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned isolated Postgres client
        run: npm install --prefix "$RUNNER_TEMP/visit-report-runtime" --no-audit --no-fund --ignore-scripts pg@8.16.3
      - name: Verify two-connection visit choice and signature races
        run: node tool/verify_route_visit_report_postgres_races.mjs "$RUNNER_TEMP/visit-report-runtime/node_modules/pg/lib/index.js"
