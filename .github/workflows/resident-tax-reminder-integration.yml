name: Resident tax notification integration
on:
  pull_request:
    paths:
      - 'lib/features/notifications/**'
      - 'lib/features/settings/company_payroll_rates_page.dart'
      - 'lib/features/payroll/resident_tax_annual*'
      - 'lib/features/payroll/resident_tax_reminder*'
      - 'test/resident_tax_reminder*'
      - 'test/resident_tax_annual*'
      - '.github/workflows/resident-tax-reminder-integration.yml'
  push:
    branches: [main]
    paths:
      - 'lib/features/notifications/**'
      - 'lib/features/settings/company_payroll_rates_page.dart'
      - 'lib/features/payroll/resident_tax_annual*'
      - 'lib/features/payroll/resident_tax_reminder*'
      - 'test/resident_tax_reminder*'
      - 'test/resident_tax_annual*'
      - '.github/workflows/resident-tax-reminder-integration.yml'
permissions:
  contents: read
jobs:
  annual-notification-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/settings/company_payroll_rates_page.dart lib/features/notifications/app_notification_repository.dart lib/features/notifications/attention_center_repository.dart lib/features/notifications/attention_center_item.dart lib/features/notifications/notifications_page.dart lib/features/payroll/resident_tax_annual_page.dart lib/features/payroll/resident_tax_annual_repository.dart lib/features/payroll/resident_tax_reminder_panel.dart lib/features/payroll/resident_tax_reminder_repository.dart test/resident_tax_reminder_http_test.dart test/resident_tax_annual_initial_year_test.dart test/resident_tax_reminder_notification_test.dart test/resident_tax_reminder_panel_test.dart test/resident_tax_reminder_repository_test.dart test/resident_tax_annual_page_test.dart
      - run: flutter test test/resident_tax_annual_initial_year_test.dart test/resident_tax_reminder_notification_test.dart test/resident_tax_reminder_repository_test.dart test/resident_tax_reminder_panel_test.dart test/resident_tax_annual_page_test.dart test/notification_payroll_routing_test.dart test/attention_center_item_test.dart test/attention_center_mapping_test.dart test/resident_tax_annual_repository_test.dart
      - run: flutter test test/resident_tax_reminder_http_test.dart --dart-define=SKO_RESIDENT_NOTICE_FIXTURE=true --dart-define=SUPABASE_URL=https://resident-tax-notice-fixture.invalid --dart-define=SUPABASE_PUBLISHABLE_KEY=public_fixture
