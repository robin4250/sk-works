name: Expense action identity isolated regression
on:
  pull_request:
    paths:
      - 'lib/features/expenses/expense_claims_page.dart'
      - 'test/expense_action_identity_test.dart'
      - '.github/workflows/expense-action-identity.yml'
permissions:
  contents: read
jobs:
  action-identity:
    if: false # Independent source review before the focused regression.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/expenses/expense_claims_page.dart test/expense_action_identity_test.dart
      - run: flutter test test/expense_action_identity_test.dart --reporter expanded
        env:
          SKO_EXPENSE_ACTION_IDENTITY_FIXTURE: fixture-only
