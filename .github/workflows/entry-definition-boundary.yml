name: Entry definition boundary
on:
  pull_request:
    paths:
      - 'tool/security/restoration/entry_definitions.sql.review-only'
      - 'tool/security/restoration/verify_entry_definitions.mjs'
      - 'tool/security/restoration/entry_metadata_probe.py'
      - 'tool/security/restoration/test_entry_metadata_probe.py'
      - 'tool/security/restoration/entry_metadata_review.md'
      - 'tool/security/restoration/entry_role_map.sql.review-only'
      - 'tool/security/restoration/entry_role_map_review.md'
      - '.github/workflows/entry-definition-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Offline fixed collector boundary tests
        run: python -m unittest discover -s tool/security/restoration -p 'test_entry_metadata_probe.py' -v
      - name: Install pinned isolated PostgreSQL runtime
        run: npm install --prefix "$RUNNER_TEMP/entry-definition-runtime" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Exercise synthetic metadata without production access
        run: node tool/security/restoration/verify_entry_definitions.mjs "$RUNNER_TEMP/entry-definition-runtime/node_modules/@electric-sql/pglite/dist/index.js"
