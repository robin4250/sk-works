name: Master device lock reauthentication
on:
  pull_request:
    paths:
      - 'lib/features/settings/master_device_*'
      - 'supabase/functions/reauthenticate-operation/**'
      - 'supabase/tests/fixtures/master_device_lock_before.sql'
      - 'tool/staged/master_device_lock_reauthentication.sql'
      - 'tool/security/*master_device_lock*'
      - 'test/master_device_lock_reauthentication_test.dart'
      - 'test/master_device_session_test.dart'
      - 'test/master_last_usable_device_guard_test.dart'
      - '.github/workflows/master-device-lock-reauthentication.yml'
permissions:
  contents: read
jobs:
  boundary:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: sko_master_device_lock_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tool/security/reauthentication_handler_test.mjs tool/security/master_device_lock_handler_test.mjs
      - run: npm install --prefix /tmp/device-lock-deps --no-audit --no-fund pg@8.16.3
      - run: node tool/security/verify_master_device_lock_postgres.mjs /tmp/device-lock-deps/node_modules/pg/lib/index.js
        env:
          SKO_REAUTH_FIXTURE_URL: postgres://postgres:synthetic_fixture_only@127.0.0.1:5432/sko_master_device_lock_fixture
  client:
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/master_device_session_test.dart
      - run: flutter analyze lib/features/settings/master_device_repository.dart lib/features/settings/master_device_management_page.dart lib/features/settings/master_device_lock_proof_dialog.dart test/master_device_lock_reauthentication_test.dart test/master_device_session_test.dart test/master_last_usable_device_guard_test.dart
      - run: flutter test test/master_device_lock_reauthentication_test.dart test/master_device_ui_contract_test.dart test/master_strict_device_gate_contract_test.dart test/master_last_usable_device_guard_test.dart
