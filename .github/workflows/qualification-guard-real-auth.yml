name: Qualification guard real auth API
on:
  pull_request:
    paths:
      - '.github/workflows/qualification-guard-real-auth.yml'
      - 'tool/verify_qualification_guard_real_gotrue.mjs'
      - 'docs/review/qualification-master-access/delete-preserve.sql.review-only'
permissions:
  contents: read
jobs:
  gotrue-postgrest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: node --check tool/verify_qualification_guard_real_gotrue.mjs
      - name: Isolated GoTrue and PostgREST qualification deletion checks
        run: node tool/verify_qualification_guard_real_gotrue.mjs
