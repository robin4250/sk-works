name: Approved edit failure visibility
on:
  pull_request:
    paths:
      - 'lib/features/daily_reports/daily_report_page.dart'
      - 'test/daily_report_approved_edit_failure_visibility_test.dart'
      - 'lib/features/daily_reports/shared_daily_report_repository.dart'
      - 'test/shared_daily_report_repository_test.dart'
      - 'tool/verify_finalized_allowance_management_route.mjs'
      - '.github/workflows/approved-edit-failure-visibility.yml'
      - 'docs/review/approved-edit-allowance-reset/**'
      - 'tool/verify_approved_edit_allowance_reset.mjs'
permissions:
  contents: read
jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/daily_reports/daily_report_page.dart lib/features/daily_reports/shared_daily_report_repository.dart test/daily_report_approved_edit_failure_visibility_test.dart test/shared_daily_report_repository_test.dart
      - name: Exact installed-source failure remains grey without a persistent reason
        shell: bash
        run: |
          set -euo pipefail
          page=lib/features/daily_reports/daily_report_page.dart
          cp "$page" /tmp/approved-edit-fixed.dart
          trap 'cp /tmp/approved-edit-fixed.dart "$page"' EXIT
          git show 67d1a1960e5f59662457ee23c34d2cbacc9e12aa:"$page" > "$page"
          if flutter test --reporter expanded test/daily_report_approved_edit_failure_visibility_test.dart > /tmp/approved-edit-old.log 2>&1; then
            cat /tmp/approved-edit-old.log
            exit 1
          fi
          cat /tmp/approved-edit-old.log
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/approved-edit-old.log').read_text()
          assert 'daily-report-approved-edit-start-failure' in s and 'Found 0 widgets' in s
          assert 'Failed to load' not in s and 'Compilation failed' not in s
          PY
          cp /tmp/approved-edit-fixed.dart "$page"
          git diff --exit-code -- "$page"
      - run: flutter test --reporter expanded test/daily_report_approved_edit_failure_visibility_test.dart test/daily_report_approved_edit_start_test.dart test/daily_report_common_allowance_names_test.dart test/shared_daily_report_repository_test.dart
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock

  native-approved-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 tool/prepare_checkout_paid_hours.py --output "$RUNNER_TEMP/paid-hours-v1-patches.sql"
      - run: python3 tool/prepare_checkout_shared_hours_v2.py --output "$RUNNER_TEMP/shared-hours-v2-patches.sql"
      - run: node --check tool/verify_approved_edit_allowance_reset.mjs
      - name: Exact deployed old writer then four-CASE candidate in disposable PostgreSQL
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
          SKO_PAID_HOURS_PATCHES: ${{ runner.temp }}/paid-hours-v1-patches.sql
          SKO_SHARED_HOURS_V2_PATCHES: ${{ runner.temp }}/shared-hours-v2-patches.sql
        run: node tool/verify_approved_edit_allowance_reset.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"

  native-finalized-management:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 tool/prepare_checkout_paid_hours.py --output "$RUNNER_TEMP/paid-hours-v1-patches.sql"
      - run: python3 tool/prepare_checkout_shared_hours_v2.py --output "$RUNNER_TEMP/shared-hours-v2-patches.sql"
      - run: node --check tool/verify_finalized_allowance_management_route.mjs
      - name: Finalized guard and authorized registered allowance removal in disposable PostgreSQL
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
          SKO_PAID_HOURS_PATCHES: ${{ runner.temp }}/paid-hours-v1-patches.sql
          SKO_SHARED_HOURS_V2_PATCHES: ${{ runner.temp }}/shared-hours-v2-patches.sql
        run: node tool/verify_finalized_allowance_management_route.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
