name: Atomic route save proof
on:
  pull_request:
    paths:
      - 'tool/staged/route_atomic_save.sql'
      - 'tool/route_atomic_fixture.mjs'
      - 'tool/verify_route_atomic*.mjs'
      - '.github/workflows/route-atomic-save.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/route-atomic-proof --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - run: node tool/verify_route_atomic_save.mjs /tmp/route-atomic-proof/node_modules/@electric-sql/pglite/dist/index.js
  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sko_route_atomic_fixture
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/route-atomic-pg --ignore-scripts --no-audit --no-fund pg@8.16.3
      - run: node tool/verify_route_atomic_postgres.mjs /tmp/route-atomic-pg/node_modules/pg/lib/index.js
        env:
          SKO_ROUTE_ATOMIC_DATABASE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/sko_route_atomic_fixture
