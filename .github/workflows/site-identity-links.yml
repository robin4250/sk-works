name: Site identity links isolated SQL
on:
  pull_request:
    paths:
      - tool/staged/site_identity_links.sql
      - tool/test_site_identity_links.mjs
      - .github/workflows/site-identity-links.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node tool/test_site_identity_links.mjs
