name: Master new device proof candidate
on:
  pull_request:
    paths:
      - 'tool/security/master-device-enrollment-candidate/new-device-proof*'
      - 'tool/security/master-device-enrollment-candidate/verified-dual-proof*'
      - 'tool/security/master-device-enrollment-candidate/session-bound-approval*'
      - 'tool/security/master-device-enrollment-candidate/key-migration-proposal*'
      - '.github/workflows/master-new-device-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tool/security/master-device-enrollment-candidate/key-migration-proposal.test.mjs tool/security/master-device-enrollment-candidate/new-device-proof.test.mjs tool/security/master-device-enrollment-candidate/verified-dual-proof.test.mjs tool/security/master-device-enrollment-candidate/session-bound-approval.test.mjs
