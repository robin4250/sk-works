name: Primary recovery without retired SMS
on:
  pull_request:
    paths:
      - 'lib/features/auth/secure_onboarding_*'
      - 'test/*password_recovery*'
      - 'test/existing_google_login_test.dart'
      - '.github/workflows/primary-recovery-no-sms.yml'
  push:
    branches: [main]
    paths:
      - 'lib/features/auth/secure_onboarding_*'
      - 'test/*password_recovery*'
      - 'test/existing_google_login_test.dart'
      - '.github/workflows/primary-recovery-no-sms.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/auth/secure_onboarding_pages.dart lib/features/auth/secure_onboarding_repository.dart test/primary_password_recovery_widget_test.dart test/primary_password_recovery_contract_test.dart test/atomic_password_recovery_contract_test.dart
      - run: flutter test test/primary_password_recovery_widget_test.dart test/primary_password_recovery_contract_test.dart test/atomic_password_recovery_contract_test.dart test/pre_device_documentation_contract_test.dart test/secondary_password_reset_page_test.dart test/server_secondary_password_reset_test.dart test/existing_google_login_test.dart test/google_logout_sdk_race_test.dart

