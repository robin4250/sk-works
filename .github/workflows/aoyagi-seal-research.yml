name: Aoyagi Reisho research PDF
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/aoyagi_seal_research_pdf_test.dart'
      - 'test/fixtures/aoyagi-reisho/**'
      - 'tool/prepare_aoyagi_seal_fixture.py'
      - '.github/workflows/aoyagi-seal-research.yml'
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python -m pip install fonttools==4.61.1 PyMuPDF==1.26.6
      - run: python tool/prepare_aoyagi_seal_fixture.py
      - run: flutter test test/aoyagi_seal_research_pdf_test.dart
      - name: Render actual Flutter PDFs
        run: |
          python - <<'PYRENDER'
          import fitz
          from pathlib import Path
          for path in Path('build/aoyagi-seal-fixture').glob('*.pdf'):
              with fitz.open(path) as doc:
                  doc[0].get_pixmap(matrix=fitz.Matrix(2, 2)).save(path.with_suffix('.png'))
          PYRENDER
      - uses: actions/upload-artifact@v4
        with:
          name: aoyagi-reisho-research
          path: build/aoyagi-seal-fixture/
