name: Bank document trigger composition
on:
  pull_request:
    paths:
      - 'tool/security/bank_document_composition/**'
      - '.github/workflows/bank-document-trigger-composition.yml'
permissions:
  contents: read
jobs:
  native-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_bank_document_only
          POSTGRES_DB: sko_bank_document_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/bank-document-pg --no-audit --no-fund --ignore-scripts pg@8.16.3
      - run: node tool/security/bank_document_composition/native.mjs /tmp/bank-document-pg/node_modules/pg/lib/index.js
        env:
          SKO_BANK_DOCUMENT_FIXTURE_URL: postgres://postgres:synthetic_bank_document_only@127.0.0.1:5432/sko_bank_document_fixture
