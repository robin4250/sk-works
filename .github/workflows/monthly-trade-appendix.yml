name: Monthly trade appendix SQL and PDF
on:
  pull_request:
    paths: ['lib/features/shared/trade_document*', 'lib/features/payroll/payment*', 'supabase/migrations/*monthly_trade_document_attachment.sql', 'supabase/migrations/*payment_order_work_defaults.sql', 'tool/verify_trade_document_attachment.mjs', 'tool/verify_payment_order_snapshot_tax.mjs', 'tool/verify_payment_order_directory_party_source.mjs', 'docs/candidates/payment_order_directory_party_source_20261021.sql.review-only', 'tool/verify_payment_order_layout.dart', 'tool/verify_payment_order_seal_alignment.py', 'tool/verify_trade_document_resolvers.dart', 'docs/candidates/payment_order_tax_from_snapshot_20261020.sql.review-only', 'tool/trade_document_pg_adapter.mjs', 'test/payment_order_pdf_test.dart', '.github/workflows/monthly-trade-appendix.yml']
  push:
    branches: [main, 'feat/payment-order-*']
    paths: ['lib/features/shared/trade_document*', 'lib/features/payroll/payment*', 'supabase/migrations/*monthly_trade_document_attachment.sql', 'supabase/migrations/*payment_order_work_defaults.sql', 'tool/verify_trade_document_attachment.mjs', 'tool/verify_payment_order_snapshot_tax.mjs', 'tool/verify_payment_order_directory_party_source.mjs', 'docs/candidates/payment_order_directory_party_source_20261021.sql.review-only', 'tool/verify_payment_order_layout.dart', 'tool/verify_payment_order_seal_alignment.py', 'tool/verify_trade_document_resolvers.dart', 'docs/candidates/payment_order_tax_from_snapshot_20261020.sql.review-only', 'tool/trade_document_pg_adapter.mjs', 'test/payment_order_pdf_test.dart', '.github/workflows/monthly-trade-appendix.yml']
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/verify_payment_order_snapshot_tax.mjs ./security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js
      - run: node tool/verify_payment_order_directory_party_source.mjs "$PWD/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: sko_trade_fixture}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_trade_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_TRADE_FIXTURE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/sko_trade_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/verify_payment_order_snapshot_tax.mjs ./trade_document_pg_adapter.mjs
  directory-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: {source: [base, tax]}
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: sko_trade_fixture}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_trade_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_TRADE_FIXTURE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/sko_trade_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - name: Verify party defaults against the existing save contract on PostgreSQL 17
        run: node tool/verify_payment_order_directory_party_source.mjs "$PWD/tool/trade_document_pg_adapter.mjs" "${{ matrix.source }}"
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: dart tool/verify_payment_order_layout.dart
      - run: dart tool/verify_trade_document_resolvers.dart
      - run: flutter test test/payment_order_pdf_test.dart test/payment_order_resolver_test.dart
        env: {SKO_PDF_OUTPUT_DIR: build/payment-order-proof}
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Verify page order and render PDFs
        run: |
          python - <<'PY'
          import fitz,re
          from pathlib import Path
          def first_page_without_count(doc):
              raw=doc[0].get_text()
              page_number=r'(?m)^P\.001/[0-9]{3}$'
              assert re.findall(page_number,raw)==[f'P.001/{len(doc):03}'], (len(doc),re.findall(page_number,raw))
              return ''.join(re.sub(page_number,'P.001/PAGES',raw,count=1).split())
          with fitz.open('build/payment-order-proof/payment-legacy.pdf') as baseline:
              first_page_text=first_page_without_count(baseline)
          for path in Path('build/payment-order-proof').glob('*.pdf'):
              with fitz.open(path) as doc:
                  assert len(doc)==(1 if path.stem=='payment-legacy' else 3 if path.stem in ('payment-expenses','payment-automatic') else 2), (path,len(doc))
                  assert '工事代金支払明細書' in ''.join(doc[0].get_text().split()),path
                  assert first_page_without_count(doc)==first_page_text,path
                  if len(doc)>=2:
                      text=''.join(doc[1].get_text().split())
                      for expected in ['注文書','2026-10','110,000','10,000']+(['注文者','受注者'] if path.stem=='payment-automatic' else ['甲・発注者','乙・受注者']):
                          assert expected in text,(path,expected,text)
                  if path.stem=='payment-long':
                      assert '発注条件'*100 in text,path
                      assert '特記事項'*150 in text,path
                      assert '代表'*40 in text,path
                      assert '9876543210987' in text,path
                  if path.stem=='payment-automatic':
                      assert '工事請負契約条項' in ''.join(doc[2].get_text().split()),path
                  if path.stem=='payment-expenses':
                      assert '経費' in ''.join(doc[2].get_text().split()),path
                  for index,page in enumerate(doc):
                      for block in page.get_text('dict')['blocks']:
                          if block['type']==0:
                              for line in block['lines']:
                                  for span in line['spans']:
                                      x0,y0,x1,y1=span['bbox']
                                      assert x0>=0 and y0>=0 and x1<=page.rect.width+1 and y1<=page.rect.height+1,(path,span)
                      page.get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(path.with_name(f'{path.stem}-{index+1}.png'))
          PY
      - name: Inspect representative and seal alignment
        run: python tool/verify_payment_order_seal_alignment.py build/payment-order-proof
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: monthly-payment-order-proof, path: build/payment-order-proof/}
