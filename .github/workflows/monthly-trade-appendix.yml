name: Monthly trade appendix SQL and PDF
on:
  pull_request:
    paths: ['lib/features/shared/trade_document*', 'lib/features/payroll/payment*', 'supabase/migrations/*monthly_trade_document_attachment.sql', 'tool/verify_trade_document_attachment.mjs', 'test/payment_order_pdf_test.dart', '.github/workflows/monthly-trade-appendix.yml']
  push:
    branches: [main, 'feat/payment-order-*']
    paths: ['lib/features/shared/trade_document*', 'lib/features/payroll/payment*', 'supabase/migrations/*monthly_trade_document_attachment.sql', 'tool/verify_trade_document_attachment.mjs', 'test/payment_order_pdf_test.dart', '.github/workflows/monthly-trade-appendix.yml']
jobs:
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/verify_trade_document_attachment.mjs ./security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/payment_order_pdf_test.dart
        env: {SKO_PDF_OUTPUT_DIR: build/payment-order-proof}
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Verify page order and render PDFs
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          for path in Path('build/payment-order-proof').glob('*.pdf'):
              with fitz.open(path) as doc:
                  assert len(doc)==(1 if path.stem=='payment-legacy' else 2), (path,len(doc))
                  assert '支払証明書' in doc[0].get_text(),path
                  if len(doc)==2:
                      text=''.join(doc[1].get_text().split())
                      for expected in ['注文書','2026-10','110,000','10,000','甲・発注者','乙・受注者']:
                          assert expected in text,(path,expected,text)
                  for index,page in enumerate(doc):
                      for block in page.get_text('dict')['blocks']:
                          if block['type']==0:
                              for line in block['lines']:
                                  for span in line['spans']:
                                      x0,y0,x1,y1=span['bbox']
                                      assert x0>=0 and y0>=0 and x1<=page.rect.width+1 and y1<=page.rect.height+1,(path,span)
                      page.get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(path.with_name(f'{path.stem}-{index+1}.png'))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: monthly-payment-order-proof, path: build/payment-order-proof/}
