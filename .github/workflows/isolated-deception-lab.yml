name: Isolated deception lab
on:
  pull_request:
    paths:
      - 'tool/security/**'
      - '.github/workflows/isolated-deception-lab.yml'
  push:
    branches: [main]
    paths:
      - 'tool/security/**'
      - '.github/workflows/isolated-deception-lab.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tool/security/*_test.mjs
