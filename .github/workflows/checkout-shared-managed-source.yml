name: Shared v2 manager manual-attendance source candidate
on:
  pull_request:
    paths:
      - 'docs/candidates/checkout_shared_managed_source.sql.review-only'
      - 'tool/fixtures/shared_managed_actual_writers.json'
      - 'tool/verify_checkout_shared_managed_source.mjs'
      - '.github/workflows/checkout-shared-managed-source.yml'
permissions:
  contents: read
jobs:
  native-managed-source-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_shared_managed_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: node --check tool/verify_checkout_shared_managed_source.mjs
      - name: Original sign, manual identity and money preservation with strict transaction permit
        env:
          SKO_SHARED_MANAGED_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_shared_managed_fixture
        run: node tool/verify_checkout_shared_managed_source.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
