name: Signed checkout customer billing
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261013181708_route_signed_checkout_customer_billing.sql'
      - 'tool/verify_route_signed_checkout_billing.mjs'
      - 'tool/verify_invoice_three_day_evidence.mjs'
      - 'tool/fixtures/route_signed_checkout/**'
      - '.github/workflows/route-signed-checkout-billing.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261013181708_route_signed_checkout_customer_billing.sql'
      - 'tool/verify_route_signed_checkout_billing.mjs'
      - 'tool/verify_invoice_three_day_evidence.mjs'
      - 'tool/fixtures/route_signed_checkout/**'
      - '.github/workflows/route-signed-checkout-billing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-checkout-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated pinned SQL runtime
        run: npm install --prefix "$RUNNER_TEMP/signed-billing-runtime" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Verify three-day attendance evidence and edits
        run: node tool/verify_invoice_three_day_evidence.mjs "$RUNNER_TEMP/signed-billing-runtime/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Verify actual signed checkout and invoice SQL
        run: node tool/verify_route_signed_checkout_billing.mjs "$RUNNER_TEMP/signed-billing-runtime/node_modules/@electric-sql/pglite/dist/index.js"
  signed-checkout-postgres-races:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: signed-checkout-fixture
          POSTGRES_DB: sko_signed_checkout_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_signed_checkout_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKO_SIGNED_BILLING_DATABASE_URL: postgres://postgres:signed-checkout-fixture@127.0.0.1:5432/sko_signed_checkout_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned real Postgres client
        run: npm install --prefix "$RUNNER_TEMP/signed-billing-runtime" --no-audit --no-fund --ignore-scripts pg@8.16.3
      - name: Verify signed-source billing and finalization races
        run: node tool/verify_route_signed_checkout_billing.mjs "$RUNNER_TEMP/signed-billing-runtime/node_modules/pg/lib/index.js"
