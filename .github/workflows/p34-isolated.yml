name: P34 atomic personnel review-only
on:
  pull_request:
    paths:
      - 'tool/security/p34*'
      - 'tool/security/test_p34*'
      - 'tool/security/personnel_*/**'
      - '.github/workflows/p34-isolated.yml'
  push:
    branches: [main]
    paths:
      - 'tool/security/p34*'
      - 'tool/security/test_p34*'
      - 'tool/security/personnel_*/**'
      - '.github/workflows/p34-isolated.yml'
permissions:
  contents: read
jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tool/security -p test_p34_atomic.py
  pglite-regression:
    strategy:
      matrix:
        suite: ['personnel_rls/verify.mjs', 'personnel_rls/legacy_verify.mjs', 'personnel_write/verify.mjs', 'p34_fixture.mjs']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node tool/security/${{ matrix.suite }} "$PWD/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
  postgres-rest-boundary:
    strategy:
      matrix:
        suite: ['personnel_rls/verify.mjs', 'personnel_rls/legacy_verify.mjs', 'personnel_write/verify.mjs', 'p34_fixture.mjs']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_personnel_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_personnel_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgrest:
        image: postgrest/postgrest:v16.4
        env:
          PGRST_DB_URI: postgres://postgres:fixture-only@postgres:5432/sko_personnel_fixture
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_DB_PRE_REQUEST: ${{ (matrix.suite == 'personnel_write/verify.mjs') && 'private.check_account_access' || '' }}
          PGRST_DB_TX_END: rollback-allow-override
          PGRST_JWT_SECRET: synthetic-personnel-fixture-secret-at-least-32-characters
        ports: ['3000:3000']
    env:
      SKO_PERSONNEL_FIXTURE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/sko_personnel_fixture
      SKO_PERSONNEL_POSTGREST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node tool/security/${{ matrix.suite }} "$PWD/tool/security/personnel_rls/pg_adapter.mjs"
