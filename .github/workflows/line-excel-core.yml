name: LINE Excel offline core
on:
  pull_request:
    paths:
      - 'tool/line_excel/**'
      - 'test/line_excel/**'
      - '.github/workflows/line-excel-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s test/line_excel -v
