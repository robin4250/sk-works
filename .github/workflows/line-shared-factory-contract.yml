name: LINE shared factory contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/*line_shared_group_origins.sql'
      - 'tool/*line_shared_factory*'
      - 'tool/legacy_factory_prerequisites.sql'
      - '.github/workflows/line-shared-factory-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: sko_line_factory_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/line-factory-deps --save-exact @electric-sql/pglite@0.3.14 pg@8.16.3
      - run: node tool/verify_line_shared_factory.mjs /tmp/line-factory-deps/node_modules/@electric-sql/pglite/dist/index.js
      - run: node tool/verify_line_shared_factory_races.mjs /tmp/line-factory-deps/node_modules/pg/lib/index.js
        env:
          SKO_LINE_FACTORY_FIXTURE_URL: postgres://postgres:fixture@127.0.0.1:5432/sko_line_factory_fixture
