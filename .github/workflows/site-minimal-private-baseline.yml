name: Minimal private site baseline composition
on:
  pull_request:
    paths:
      - 'docs/review/site-order-private-baseline/**'
      - '.github/workflows/site-minimal-private-baseline.yml'
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        engine: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_document_consent_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 6a24114471a9c264fad1aeec5dd2222915ddbedf
          path: .c-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: de4d4bb018e8c8ca56b0c85bde09fadebca312a4
          path: .reply-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22.21.0'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: python -m unittest discover -s docs/review/site-order-private-baseline -p 'test_*.py' -v
      - run: node --test docs/review/site-order-private-baseline/sql_transaction.test.mjs docs/review/site-order-private-baseline/prepare_atomic_review.test.mjs
      - name: Twelve atomic modules; seven exact helpers and synthetic seal/Auth
        env:
          SKO_CONSENT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_document_consent_fixture
        run: |
          export SKO_SITE_REPLY_RECOVERY_SOURCE_ROOT="$GITHUB_WORKSPACE/.reply-source"
          export SKO_TRADE_C_SOURCE_ROOT="$GITHUB_WORKSPACE/.c-source"
          if [ '${{ matrix.engine }}' = 'postgres' ]; then
            node docs/review/site-order-private-baseline/verify_composition.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" postgres --full
          else
            node docs/review/site-order-private-baseline/verify_composition.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js" --full
          fi
