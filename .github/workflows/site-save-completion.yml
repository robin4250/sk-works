name: Site save completion
on:
  pull_request:
    paths:
      - 'lib/features/sites/site_page.dart'
      - 'lib/features/sites/site_cloud_page.dart'
      - 'test/site_save_completion_test.dart'
      - '.github/workflows/site-save-completion.yml'
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/sites/site_page.dart lib/features/sites/site_cloud_page.dart test/site_save_completion_test.dart
      - run: flutter analyze lib/features/sites/site_page.dart lib/features/sites/site_cloud_page.dart test/site_save_completion_test.dart
      - run: flutter test test/site_save_completion_test.dart
