name: Company checkout same-label collision regression
on:
  pull_request:
    paths:
      - 'tool/verify_company_common_legacy_label_collision_fix.mjs'
      - 'docs/candidates/company_checkout_receipt_capture.sql.review-only'
      - 'tool/fixtures/company_checkout_*'
      - 'tool/prepare_company_checkout_integration.py'
      - 'tool/verify_company_checkout_integration.mjs'
      - '.github/workflows/company-checkout-collision-regression.yml'
permissions:
  contents: read
jobs:
  native-same-label-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 -m py_compile tool/prepare_company_checkout_integration.py
      - run: node --check tool/verify_company_common_legacy_label_collision_fix.mjs
      - name: Actual report/signature/calculator sources with private receipt contract
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
        run: node tool/verify_company_common_legacy_label_collision_fix.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
