name: Vehicle save global chrome interaction
on:
  workflow_dispatch:
  push:
    branches: [test/ui-save-interactions-20261017]
permissions:
  contents: read
jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze test/vehicle_save_global_chrome_test.dart test/vehicle_editor_partial_save_test.dart
      - run: flutter test test/vehicle_save_global_chrome_test.dart test/vehicle_editor_partial_save_test.dart --reporter expanded
