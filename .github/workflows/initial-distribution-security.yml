name: Initial distribution account access
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261013191956_guard_initial_distribution_account_access.sql'
      - 'tool/initial_distribution_before_fixture.sql'
      - 'tool/verify_initial_distribution_account_access.mjs'
      - '.github/workflows/initial-distribution-security.yml'
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/sko-distribution-test --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node tool/verify_initial_distribution_account_access.mjs /tmp/sko-distribution-test/node_modules/@electric-sql/pglite/dist/index.js
