name: Apple bounded JWKS and limiter contract candidate
on:
  pull_request:
    paths:
      - 'docs/review/apple-ingress24/**'
      - '.github/workflows/apple-ingress24.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/review/apple-ingress24/apple_ingress.test.mjs
