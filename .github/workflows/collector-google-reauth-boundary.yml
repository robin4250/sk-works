name: Collector Google reauthentication boundary
on:
  pull_request:
    paths:
      - 'tool/security/verify_collector_google_boundary.test.mjs'
      - 'docs/review/collector-owner-oauth-reauth-20261027.md'
      - 'docs/review/apple-existing-login-candidate/google_primary_verifier.mjs'
      - 'docs/review/apple-existing-login-candidate/existing_apple_login.mjs'
      - '.github/workflows/collector-google-reauth-boundary.yml'
permissions:
  contents: read
jobs:
  offline-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tool/security/verify_collector_google_boundary.test.mjs
