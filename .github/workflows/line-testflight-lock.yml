name: LINE TestFlight master-only lock
on:
  pull_request:
    paths:
      - 'docs/security/staged/line_testflight*.sql.review-only'
      - 'tool/fixtures/line_testflight_public_wrappers_20261016.json'
      - 'docs/security/line_deployed_access_inventory_20261016.md'
      - 'tool/verify_line_release_capability.mjs'
      - 'docs/security/line_testflight_lock_review.md'
      - '.github/workflows/line-testflight-lock.yml'
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_line_release_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_line_release_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgrest:
        image: postgrest/postgrest:v16.4
        env:
          PGRST_DB_URI: postgres://postgres:fixture-only@postgres:5432/sko_line_release_fixture
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_JWT_SECRET: synthetic-line-fixture-secret-at-least-32-characters
        ports: ['3000:3000']
    env:
      SKO_LINE_RELEASE_POSTGREST_URL: http://127.0.0.1:3000
      SKO_LINE_RELEASE_POSTGRES_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_line_release_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/line_release_fixture_dependencies
      - run: node tool/verify_line_release_fixture_url.mjs
      - run: node tool/verify_line_release_capability.mjs "$PWD/tool/fixtures/line_release_pg_adapter.mjs" --testflight-lock
  pglite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/line_release_fixture_dependencies
      - run: node tool/verify_line_release_capability.mjs "$PWD/tool/line_release_fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js" --testflight-lock
