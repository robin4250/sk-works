name: Order receipt binding proof
on:
  pull_request:
    paths:
      - 'tool/staged/site_contract_receipt_binding.sql'
      - 'tool/verify_order_receipt_binding.mjs'
      - 'tool/verify_order_receipt_binding_postgres.mjs'
      - '.github/workflows/order-receipt-binding.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned disposable PostgreSQL
        run: npm install --prefix /tmp/order-binding-proof --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Verify internal binding preparation
        run: node tool/verify_order_receipt_binding.mjs /tmp/order-binding-proof/node_modules/@electric-sql/pglite/dist/index.js

  real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sko_order_binding_fixture
          POSTGRES_PASSWORD: fixture-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned fixture client
        run: npm install --prefix /tmp/order-binding-pg --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Observe existing sealed preview and binder lock order
        run: node tool/verify_order_receipt_binding_postgres.mjs /tmp/order-binding-pg/node_modules/pg/lib/index.js
        env:
          SKO_ORDER_BINDING_DATABASE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/sko_order_binding_fixture
