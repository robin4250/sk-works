name: Company save completion
on:
  pull_request:
    paths:
      - 'lib/features/companies/trade_company_page.dart'
      - 'test/trade_company_save_completion_test.dart'
      - '.github/workflows/company-save-completion.yml'
jobs:
  focused-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/companies/trade_company_page.dart test/trade_company_save_completion_test.dart
      - run: flutter test test/trade_company_save_completion_test.dart test/trade_company_dialog_test.dart --reporter expanded
