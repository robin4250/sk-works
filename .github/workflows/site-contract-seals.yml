name: Site contract sealed revision proof
on:
  pull_request:
    paths:
      - 'tool/staged/site_contract_sealed_revision.sql'
      - 'tool/verify_site_contract*.mjs'
      - '.github/workflows/site-contract-seals.yml'
  push:
    branches: [main]
    paths:
      - 'tool/staged/site_contract_sealed_revision.sql'
      - 'tool/verify_site_contract*.mjs'
      - '.github/workflows/site-contract-seals.yml'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned disposable PostgreSQL
        run: npm install --prefix /tmp/site-contract-proof --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Verify seal boundaries and immutable history
        run: node tool/verify_site_contract_seals.mjs /tmp/site-contract-proof/node_modules/@electric-sql/pglite/dist/index.js
      - name: Verify integration with actual agreement SQL and official seal helper
        run: node tool/verify_site_contract_integration.mjs /tmp/site-contract-proof/node_modules/@electric-sql/pglite/dist/index.js
