name: Traffic icon colors
on:
  pull_request:
    paths:
      - 'lib/features/traffic/traffic_destination_icon.dart'
      - 'test/traffic_destination_colour_test.dart'
      - '.github/workflows/traffic-icon-colors.yml'
permissions:
  contents: read
jobs:
  colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/traffic/traffic_destination_icon.dart test/traffic_destination_colour_test.dart
      - run: flutter test test/traffic_destination_colour_test.dart
