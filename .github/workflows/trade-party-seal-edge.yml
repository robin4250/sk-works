name: Trade party representative and name-edge seal PDF
on:
  pull_request:
    paths:
      - 'lib/features/shared/trade_document_company_name_pdf.dart'
      - 'lib/features/payroll/payment_order_pdf.dart'
      - 'lib/features/invoices/invoice_order_acceptance_pdf.dart'
      - 'test/trade_document_party_seal_edge_pdf_test.dart'
      - 'tool/verify_trade_party_seal_edge.py'
      - '.github/workflows/trade-party-seal-edge.yml'
permissions:
  contents: read
jobs:
  actual-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test test/trade_document_party_seal_edge_pdf_test.dart test/payment_order_pdf_test.dart test/invoice_order_acceptance_pdf_test.dart test/standalone_trade_document_test.dart
        env:
          SKO_SEAL_EDGE_OUTPUT_DIR: build/trade-party-seal-edge
      - run: python -m pip install PyMuPDF==1.26.6
      - run: python tool/verify_trade_party_seal_edge.py build/trade-party-seal-edge
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: trade-party-seal-edge-proof, path: build/trade-party-seal-edge/}
