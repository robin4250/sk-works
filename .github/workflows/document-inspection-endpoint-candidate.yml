name: Document inspection endpoint candidate
on:
  pull_request:
    paths:
      - 'tool/document_inspection_endpoint*'
      - '.github/workflows/document-inspection-endpoint-candidate.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tool/document_inspection_endpoint.test.mjs
