name: Route journey visits check
on:
  pull_request:
    paths:
      - 'tool/fixtures/route_journey_visits/**'
      - 'tool/fixtures/route_journey_capture/**'
      - 'tool/verify_route_journey_visits.mjs'
      - 'supabase/migrations/20261008204012_route_journey_capture_staged.sql'
      - '.github/workflows/route-journey-visits-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visit-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned isolated SQL runtime
        run: npm install --prefix "$RUNNER_TEMP/visit-runtime" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.8
      - name: Verify visit transaction and clock-out boundaries
        run: node tool/verify_route_journey_visits.mjs "$RUNNER_TEMP/visit-runtime/node_modules/@electric-sql/pglite/dist/index.js"
