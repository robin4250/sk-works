name: LINE Stage Two Import Contracts
on:
  pull_request:
    paths:
      - 'lib/features/chat/line_import*'
      - 'supabase/migrations/*line_confirmed_import*'
      - 'supabase/tests/line_confirmed_*'
      - 'tool/verify_line_import*'
      - 'tool/fixtures/line_import*'
      - '.github/workflows/line-import-drafts-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*line_confirmed_import*'
      - 'supabase/tests/line_confirmed_*'
      - 'tool/verify_line_import*'
      - '.github/workflows/line-import-drafts-check.yml'
jobs:
  isolate-confirmed-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Verify drafts, own-worker privacy, Master flags, ordinary approval and invoice math
        run: |
          npm install --prefix "$RUNNER_TEMP/line-import-sql" --save-exact @electric-sql/pglite@0.3.14
          node tool/verify_line_import_drafts_sql.mjs "$RUNNER_TEMP/line-import-sql/node_modules/@electric-sql/pglite/dist/index.js"
  real-postgres-receipts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_line_import_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_line_import_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_LINE_IMPORT_POSTGRES_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_line_import_fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install fixture-only database driver
        run: npm install --prefix "$RUNNER_TEMP/line-import-pg" --save-exact pg@8.16.3
      - name: Resolve test-only driver
        run: ln -s "$RUNNER_TEMP/line-import-pg/node_modules" node_modules
      - name: Verify original migration and real concurrent receipts
        run: |
          node tool/verify_line_import_drafts_sql.mjs tool/fixtures/line_import_pg_adapter.mjs
          node tool/verify_line_import_postgres_races.mjs
  targeted-line-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify LINE candidates, public talk, import hub and precise time labels
        run: flutter test test/line_import_draft_test.dart test/line_talk_hub_page_test.dart test/line_talk_page_test.dart test/line_attendance_status_parser_test.dart test/line_webhook_signature_contract_test.dart
      - run: flutter analyze
