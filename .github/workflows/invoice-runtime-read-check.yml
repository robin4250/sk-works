name: Invoice runtime read check
on:
  pull_request:
    paths:
      - 'lib/domain/invoice_engine.dart'
      - 'lib/features/invoices/invoice_cloud_repository.dart'
      - 'lib/features/invoices/invoice_pdf_service.dart'
      - 'test/invoice_runtime_read_test.dart'
      - 'test/invoice_offline_font_test.dart'
      - '.github/workflows/invoice-runtime-read-check.yml'
      - 'supabase/migrations/*invoice_draft_seal_read_settings.sql'
      - 'supabase/tests/fixtures/invoice_document_settings_20261013.json'
      - 'tool/verify_invoice_draft_seal_read_settings.mjs'
permissions:
  contents: read
jobs:
  saved-invoice-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/invoice_runtime_read_test.dart test/invoice_offline_font_test.dart test/invoice_draft_current_seal_test.dart test/invoice_registered_contact_test.dart
  existing-invoice-rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/invoice-read-runtime" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - run: node tool/verify_invoice_draft_seal_read_settings.mjs "$RUNNER_TEMP/invoice-read-runtime/node_modules/@electric-sql/pglite/dist/index.js"
