name: Personal PDF vault candidate
on:
  pull_request:
    paths:
      - 'tool/personal_vault_manifest.mjs'
      - 'docs/review/personal-vault24/**'
      - 'docs/review/personal-vault25-delivery/source-binding*'
      - 'test/personal_vault_manifest.test.mjs'
      - 'lib/features/personal_vault/**'
      - 'test/own_payroll_archive_pdf_test.dart'
      - 'test/personal_vault_content_evidence_test.dart'
      - 'test/personal_vault_pdf_download_test.dart'
      - 'test/personal_vault_pdf_download_io_test.dart'
      - 'test/personal_vault_pdf_lease_test.dart'
      - 'docs/review/personal-vault25-content/**'
      - '.github/workflows/personal-pdf-vault-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
      - run: node --test test/personal_vault_manifest.test.mjs
  payroll-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Prepare isolated observer Python
        run: |
          python3 -m venv "$RUNNER_TEMP/sko-vault-observer-python"
          "$RUNNER_TEMP/sko-vault-observer-python/bin/python" -m pip install --disable-pip-version-check 'PyMuPDF==1.26.6'
          "$RUNNER_TEMP/sko-vault-observer-python/bin/python" -I -c 'import pymupdf; assert pymupdf.VersionBind == "1.26.6"'
          echo "$RUNNER_TEMP/sko-vault-observer-python/bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s docs/review/personal-vault25-content -p '*_test.py' -v
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze test/personal_vault_content_evidence_test.dart lib/features/personal_vault test/own_payroll_archive_pdf_test.dart test/personal_vault_page_test.dart test/personal_vault_repository_test.dart test/personal_vault_pdf_download_test.dart test/personal_vault_pdf_download_io_test.dart test/personal_vault_pdf_lease_test.dart
      - run: flutter test test/personal_vault_content_evidence_test.dart test/own_payroll_archive_pdf_test.dart test/personal_vault_page_test.dart test/personal_vault_repository_test.dart test/personal_vault_pdf_download_test.dart test/personal_vault_pdf_download_io_test.dart test/personal_vault_pdf_lease_test.dart
  persistent-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: vault_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v7
      - run: psql -h localhost -U postgres -d vault_fixture -v ON_ERROR_STOP=1 -f docs/review/personal-vault24/read-api-test.sql
      - run: psql -h localhost -U postgres -d vault_fixture -v ON_ERROR_STOP=1 -f docs/review/personal-vault24/receipt-immutability-test.sql
      - run: psql -h localhost -U postgres -d vault_fixture -v ON_ERROR_STOP=1 -f docs/review/personal-vault25-delivery/source-binding-test.sql
      - run: createdb -h localhost -U postgres vault_native
      - run: psql -h localhost -U postgres -d vault_native -v ON_ERROR_STOP=1 -f vault-native-test.sql
        working-directory: docs/review/personal-vault24/feature-fixture
