name: Personal PDF vault candidate
on:
  pull_request:
    paths:
      - 'tool/personal_vault_manifest.mjs'
      - 'docs/review/personal-vault24/**'
      - 'test/personal_vault_manifest.test.mjs'
      - 'lib/features/personal_vault/**'
      - 'test/own_payroll_archive_pdf_test.dart'
      - '.github/workflows/personal-pdf-vault-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: node --test test/personal_vault_manifest.test.mjs
  payroll-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/personal_vault test/own_payroll_archive_pdf_test.dart test/personal_vault_page_test.dart test/personal_vault_repository_test.dart
      - run: flutter test test/own_payroll_archive_pdf_test.dart test/personal_vault_page_test.dart test/personal_vault_repository_test.dart
  persistent-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: vault_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -d vault_fixture -v ON_ERROR_STOP=1 -f docs/review/personal-vault24/read-api-test.sql
      - run: createdb -h localhost -U postgres vault_native
      - run: psql -h localhost -U postgres -d vault_native -v ON_ERROR_STOP=1 -f vault-native-test.sql
        working-directory: docs/review/personal-vault24/feature-fixture
