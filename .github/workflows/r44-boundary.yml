name: R44 boundary
on:
  pull_request:
    paths:
      - 'lib/features/qualifications/qualification_certificate_page.dart'
      - 'lib/features/qualifications/qualification_certificate_repository.dart'
      - 'test/r44_boundary_test.dart'
      - 'tool/r44_review.md'
      - '.github/workflows/r44-boundary.yml'
permissions:
  contents: read
jobs:
  synthetic-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/r44_boundary_test.dart --reporter expanded
