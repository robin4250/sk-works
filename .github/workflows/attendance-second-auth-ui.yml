name: Attendance operation second authentication UI
on:
  pull_request:
    paths:
      - lib/features/attendance/attendance_management_page.dart
      - lib/features/attendance/attendance_management_repository.dart
      - lib/features/auth/operation_reauthentication_repository.dart
      - test/attendance_management_proof_ui_test.dart
      - test/attendance_unrecorded_punches_test.dart
      - .github/workflows/attendance-second-auth-ui.yml
permissions:
  contents: read
jobs:
  authenticated-management-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Analyze management proof connection
        run: flutter analyze lib/features/attendance/attendance_management_page.dart lib/features/attendance/attendance_management_repository.dart test/attendance_management_proof_ui_test.dart test/attendance_unrecorded_punches_test.dart
      - name: Verify server proof UI and existing management operations
        run: timeout 300 flutter test test/attendance_management_proof_ui_test.dart test/attendance_management_company_allowance_test.dart test/attendance_management_clock_precision_test.dart test/attendance_management_report_navigation_test.dart test/attendance_unrecorded_punches_test.dart test/operation_reauthentication_repository_test.dart --reporter expanded
