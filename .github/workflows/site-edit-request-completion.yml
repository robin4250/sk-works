name: Site edit request completion
on:
  pull_request:
    paths:
      - 'lib/features/sites/site_detail_page.dart'
      - 'test/site_edit_request_completion_test.dart'
      - '.github/workflows/site-edit-request-completion.yml'
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/sites/site_detail_page.dart test/site_edit_request_completion_test.dart
      - run: flutter analyze lib/features/sites/site_detail_page.dart test/site_edit_request_completion_test.dart
      - run: flutter test test/site_edit_request_completion_test.dart test/site_detail_localization_contract_test.dart test/site_fields_trade_company_delete_integrity_contract_test.dart
