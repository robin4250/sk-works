name: Trade document initial settings SQL
on:
  push:
    branches: ['feat/trade-document-settings-standalone-20261021']
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/verify_trade_document_initial_settings.mjs "$PWD/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: fixture-only, POSTGRES_DB: sko_trade_fixture}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_trade_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_TRADE_FIXTURE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/sko_trade_fixture
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/verify_trade_document_initial_settings.mjs "$PWD/tool/trade_document_pg_adapter.mjs"
