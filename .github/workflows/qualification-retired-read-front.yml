name: Qualification retired own read boundary
on:
  pull_request:
    paths:
      - 'lib/features/qualifications/**'
      - 'test/qualification_retired_read_scope_http_test.dart'
      - '.github/workflows/qualification-retired-read-front.yml'
permissions:
  contents: read
concurrency:
  group: qualification-retired-read-front-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  sdk-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/qualifications/qualification_cloud_repository.dart lib/features/qualifications/qualification_certificate_repository.dart lib/features/qualifications/qualification_document_read_scope.dart test/qualification_retired_read_scope_http_test.dart
      - run: flutter test test/qualification_retired_read_scope_http_test.dart --reporter expanded
