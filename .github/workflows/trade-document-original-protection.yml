name: Original contract renderer and managed operation boundary
on:
  pull_request:
    paths:
      - 'lib/features/shared/trade_document_form_pdf*.dart'
      - 'lib/features/shared/standalone_trade_document*'
      - 'lib/features/shared/trade_document_attachment_editor_page.dart'
      - 'lib/features/invoices/invoice_acceptance_resolver.dart'
      - 'lib/features/payroll/payment_order_resolver.dart'
      - 'test/trade_document_renderer_history_test.dart'
      - 'test/standalone_trade_document_operation_gate_test.dart'
      - '.github/workflows/trade-document-original-protection.yml'
permissions: {contents: read}
jobs:
  preserved-original-and-operation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/shared/standalone_trade_document_operation_gate.dart lib/features/shared/standalone_trade_document_page.dart lib/features/shared/trade_document_form_pdf.dart lib/features/shared/trade_document_form_pdf_v1.dart lib/features/shared/trade_document_form_pdf_v2.dart test/standalone_trade_document_operation_gate_test.dart test/trade_document_renderer_history_test.dart
      - run: flutter test test/trade_document_renderer_history_test.dart
        env: {TRADE_HISTORY_PDF_OUTPUT_DIR: /tmp/trade-history-current}
      - name: Render historical adopted payload using the exact main v1 source
        shell: bash
        run: |
          set -euo pipefail
          original_saved=$(mktemp)
          cp lib/features/shared/trade_document_form_pdf.dart "$original_saved"
          restore_original() { cp "$original_saved" lib/features/shared/trade_document_form_pdf.dart; }
          trap restore_original EXIT
          git show 67d1a1960e5f59662457ee23c34d2cbacc9e12aa:lib/features/shared/trade_document_form_pdf.dart > lib/features/shared/trade_document_form_pdf.dart
          TRADE_HISTORY_PDF_OUTPUT_DIR=/tmp/trade-history-baseline flutter test test/trade_document_renderer_history_test.dart
          restore_original
          trap - EXIT
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Require exact historical page text and pixels, not merely unchanged values
        run: |
          python - <<'PYCODE'
          import fitz,hashlib,json,subprocess
          from pathlib import Path
          current=Path('/tmp/trade-history-current');baseline=Path('/tmp/trade-history-baseline')
          names=sorted(p.name for p in current.glob('*.pdf'));assert len(names)==4
          result=[]
          for name in names:
            a=fitz.open(current/name);b=fitz.open(baseline/name);assert len(a)==len(b)==2
            for index in range(2):
              assert a[index].get_text()==b[index].get_text(),(name,index,'text changed')
              aa=a[index].get_pixmap(matrix=fitz.Matrix(1.5,1.5));bb=b[index].get_pixmap(matrix=fitz.Matrix(1.5,1.5))
              assert aa.width==bb.width and aa.height==bb.height and aa.samples==bb.samples,(name,index,'original pixels changed')
              result.append({'file':name,'page':index+1,'pixel_sha256':hashlib.sha256(aa.samples).hexdigest()})
          old=subprocess.check_output(['git','show','67d1a1960e5f59662457ee23c34d2cbacc9e12aa:lib/features/shared/trade_document_form_pdf.dart'],text=True)
          frozen=Path('lib/features/shared/trade_document_form_pdf_v1.dart').read_text().replace('TradeDocumentFormPdfV1','TradeDocumentFormPdf').replace('/// Frozen schema-1/absent-fields front from main 67d1a1960. Do not modernize saved originals.','/// Approved new form front. Missing structured entries remain blank; no inference.')
          assert frozen==old,'historical renderer body changed beyond class name/comment'
          Path('/tmp/trade-history-current/proof.json').write_text(json.dumps(result,indent=2))
          print('PASS four historical adopted payloads / eight pages retain exact v1 pixels and text; frozen renderer body verified')
          PYCODE
      - run: flutter test test/standalone_trade_document_operation_gate_test.dart test/standalone_trade_document_print_scope_test.dart test/trade_document_form_host_wiring_test.dart test/trade_document_touch_editor_test.dart test/invoice_acceptance_resolver_test.dart test/payment_order_resolver_test.dart
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: original-contract-renderer-proof, path: /tmp/trade-history-current}
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock lib/features/shared/trade_document_form_pdf.dart
