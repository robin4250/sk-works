name: Expense v1 conversion native PostgreSQL
on:
  pull_request:
    paths:
      - 'docs/candidates/expense_payment*sql.review-only'
      - 'tool/verify_expense_payment_v1_draft_conversion.mjs'
      - 'tool/verify_expense_payment_conversion_postgres_races.mjs'
      - 'tool/fixtures/expense_cost_fixture.mjs'
      - '.github/workflows/expense-v1-conversion-native.yml'
permissions:
  contents: read
jobs:
  native-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: conversion-fixture
          POSTGRES_DB: sko_expense_conversion_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_expense_conversion_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKO_EXPENSE_CONVERSION_DATABASE_URL: postgres://postgres:conversion-fixture@127.0.0.1:5432/sko_expense_conversion_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned disposable runtimes
        run: npm install --prefix "$RUNNER_TEMP/conversion-runtime" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14 pg@8.16.3
      - name: Verify conversion boundaries on PGlite
        run: node tool/verify_expense_payment_v1_draft_conversion.mjs "$RUNNER_TEMP/conversion-runtime/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Verify real PostgreSQL 17 conversion races
        run: node tool/verify_expense_payment_conversion_postgres_races.mjs "$RUNNER_TEMP/conversion-runtime/node_modules/pg/lib/index.js"
