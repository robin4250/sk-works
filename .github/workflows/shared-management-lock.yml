name: Shared actual manager batch lock order
on:
  pull_request:
    paths:
      - 'docs/candidates/shared_daily_report.sql.review-only'
      - 'lib/features/daily_reports/shared_daily_report_repository.dart'
      - 'test/shared_daily_report_repository_test.dart'
      - 'tool/verify_shared_daily_report.mjs'
      - 'docs/candidates/shared_daily_report_group_lock.sql.review-only'
      - 'tool/verify_shared_group_lock.mjs'
      - 'tool/security/shared_group_lock_source_fixture.json'
      - 'docs/candidates/shared_daily_report_management_locks.sql.review-only'
      - 'tool/verify_shared_management_locks.mjs'
      - 'tool/security/shared_management_source_fixture.json'
      - '.github/workflows/shared-management-lock.yml'
permissions:
  contents: read
jobs:
  shared-management-lock-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_checkout_integration_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: node --check tool/verify_shared_management_locks.mjs
      - name: Original save/sign source and shared membership proof
        env:
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
        run: node tool/verify_shared_management_locks.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
