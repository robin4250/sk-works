name: Employee invite log privacy
on:
  pull_request:
    paths:
      - 'supabase/functions/create-employee-invite/**'
      - 'supabase/functions/_shared/account_*.mjs'
      - '.github/workflows/employee-invite-log-privacy.yml'
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test supabase/functions/create-employee-invite/auth_error_logging_test.mjs
