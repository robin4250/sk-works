name: Daily report saved signature labels
on:
  pull_request:
    paths:
      - 'lib/features/daily_reports/daily_report_page.dart'
      - 'test/daily_report_shared_hours_integration_test.dart'
      - '.github/workflows/daily-report-signature-status.yml'
permissions:
  contents: read
jobs:
  saved-status:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/daily_reports/daily_report_page.dart test/daily_report_shared_hours_integration_test.dart
      - run: flutter test test/daily_report_shared_hours_integration_test.dart --reporter expanded
