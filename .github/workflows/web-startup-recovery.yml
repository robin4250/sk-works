name: WEB startup recovery
on:
  pull_request:
    paths:
      - 'web/**'
      - 'tool/test_web_startup.cjs'
      - '.github/workflows/web-startup-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tool/test_web_startup.cjs
