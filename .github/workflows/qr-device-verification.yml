name: QR device signature candidate
on:
  pull_request:
    paths:
      - 'tool/qr-attendance/**'
      - '.github/workflows/qr-device-verification.yml'
permissions:
  contents: read
jobs:
  device-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tool/qr-attendance/qr-device-verification.test.mjs tool/qr-attendance/qr-scan-coordinator.test.mjs
