name: Security notice UI diagnostic
on:
  pull_request:
    paths:
      - 'test/security_notice_page_test.dart'
      - 'lib/features/security/security_notice_repository.dart'
      - '.github/workflows/security-notice-diagnostic.yml'
permissions:
  contents: read
jobs:
  notice-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --reporter expanded test/security_notice_page_test.dart
