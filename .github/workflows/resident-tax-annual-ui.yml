name: Resident tax annual update UI
on:
  pull_request:
    paths:
      - 'lib/features/payroll/resident_tax_annual*'
      - 'lib/features/settings/company_payroll_rates_page.dart'
      - 'test/resident_tax_annual*'
      - 'test/features/settings/company_income_tax_entry_test.dart'
      - '.github/workflows/resident-tax-annual-ui.yml'
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter test --reporter expanded test/resident_tax_annual_page_test.dart test/resident_tax_annual_repository_test.dart test/features/payroll/resident_tax_section_test.dart test/features/settings/company_income_tax_entry_test.dart
      - run: flutter analyze
