name: Payroll fixed footer and common allowance UI
on:
  push:
    branches: [test/payroll-fixed-footer-20261017]
  pull_request:
    paths:
      - 'lib/features/payroll/**'
      - 'lib/features/settings/settings_page.dart'
      - 'test/*payroll*test.dart'
      - 'test/company_common*test.dart'
      - '.github/workflows/payroll-fixed-footer.yml'
permissions:
  contents: read
jobs:
  payroll-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze
      - run: flutter test test/individual_payroll_fixed_footer_test.dart test/company_common_fixed_footer_test.dart test/company_common_allowance_entry_test.dart test/company_common_allowance_connected_test.dart test/company_common_payroll_page_test.dart test/individual_payroll_ui_tabs_test.dart test/individual_payroll_settings_contract_test.dart test/payroll_inline_unit_sections_test.dart test/payroll_unit_item_editor_test.dart test/payroll_unit_conditions_editor_test.dart test/payroll_unit_conditions_repository_test.dart test/individual_payroll_company_scope_test.dart test/company_rate_settings_contract_test.dart test/settings_permission_contract_test.dart test/settings_payroll_rates_entry_outline_test.dart --reporter expanded
