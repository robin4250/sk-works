name: Dedicated Master password entry isolated
on:
  pull_request:
    paths:
      - 'lib/features/settings/master_password_*'
      - 'lib/features/settings/master_protected_page.dart'
      - 'lib/features/settings/master_credential_*'
      - 'test/master_password_entry*'
      - '.github/workflows/master-password-entry.yml'
permissions:
  contents: read
jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/settings/master_password_entry_repository.dart lib/features/settings/master_password_protected_page.dart lib/features/settings/master_protected_page.dart test/master_password_entry_test.dart test/master_password_entry_repository_test.dart
      - run: flutter test test/master_password_entry_test.dart test/master_password_entry_repository_test.dart test/master_protected_page_contract_test.dart test/master_step_up_policy_test.dart
