name: Daily report signature PDF proof
on:
  pull_request:
    paths: ['lib/features/daily_reports/**', 'test/daily_report_signature*', '.github/workflows/daily-signature-proof.yml']
  push:
    branches: [main]
    paths: ['lib/features/daily_reports/**', 'test/daily_report_signature*', '.github/workflows/daily-signature-proof.yml']
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/signature_ink_frame_test.dart test/daily_report_signature_aspect_test.dart test/daily_report_signature_pdf_proof_test.dart test/sko_signature_orientation_test.dart test/signature_capture_member_names_test.dart test/saved_route_report_reading_test.dart
        env: {SKO_SIGNATURE_PROOF: build/daily-signature-proof}
      - run: python -m pip install PyMuPDF==1.26.6
      - run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          for path in Path('build/daily-signature-proof').glob('*.pdf'):
              doc = fitz.open(path)
              assert len(doc) == 1
              assert '署名' in doc[0].get_text()
              doc[0].get_pixmap(matrix=fitz.Matrix(2, 2)).save(path.with_suffix('.png'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: daily-signature-pdf-proof, path: build/daily-signature-proof/}
