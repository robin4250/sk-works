name: Expense manager removal isolated review
on:
  pull_request:
    paths:
      - 'docs/candidates/expense_manager_removal_20261101.sql.review-only'
      - 'tool/review/expense_manager_removal_20261101/**'
      - '.github/workflows/expense-manager-removal-review.yml'
permissions:
  contents: read
jobs:
  native-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_expense_manager_removal_fixture
        ports:
          - 55438:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/expense-removal-pg" --no-audit --no-fund --ignore-scripts pg@8.16.3
      - name: Bind the disposable PostgreSQL service address
        run: |
          fixture_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')
          test -n "$fixture_ip"
          echo "SKO_EXPENSE_FIXTURE_SERVER_IP=$fixture_ip" >> "$GITHUB_ENV"
      - run: node --test tool/review/expense_manager_removal_20261101/fixture-target.test.mjs
      - run: node tool/review/expense_manager_removal_20261101/native-test.mjs "$RUNNER_TEMP/expense-removal-pg/node_modules/pg/lib/index.js"
