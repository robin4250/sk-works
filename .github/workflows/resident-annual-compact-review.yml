name: Resident annual compact checkpoint review
on:
  pull_request:
    paths:
      - 'tool/security/prepare_resident_annual_compact_review.py'
      - 'tool/security/test_prepare_resident_annual_compact_review.py'
      - 'tool/verify_resident_annual_compact_review.mjs'
      - '.github/workflows/resident-annual-compact-review.yml'
permissions:
  contents: read
jobs:
  native-compact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_resident_annual_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SKO_RESIDENT_ANNUAL_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_resident_annual_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts --no-audit --no-fund
      - run: python3 -m unittest discover -s tool/security -p 'test_prepare_resident_annual_compact_review.py' -v
      - run: node tool/verify_resident_annual_compact_review.mjs "$PWD/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
