name: Site order site entry UI
on:
  pull_request:
    paths:
      - 'lib/features/sites/site_order_*.dart'
      - 'lib/features/sites/admin_site_financial_page.dart'
      - 'test/site_order*_test.dart'
      - '.github/workflows/site-order-site-entry-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze owned UI and retained typed contracts
        run: flutter analyze lib/features/sites/site_order_*.dart lib/features/sites/admin_site_financial_page.dart test/site_order*_test.dart
      - name: Verify owned site lifetime and retained editor contract
        run: flutter test test/site_order_site_actions_test.dart test/site_order_workflow_repository_test.dart --reporter expanded
