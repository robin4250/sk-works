name: Site order site entry UI
on:
  pull_request:
    paths:
      - 'lib/features/sites/site_order_*.dart'
      - 'lib/features/sites/admin_site_financial_page.dart'
      - 'lib/features/notifications/notifications_page.dart'
      - 'lib/features/notifications/app_notification_repository.dart'
      - 'test/site_order*_test.dart'
      - 'tool/canonical_renderer/synthetic-cases.json'
      - 'tool/canonical_renderer/synthetic-evidence.json'
      - '.github/workflows/site-order-site-entry-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # New notification source awaits independent review.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze scoped notification read and owned routes
        run: flutter analyze lib/features/notifications/notifications_page.dart lib/features/notifications/app_notification_repository.dart lib/features/sites/site_order_site_actions.dart lib/features/sites/site_order_workflow_repository.dart test/site_order_notification_route_test.dart test/site_order_notification_scoped_read_test.dart test/site_order_site_actions_test.dart
      - name: Verify scoped read and notification routes
        run: flutter test test/site_order_notification_scoped_read_test.dart test/site_order_notification_route_test.dart test/site_order_site_actions_test.dart --reporter expanded
