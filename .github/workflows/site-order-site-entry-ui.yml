name: Site order site entry UI
on:
  pull_request:
    paths:
      - 'lib/features/sites/site_order_*.dart'
      - 'lib/features/sites/admin_site_financial_page.dart'
      - 'test/site_order*_test.dart'
      - '.github/workflows/site-order-site-entry-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze owned UI and retained typed contracts
        run: flutter analyze lib/features/sites/site_order_*.dart lib/features/sites/admin_site_financial_page.dart test/site_order*_test.dart
      - name: Verify site order typed contracts and UI
        shell: bash
        run: |
          # Native execution receipts require the separate Native SQL workflow.
          # This file is analyzed, NOT claimed as exercised here.
          tests=()
          for file in test/site_order*_test.dart; do
            case "$file" in
              test/site_order_outgoing_execution_repository_test.dart) continue ;;
            esac
            tests+=("$file")
          done
          test "${#tests[@]}" -eq 16
          printf '%s\n' 'UNEXECUTED: Native execution 3 cases. Consent2/registered-target1 Native receipt cases explicitly skip without their artifacts.'
          flutter test "${tests[@]}" --reporter expanded
