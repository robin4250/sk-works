name: QR scanner native key custody OFF
on:
  pull_request:
    paths:
      - 'tool/ios/qr_scanner_key.swift'
      - 'tool/tests/qr_scanner_key_main.swift'
      - 'tool/prepare_ios.sh'
      - 'lib/features/qr_attendance/scanner_registration_key.dart'
      - 'test/scanner_registration_key_test.dart'
      - '.github/workflows/qr-scanner-native-key.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-key:
    runs-on: macos-26-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Typecheck actual supported iOS key custody API
        run: xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios15.5 tool/ios/qr_scanner_key.swift
      - name: Actual CryptoKit and protected Keychain fail-closed tests
        run: |
          cp tool/tests/qr_scanner_key_main.swift "$RUNNER_TEMP/main.swift"
          xcrun swiftc -swift-version 5 tool/ios/qr_scanner_key.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/qr-scanner-key"
          "$RUNNER_TEMP/qr-scanner-key" | tee "$RUNNER_TEMP/qr-key-output.txt"
          node --input-type=module - "$RUNNER_TEMP/qr-key-output.txt" <<'JS'
          import {readFileSync} from 'node:fs';
          import {createPublicKey,verify} from 'node:crypto';
          import assert from 'node:assert/strict';
          import {scannerRegistrationSigningBytes} from './tool/qr-attendance/qr-scanner-possession.mjs';
          const line=readFileSync(process.argv[2],'utf8').split('\n').find(x=>x.startsWith('QR_INTEROP '));
          const p=JSON.parse(line.slice(11)),b=Buffer.from(p.bytes,'base64'),a=JSON.parse(b);
          const c={id:a[1],company:a[2],actor:a[3],session:a[4],device:a[5],keyHex:a[6],nonce:a[7],createdMs:a[8],expiresMs:a[9]};
          assert.deepEqual(b,scannerRegistrationSigningBytes(c));
          const key=createPublicKey({key:Buffer.from(p.publicKeyHex,'hex'),format:'der',type:'spki'});
          assert.equal(verify(null,b,key,Buffer.from(p.signature,'base64')),true);
          assert.equal(verify(null,Buffer.concat([b,Buffer.from('x')]),key,Buffer.from(p.signature,'base64')),false);
          console.log('PASS actual randomized native CryptoKit registration signature accepted by existing Node canonical payload/verifier');
          JS
      - run: bash -n tool/prepare_ios.sh
  flutter-key-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/qr_attendance/scanner_registration_key.dart test/scanner_registration_key_test.dart
      - run: flutter test test/scanner_registration_key_test.dart
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
