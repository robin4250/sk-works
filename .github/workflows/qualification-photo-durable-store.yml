name: Qualification photo durable store
on:
  pull_request:
    paths:
      - 'lib/features/qualifications/admin_saved_qualification_photo_*'
      - 'tool/verify_qualification_photo_*'
      - 'tool/qualification_photo_sqlite_fixture.py'
      - '.github/workflows/qualification-photo-durable-store.yml'
  push:
    branches: [main, 'fix/qualification-photo-transaction-owner-*']
    paths:
      - 'lib/features/qualifications/admin_saved_qualification_photo_*'
      - 'tool/verify_qualification_photo_*'
      - 'tool/qualification_photo_sqlite_fixture.py'
      - '.github/workflows/qualification-photo-durable-store.yml'
permissions:
  contents: read
jobs:
  sqlite-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - name: Verify real SQLite transaction ownership and recovery
        run: dart tool/verify_qualification_photo_sqlite_store.dart
