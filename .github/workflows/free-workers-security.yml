name: Free Workers security runtime candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tool/security/free-worker-candidate/**'
      - '.github/workflows/free-workers-security.yml'
permissions:
  contents: read
jobs:
  actual-workers-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install exact locked Miniflare and workerd without lifecycle scripts
        working-directory: tool/security/free-worker-candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce and verify actual import-free Wasm binary
        working-directory: tool/security/free-worker-candidate
        run: |
          python3 tool/build_wasm.py
          node tool/verify_artifact.mjs
          git diff --exit-code -- src/decoy.wasm src/decoy.wat src/wasm-manifest.mjs package-lock.json
      - name: Real workerd WebCrypto Wasm SQLite CAS restart and outbox
        working-directory: tool/security/free-worker-candidate
        env:
          SKO_SECURITY_SOURCE_ROOT: ${{ github.workspace }}/tool/security
        run: npm test
