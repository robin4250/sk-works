name: Free Workers security runtime candidate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tool/security/free-worker-candidate/**'
      - '.github/workflows/free-workers-security.yml'
permissions:
  contents: read
jobs:
  actual-workers-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Reuse exact reviewed collector ingress source without merging or deploying it
        uses: actions/checkout@v7
        with:
          repository: robin4250/sk-works
          ref: 20f516d662e8e50458db68ba3e8a39772d93454d
          path: collector-proof-source
          sparse-checkout: supabase/functions/security-collector-ingest/handler.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Install exact locked Miniflare and workerd without lifecycle scripts
        working-directory: tool/security/free-worker-candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reproduce and verify actual import-free Wasm binary
        working-directory: tool/security/free-worker-candidate
        run: |
          python3 tool/build_wasm.py
          node tool/verify_artifact.mjs
          git diff --exit-code -- src/decoy.wasm src/decoy.wat src/wasm-manifest.mjs package-lock.json
      - name: Real workerd WebCrypto Wasm SQLite CAS restart and outbox
        working-directory: tool/security/free-worker-candidate
        env:
          SKO_SECURITY_SOURCE_ROOT: ${{ github.workspace }}/tool/security
          SKO_COLLECTOR_HANDLER_SOURCE: ${{ github.workspace }}/collector-proof-source/supabase/functions/security-collector-ingest/handler.mjs
        run: npm test
