name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan tracked files for production secrets
        run: bash tool/check_no_client_secrets.sh

      - name: Verify scan failures cannot pass as clean
        run: python3 -m unittest discover -s tool/security -p test_secret_scan.py -v
