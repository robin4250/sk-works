name: Secondary reset boundary review
on:
  pull_request:
    paths:
      - 'tool/verify_secondary_reset_boundary.mjs'
      - 'supabase/tests/fixtures/secondary_reset_before.sql'
      - 'docs/security/SECONDARY_RESET_BOUNDARY_REVIEW_20261014.md'
      - '.github/workflows/secondary-reset-boundary-review.yml'
jobs:
  boundary:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic_fixture_only
          POSTGRES_DB: sko_secondary_boundary_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/secondary-review-deps --no-audit --no-fund pg@8.16.3
      - run: node tool/verify_secondary_reset_boundary.mjs /tmp/secondary-review-deps/node_modules/pg/lib/index.js
        env:
          SKO_SECONDARY_FIXTURE_URL: postgres://postgres:synthetic_fixture_only@127.0.0.1:5432/sko_secondary_boundary_fixture
