name: Apple and Google preparation ports
on:
  pull_request:
    paths:
      - 'lib/features/auth/apple_native_credential_preparation.dart'
      - 'test/apple_native_credential_preparation_test.dart'
      - 'lib/features/auth/apple_successor_client_preparation.dart'
      - 'lib/features/auth/app_auth_mutation_gateway.dart'
      - 'test/apple_successor_client_preparation_test.dart'
      - 'lib/features/auth/apple_successor_https_delivery.dart'
      - 'test/apple_successor_https_delivery_test.dart'
      - 'lib/features/auth/apple_owned_session_coordinator.dart'
      - 'test/apple_owned_session_coordinator_test.dart'
      - 'docs/review/apple-existing-login-candidate/google_primary*'
      - '.github/workflows/apple-preparation-ports.yml'
permissions:
  contents: read
jobs:
  google-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test docs/review/apple-existing-login-candidate/google_primary_verifier.test.mjs
  flutter-native-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: dart analyze lib/features/auth/apple_native_credential_preparation.dart test/apple_native_credential_preparation_test.dart lib/features/auth/apple_successor_client_preparation.dart test/apple_successor_client_preparation_test.dart
      - run: dart analyze lib/features/auth/apple_successor_https_delivery.dart test/apple_successor_https_delivery_test.dart
      - run: dart analyze lib/features/auth/apple_owned_session_coordinator.dart test/apple_owned_session_coordinator_test.dart
      - run: flutter test test/apple_native_credential_preparation_test.dart test/apple_successor_client_preparation_test.dart test/apple_successor_https_delivery_test.dart test/apple_owned_session_coordinator_test.dart --reporter expanded
