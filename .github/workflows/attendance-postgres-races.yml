name: Attendance PostgreSQL Races
on:
  pull_request:
    branches: [main]
    paths:
      - 'tool/verify_attendance_postgres_races.mjs'
      - 'tool/fixtures/attendance_race/**'
      - '.github/workflows/attendance-postgres-races.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: sko_race_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify two independent PostgreSQL connections
        env:
          SKO_RACE_DATABASE_URL: postgres://postgres:fixture-only-password@127.0.0.1:5432/sko_race_fixture
        run: |
          npm install --prefix "$RUNNER_TEMP/sko-race-runtime" --save-exact pg@8.16.3
          node tool/verify_attendance_postgres_races.mjs "$RUNNER_TEMP/sko-race-runtime/node_modules/pg/lib/index.js"
