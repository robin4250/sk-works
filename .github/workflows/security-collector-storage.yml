name: Security collector storage candidate
on:
  pull_request:
    paths:
      - 'docs/candidates/security_collector_storage_v1_20261020.sql.review-only'
      - 'docs/review/security_collector_storage_20261020.md'
      - 'tool/security/verify_collector_storage_candidate.mjs'
      - 'tool/security/collector_*'
      - 'tool/security/fixture_dependencies/**'
      - '.github/workflows/security-collector-storage.yml'
  push:
    branches: [main]
    paths:
      - 'docs/candidates/security_collector_storage_v1_20261020.sql.review-only'
      - 'docs/review/security_collector_storage_20261020.md'
      - 'tool/security/verify_collector_storage_candidate.mjs'
      - 'tool/security/collector_*'
      - 'tool/security/fixture_dependencies/**'
      - '.github/workflows/security-collector-storage.yml'
permissions:
  contents: read
jobs:
  isolated-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/security/verify_collector_storage_candidate.mjs
        env:
          PGLITE_PACKAGE: ${{ github.workspace }}/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js

  native-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_collector_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_collector_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/security/collector_fixture_guard_test.mjs
      - run: node tool/security/verify_collector_storage_candidate.mjs
        env:
          PGLITE_PACKAGE: ${{ github.workspace }}/tool/security/collector_storage_pg_adapter.mjs
          SKO_COLLECTOR_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_collector_fixture
