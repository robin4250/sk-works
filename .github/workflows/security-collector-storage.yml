name: Security collector storage candidate
on:
  pull_request:
    paths:
      - 'docs/candidates/security_collector_storage_v1_20261020.sql.review-only'
      - 'docs/review/security_collector_storage_20261020.md'
      - 'tool/security/verify_collector_storage_candidate.mjs'
      - 'tool/security/fixture_dependencies/**'
      - '.github/workflows/security-collector-storage.yml'
  push:
    branches: [main]
    paths:
      - 'docs/candidates/security_collector_storage_v1_20261020.sql.review-only'
      - 'docs/review/security_collector_storage_20261020.md'
      - 'tool/security/verify_collector_storage_candidate.mjs'
      - 'tool/security/fixture_dependencies/**'
      - '.github/workflows/security-collector-storage.yml'
permissions:
  contents: read
jobs:
  isolated-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tool/security/fixture_dependencies --ignore-scripts
      - run: node tool/security/verify_collector_storage_candidate.mjs
        env:
          PGLITE_PACKAGE: ${{ github.workspace }}/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js
