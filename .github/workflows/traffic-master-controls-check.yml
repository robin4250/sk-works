name: Traffic master controls
on:
  pull_request:
    paths: ['supabase/migrations/*traffic_master_feature_controls.sql', 'tool/verify_traffic_master_controls.mjs', '.github/workflows/traffic-master-controls-check.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/*traffic_master_feature_controls.sql', 'tool/verify_traffic_master_controls.mjs', '.github/workflows/traffic-master-controls-check.yml']
permissions:
  contents: read
jobs:
  isolated-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: npm install --prefix "$RUNNER_TEMP/sko-traffic" --save-exact --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - run: node tool/verify_traffic_master_controls.mjs "$RUNNER_TEMP/sko-traffic/node_modules/@electric-sql/pglite/dist/index.js"
