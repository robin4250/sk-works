name: Route responsible contact check
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261011121418_route_responsible_contact.sql'
      - 'supabase/migrations/20261011035332_guard_master_optional_feature_writes.sql'
      - 'tool/verify_route_responsible_contact.mjs'
      - '.github/workflows/route-responsible-contact-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261011121418_route_responsible_contact.sql'
      - 'supabase/migrations/20261011035332_guard_master_optional_feature_writes.sql'
      - 'tool/verify_route_responsible_contact.mjs'
      - '.github/workflows/route-responsible-contact-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned isolated SQL runtime
        run: npm install --prefix "$RUNNER_TEMP/route-contact-runtime" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Verify nullable contacts and unchanged real role access
        run: node tool/verify_route_responsible_contact.mjs "$RUNNER_TEMP/route-contact-runtime/node_modules/@electric-sql/pglite/dist/index.js"
