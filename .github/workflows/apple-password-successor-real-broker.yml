name: Apple password successor real broker
on:
  pull_request:
    paths:
      - 'docs/review/apple-existing-login-candidate/native_apple_successor*'
      - 'docs/review/apple-existing-login-candidate/native_apple_auth_port*'
      - 'docs/review/apple-existing-login-candidate/native_successor_delivery_ack_port*'
      - 'docs/review/apple-existing-login-candidate/native-successor-delivery-ack.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/native_password_broker_gotrue_test.go'
      - 'docs/review/apple-existing-login-candidate/native_apple_password_broker_real_auth.mjs'
      - 'docs/review/apple-existing-login-candidate/native-enrollment*.review-only'
      - 'docs/review/apple-existing-login-candidate/owner-policy.sql.review-only'
      - 'docs/review/apple-existing-login-candidate/owner_native_only_gotrue_test.go'
      - '.github/workflows/apple-password-successor-real-broker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-auth-node-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: supabase/auth
          ref: 4eee58f296d9698a1c2c0ae14d7a0b379c7622d3
          path: gotrue
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version-file: gotrue/go.mod
          cache-dependency-path: gotrue/go.sum
      - name: Install pinned fixture-only PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/sko-apple-real-broker" --no-save --ignore-scripts pg@8.16.3
      - name: Disposable official Auth schema
        working-directory: gotrue
        run: psql -f hack/init_postgres.sql postgresql://postgres:root@localhost:5432/postgres
      - name: Official GoTrue migrations
        working-directory: gotrue
        run: make migrate_dev
      - name: Reuse unchanged native Apple provider fixture and add full broker integration
        run: |
          cp candidate/docs/review/apple-existing-login-candidate/owner_native_only_gotrue_test.go gotrue/internal/api/sko_native_only_test.go
          cp candidate/docs/review/apple-existing-login-candidate/native_password_broker_gotrue_test.go gotrue/internal/api/sko_password_successor_broker_test.go
      - name: Real Auth HTTP to exact private SQL and internal Node broker
        working-directory: gotrue
        env:
          SKO_APPLE_LIFECYCLE_ADMIN_URL: postgresql://postgres:root@127.0.0.1:5432/postgres
          SKO_APPLE_POLICY_FILE: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/owner-policy.sql.review-only
          SKO_APPLE_ENROLLMENT_FILE: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/native-enrollment.sql.review-only
          SKO_APPLE_SUCCESSOR_FILE: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/native-enrollment-successor.sql.review-only
          SKO_APPLE_DELIVERY_ACK_FILE: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/native-successor-delivery-ack.sql.review-only
          SKO_APPLE_PASSWORD_SUCCESSOR_FILE: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/native-enrollment-password-successor.sql.review-only
          SKO_APPLE_PASSWORD_BROKER_RUNNER: ${{ github.workspace }}/candidate/docs/review/apple-existing-login-candidate/native_apple_password_broker_real_auth.mjs
          SKO_APPLE_BROKER_NATIVE_DRIVER: ${{ runner.temp }}/sko-apple-real-broker/node_modules/pg/lib/index.js
        run: go test ./internal/api -run '^TestSKOApplePasswordSuccessorBroker$' -count=1 -v
