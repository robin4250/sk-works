name: Trade confirmation financial trigger boundary
on:
  pull_request:
    paths:
      - 'tool/verify_trade_financial_brownfield_native.mjs'
      - 'tool/fixtures/trade_financial_brownfield/**'
      - 'docs/review/trade-financial-brownfield-native-20261024.md'
      - '.github/workflows/trade-financial-brownfield-native.yml'
permissions:
  contents: read
jobs:
  native-financial-trigger-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_document_consent_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: node --check tool/verify_trade_financial_brownfield_native.mjs
      - name: Existing trade fixture plus source-matched financial triggers
        env:
          SKO_CONSENT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_document_consent_fixture
        run: node tool/verify_trade_financial_brownfield_native.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
