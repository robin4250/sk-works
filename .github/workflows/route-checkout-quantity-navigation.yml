name: Route checkout quantity navigation
on:
  pull_request:
    paths:
      - 'lib/features/daily_reports/daily_report_page.dart'
      - 'lib/features/daily_reports/daily_report_checkout_navigation.dart'
      - 'test/daily_report_checkout_navigation_test.dart'
      - 'lib/international/languages/en/english_language_pack.dart'
      - '.github/workflows/route-checkout-quantity-navigation.yml'
permissions:
  contents: read
jobs:
  signed-checkout-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/targeted_translation_resource_coverage_test.dart test/daily_report_checkout_navigation_test.dart test/route_quantity_day_navigation_test.dart test/route_customer_day_quantity_page_test.dart test/attendance_checkout_completion_widgets_test.dart
