name: Apple global SDK adoption boundary
on:
  pull_request:
    paths:
      - 'test/apple_global_adoption_boundary_test.dart'
      - 'lib/features/auth/app_auth_mutation_gateway.dart'
      - 'lib/features/auth/app_auth_logout_persistence.dart'
      - 'lib/data/supabase_backend.dart'
      - '.github/workflows/apple-global-adoption-boundary.yml'
permissions: {contents: read}
jobs:
  actual-sdk-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze test/apple_global_adoption_boundary_test.dart
      - run: flutter test test/apple_global_adoption_boundary_test.dart --reporter expanded
      - run: git diff --exit-code -- pubspec.yaml pubspec.lock
