name: Registered names bounded install and restore
on:
  pull_request:
    paths:
      - 'tool/company_registered_names_deployment/**'
      - 'tool/verify_company_registered_names_deployment.mjs'
      - '.github/workflows/company-registered-names-deployment.yml'
permissions:
  contents: read
jobs:
  native-bounded-names:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_registered_allowance_labels_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: python3 -m py_compile tool/company_registered_names_deployment/prepare.py
      - run: node --check tool/verify_company_registered_names_deployment.mjs
      - name: Price-free same-company reader and actual PostgREST authorization
        env:
          SKO_REGISTERED_LABELS_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_registered_allowance_labels_fixture
        run: node tool/verify_company_registered_names_deployment.mjs "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
