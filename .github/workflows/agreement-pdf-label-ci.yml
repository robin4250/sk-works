name: Agreement PDF confirmed label
on:
  push:
    branches: [main, 'fix/agreement-confirmed-pdf-*']
    paths:
      - 'lib/features/payroll/payment_certificate*'
      - 'lib/features/payroll/site_payment_agreement_document.dart'
      - 'test/site_payment_agreement_confirmed_label_pdf_test.dart'
      - 'tool/verify_site_payment_agreement.mjs'
      - '.github/workflows/agreement-pdf-label-ci.yml'
  pull_request:
    paths:
      - 'lib/features/payroll/payment_certificate*'
      - 'lib/features/payroll/site_payment_agreement_document.dart'
      - 'test/site_payment_agreement_confirmed_label_pdf_test.dart'
      - 'tool/verify_site_payment_agreement.mjs'
      - '.github/workflows/agreement-pdf-label-ci.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/sko-label-runtime" @electric-sql/pglite@0.3.14
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python -m pip install PyMuPDF==1.26.6 fonttools==4.61.1
      - run: python tool/prepare_pdf_fixture_font.py
      - run: flutter test test/site_payment_agreement_confirmed_label_pdf_test.dart
        env:
          SKO_PDF_FONT_PATH: build/pdf-fixtures/NotoSansJP-Regular.ttf
          SKO_PAYMENT_PGLITE_PATH: ${{ runner.temp }}/sko-label-runtime/node_modules/@electric-sql/pglite/dist/index.js
      - name: Check actual PDF labels and render
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          paths = list(Path('build/agreement-label-proof').glob('*.pdf'))
          assert len(paths) == 7, paths
          for path in paths:
              with fitz.open(path) as document:
                  text = ''.join(''.join(page.get_text().split()) for page in document)
                  if path.stem.startswith('agreement_'):
                      assert '双方確認済み・第' in text, path
                      assert '下書き・' not in text and '確定・' not in text, path
                  else:
                      expected = {'monthly_preview':'プレビュー・出勤実績なし',
                          'monthly_draft':'下書き・第1版',
                          'monthly_finalized':'確定・第1版'}[path.stem]
                      assert expected in text and '双方確認済み' not in text, path
                  for index,page in enumerate(document):
                      page.get_pixmap(matrix=fitz.Matrix(2,2)).save(path.with_name(f'{path.stem}_{index}.png'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agreement-confirmed-label-proof
          path: build/agreement-label-proof/
