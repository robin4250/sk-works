name: Qualification detail small screen
on:
  pull_request:
    paths:
      - 'lib/features/qualifications/qualification_cloud_page.dart'
      - 'test/qualification_registered_edit_hold_test.dart'
      - '.github/workflows/qualification-detail-small-screen.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/qualification_registered_edit_hold_test.dart
