name: Trade document static label spacing
on:
  pull_request:
    paths:
      - 'lib/features/shared/trade_document_form_pdf.dart'
      - 'test/trade_document_static_label_spacing*'
      - '.github/workflows/trade-document-static-label-spacing.yml'
permissions:
  contents: read
jobs:
  spacing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze lib/features/shared/trade_document_form_pdf.dart test/trade_document_static_label_spacing_test.dart
      - run: flutter test test/trade_document_static_label_spacing_test.dart
      - run: python -m pip install PyMuPDF==1.26.4
      - run: python test/trade_document_static_label_spacing_check.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trade-document-static-label-spacing-proof
          path: build/trade-document-label-spacing/
