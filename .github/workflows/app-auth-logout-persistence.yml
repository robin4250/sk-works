name: App Auth logout persistence fence
on:
  pull_request:
    paths:
      - 'lib/features/auth/app_auth_logout_persistence.dart'
      - 'lib/features/auth/app_auth_mutation_gateway.dart'
      - 'lib/data/supabase_backend.dart'
      - 'test/app_auth_logout_persistence_test.dart'
      - '.github/workflows/app-auth-logout-persistence.yml'
permissions:
  contents: read
jobs:
  persistence-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: dart analyze lib/data/supabase_backend.dart lib/features/auth/app_auth_logout_persistence.dart lib/features/auth/app_auth_mutation_gateway.dart test/app_auth_logout_persistence_test.dart
      - run: flutter test test/app_auth_logout_persistence_test.dart test/app_auth_logout_quarantine_test.dart test/app_auth_mutation_gateway_test.dart --reporter expanded
