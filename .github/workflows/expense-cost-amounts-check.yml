name: Staged additional expense amount contracts
on:
  pull_request:
    paths:
      - 'supabase/tests/expense_cost_amounts.sql'
      - 'supabase/tests/expense_settlement_choice_cost_extension.sql'
      - 'supabase/tests/fixtures/expense_cost_foundation_20261012.json'
      - 'tool/verify_expense_cost_amounts.mjs'
      - 'tool/fixtures/expense_cost_fixture.mjs'
      - '.github/workflows/expense-cost-amounts-check.yml'
permissions:
  contents: read
jobs:
  staged-amount-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned isolated database runtime
        run: npm install --prefix "$RUNNER_TEMP/expense-cost-runtime" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Verify explicit expense amount and detail consistency
        run: node tool/verify_expense_cost_amounts.mjs "$RUNNER_TEMP/expense-cost-runtime/node_modules/@electric-sql/pglite/dist/index.js"
