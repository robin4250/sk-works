name: Master optional feature write gates
on:
  pull_request:
    paths:
      - 'supabase/migrations/*guard_master_optional_feature_writes.sql'
      - 'tool/verify_master_optional_feature_writes.mjs'
      - '.github/workflows/master-optional-write-gates.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*guard_master_optional_feature_writes.sql'
      - 'tool/verify_master_optional_feature_writes.mjs'
      - '.github/workflows/master-optional-write-gates.yml'
permissions:
  contents: read
jobs:
  pglite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/master-gates" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - run: node tool/verify_master_optional_feature_writes.mjs "$RUNNER_TEMP/master-gates/node_modules/@electric-sql/pglite/dist/index.js"
  postgres17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: master_gate_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/master-gates" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Verify PostgreSQL 17 and concurrent OFF race
        env:
          FIXTURE_DATABASE_URL: postgres://postgres:fixture@localhost:5432/master_gate_fixture
        run: node tool/verify_master_optional_feature_writes.mjs "$RUNNER_TEMP/master-gates/node_modules/pg/lib/index.js" --postgres
