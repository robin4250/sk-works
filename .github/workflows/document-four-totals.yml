name: Four document totals PDF proof
on:
  pull_request:
    paths: ['lib/features/invoices/**', 'lib/features/payroll/payment_certificate_pdf_service.dart', 'lib/features/shared/document_display_totals.dart', 'test/*totals*', '.github/workflows/document-four-totals.yml']
  push:
    branches: [main]
    paths: ['lib/features/invoices/**', 'lib/features/payroll/payment_certificate_pdf_service.dart', 'lib/features/shared/document_display_totals.dart', 'test/*totals*', '.github/workflows/document-four-totals.yml']
permissions: {contents: read}
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: python -m pip install PyMuPDF==1.26.6
      - run: flutter test test/document_display_totals_test.dart test/document_four_totals_pdf_test.dart test/invoice_pdf_service_test.dart test/adopted_invoice_pdf_generation_test.dart test/payment_certificate_pdf_generation_test.dart
        env:
          SKO_FOUR_TOTALS_OUTPUT: build/four-totals
          SKO_PDF_FONT_PATH: assets/fonts/company-seal/NotoSansJP-Bold.ttf
          SKO_PDF_OUTPUT_DIR: build/four-totals-regressions
      - run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          for name,total in [('invoice','41,492'),('certificate','40,492')]:
              path=Path('build/four-totals')/(name+'.pdf')
              doc=fitz.open(path)
              assert len(doc)==1
              page=doc[0]
              text=page.get_text()
              assert text.count('福利厚生費')==1,text
              assert text.count('消費税')==1,text
              assert all(v in text for v in ['32,800','4,920','3,772',total]),text
              assert text.index('小計')<text.index('福利厚生費')<text.index('消費税'),text
              if name=='certificate': assert '-1,000' in text,text
              for block in page.get_text('blocks'):
                  assert block[0]>=-1 and block[1]>=-1 and block[2]<=page.rect.width+1 and block[3]<=page.rect.height+1,block
              page.get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(path.with_suffix('.png'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: four-document-totals-proof, path: 'build/four-totals*/'}
