name: Checkout report authoritative gate and daily reminders
on:
  pull_request:
    paths:
      - 'docs/candidates/checkout_report_registration*.sql.review-only'
      - 'tool/verify_checkout_registration.mjs'
      - 'tool/verify_checkout_registration_source_chain.mjs'
      - 'supabase/migrations/20261008162618_attach_vehicle_meter_to_report.sql'
      - 'supabase/migrations/20261009171504_payroll_refresh_scope_order.sql'
      - 'tool/verify_company_checkout_integration.mjs'
      - 'tool/fixtures/company_checkout_*'
      - '.github/workflows/checkout-report-authoritative.yml'
permissions:
  contents: read
jobs:
  native-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - verifier: verify_checkout_registration.mjs
            database: sko_report_registration_fixture
          - verifier: verify_checkout_registration_source_chain.mjs
            database: sko_checkout_integration_fixture
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ${{ matrix.database }}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - run: node --check tool/verify_checkout_registration.mjs
      - run: node --check tool/verify_checkout_registration_source_chain.mjs
      - name: Disposable authoritative pending and reminder regression
        env:
          SKO_REPORT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_report_registration_fixture
          SKO_CHECKOUT_FIXTURE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/sko_checkout_integration_fixture
        run: node tool/${{ matrix.verifier }} "file://$GITHUB_WORKSPACE/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
