name: Security incident records
on:
  pull_request:
    paths:
      - 'tool/security/**'
      - 'supabase/migrations/*master_security_incident_records.sql'
      - '.github/workflows/security-incident-records.yml'
  push:
    branches: [main]
    paths:
      - 'tool/security/**'
      - 'supabase/migrations/*master_security_incident_records.sql'
      - '.github/workflows/security-incident-records.yml'
permissions:
  contents: read
jobs:
  sanitized-record-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node --test tool/security/incident_collector_test.mjs
      - run: node tool/security/incident_sql_check.mjs "$PWD/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js"
  postgres-http-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: sko_incident_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sko_incident_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgrest:
        image: postgrest/postgrest:v16.4
        env:
          PGRST_DB_URI: postgres://postgres:fixture-only@postgres:5432/sko_incident_fixture
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_JWT_SECRET: synthetic-incident-fixture-secret-at-least-32-characters
        ports: ['3000:3000']
    env:
      SKO_INCIDENT_FIXTURE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/sko_incident_fixture
      SKO_INCIDENT_POSTGREST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tool/security/fixture_dependencies
      - run: node tool/security/incident_sql_check.mjs "$PWD/tool/security/incident_pg_adapter.mjs"

