name: Resident annual owner runner review
on:
  pull_request:
    paths:
      - 'tool/security/resident_annual_owner/**'
      - 'docs/review/resident-annual-owner-runner-20261024.md'
      - '.github/workflows/resident-annual-owner-runner-review.yml'
permissions:
  contents: read
jobs:
  mocked-owner-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tool/security/resident_annual_owner -p 'test_runner.py' -v
      - name: Verify unchanged original helper bytes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, runpy
          root=pathlib.Path('tool/security/resident_annual_owner')
          source=runpy.run_path(str(root/'runner.py'))
          for name,digest in source['HELPERS'].items():
              assert hashlib.sha256((root/(name+'.py')).read_bytes()).hexdigest()==digest
          print('Original helper hashes match; no connection or credentials used')
          PY
  native-tls-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - name: Configure only the disposable PostgreSQL service with localhost TLS
        env:
          FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/psql ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main\n' | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client-17
          fi
          tls_dir="$RUNNER_TEMP/resident-annual-native-tls"
          mkdir -m 700 "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.crt" -days 1 -subj /CN=isolated-resident-annual-CA
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tls_dir/wrong-ca.key" -out "$tls_dir/wrong-ca.crt" -days 1 -subj /CN=isolated-wrong-CA
          openssl req -newkey rsa:2048 -nodes -keyout "$tls_dir/server.key" -out "$tls_dir/server.csr" -subj /CN=localhost
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > "$tls_dir/server.ext"
          openssl x509 -req -in "$tls_dir/server.csr" -CA "$tls_dir/ca.crt" -CAkey "$tls_dir/ca.key" -CAcreateserial -out "$tls_dir/server.crt" -days 1 -extfile "$tls_dir/server.ext"
          docker cp "$tls_dir/server.key" "$FIXTURE_CONTAINER:/var/lib/postgresql/server.key"
          docker cp "$tls_dir/server.crt" "$FIXTURE_CONTAINER:/var/lib/postgresql/server.crt"
          docker exec --user root "$FIXTURE_CONTAINER" chown postgres:postgres /var/lib/postgresql/server.key /var/lib/postgresql/server.crt
          docker exec --user root "$FIXTURE_CONTAINER" chmod 600 /var/lib/postgresql/server.key
          printf "ssl=on\nssl_cert_file='/var/lib/postgresql/server.crt'\nssl_key_file='/var/lib/postgresql/server.key'\n" > "$tls_dir/ssl.conf"
          docker cp "$tls_dir/ssl.conf" "$FIXTURE_CONTAINER:/tmp/annual-ssl.conf"
          docker exec --user postgres "$FIXTURE_CONTAINER" sh -c 'cat /tmp/annual-ssl.conf >> "$PGDATA/postgresql.conf"'
          docker restart "$FIXTURE_CONTAINER"
          for attempt in $(seq 1 20); do
            if docker exec "$FIXTURE_CONTAINER" pg_isready --username postgres; then break; fi
            sleep 1
          done
          printf 'SKO_ANNUAL_FIXTURE_CA=%s\nSKO_ANNUAL_FIXTURE_WRONG_CA=%s\n' "$tls_dir/ca.crt" "$tls_dir/wrong-ca.crt" >> "$GITHUB_ENV"
      - name: Exact annual unit via real psql TLS and once-only recovery boundary
        env:
          SKO_ANNUAL_OWNER_NATIVE_FIXTURE: isolated-loopback-only
          SKO_ANNUAL_FIXTURE_PSQL: /usr/lib/postgresql/17/bin/psql
        run: python3 -m unittest discover -s tool/security/resident_annual_owner -p 'test_native_tls.py' -v
