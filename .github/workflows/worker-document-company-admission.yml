name: Worker document unambiguous company admission
on:
  pull_request:
    paths:
      - 'lib/features/people/worker_document_repository.dart'
      - 'test/worker_document_company_admission_test.dart'
      - '.github/workflows/worker-document-company-admission.yml'
permissions:
  contents: read
jobs:
  scoped-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.5', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: >-
          flutter test test/worker_document_company_admission_test.dart
          test/worker_document_bank_metadata_http_test.dart
          test/worker_document_exemption_test.dart
          test/worker_document_managed_save_http_test.dart
          test/worker_document_own_save_http_test.dart
          test/own_document_registration_save_test.dart
          test/own_required_document_status_test.dart
          test/worker_document_change_flow_test.dart
          --reporter expanded

