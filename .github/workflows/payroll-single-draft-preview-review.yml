name: Single payroll draft read-only preview review
on:
  pull_request:
    paths:
      - 'docs/candidates/payroll_single_draft_preview_20261019.sql.review-only'
      - 'docs/candidates/payroll_single_draft_recalculation_20261019.sql.review-only'
      - 'tool/verify_payroll_single_draft_preview*.mjs'
      - 'tool/payroll_scope*.mjs'
      - 'tool/security/fixture_dependencies/package*.json'
      - 'supabase/tests/payroll*.sql'
      - 'supabase/tests/invoice_stamp_approval_workflow.sql'
      - 'supabase/migrations/**'
      - '.github/workflows/payroll-single-draft-preview-review.yml'
  push:
    branches: [main]
    paths:
      - 'docs/candidates/payroll_single_draft_preview_20261019.sql.review-only'
      - 'docs/candidates/payroll_single_draft_recalculation_20261019.sql.review-only'
      - 'tool/verify_payroll_single_draft_preview*.mjs'
      - 'tool/payroll_scope*.mjs'
      - 'tool/security/fixture_dependencies/package*.json'
      - 'supabase/tests/payroll*.sql'
      - 'supabase/tests/invoice_stamp_approval_workflow.sql'
      - 'supabase/migrations/**'
      - '.github/workflows/payroll-single-draft-preview-review.yml'
permissions:
  contents: read
jobs:
  read-only-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: sko_payroll_scope_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKO_PAYROLL_SCOPE_FIXTURE_URL: postgresql://postgres:fixture-only-password@127.0.0.1:5432/sko_payroll_scope_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tool/security/fixture_dependencies
      - name: PGlite exact preview and dependency guards
        run: node tool/verify_payroll_single_draft_preview.mjs "$PWD/tool/security/fixture_dependencies/node_modules/@electric-sql/pglite/dist/index.js" supabase/migrations/20261018215043_fix_payroll_null_work_category.sql
      - name: Native PostgreSQL 17 read-only preview and dependency guards
        run: node tool/verify_payroll_single_draft_preview.mjs "file://$PWD/tool/payroll_scope_native_pg17_runtime.mjs" "$PWD/tool/security/fixture_dependencies/node_modules/pg/lib/index.js" supabase/migrations/20261018215043_fix_payroll_null_work_category.sql
      - name: Native two-connection preview source and membership changes
        run: node tool/verify_payroll_single_draft_preview_postgres_race.mjs "$PWD/tool/security/fixture_dependencies/node_modules/pg/lib/index.js"
