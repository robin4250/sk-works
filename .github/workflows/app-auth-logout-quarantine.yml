name: App Auth logout navigation quarantine
on:
  pull_request:
    paths:
      - 'lib/features/auth/app_auth_mutation_gateway.dart'
      - 'lib/features/auth/authenticated_navigation_boundary.dart'
      - 'lib/features/auth/apple_session_navigation_binding.dart'
      - 'test/app_auth_logout_quarantine_test.dart'
      - 'test/app_auth_mutation_gateway_test.dart'
      - '.github/workflows/app-auth-logout-quarantine.yml'
permissions:
  contents: read
jobs:
  logout-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: git diff --exit-code -- pubspec.lock
      - run: dart analyze lib/features/auth/auth_gate.dart lib/features/auth/apple_session_navigation_binding.dart lib/features/auth/app_auth_mutation_gateway.dart lib/features/auth/authenticated_navigation_boundary.dart test/app_auth_logout_quarantine_test.dart
      - run: flutter test test/app_auth_logout_quarantine_test.dart test/authenticated_navigation_boundary_test.dart test/app_auth_mutation_gateway_test.dart --reporter expanded
