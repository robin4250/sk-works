name: R43 daily calendar preview
on:
  pull_request:
    paths:
      - 'lib/features/daily_reports/daily_report_month_page.dart'
      - 'test/daily_report_calendar_opening_test.dart'
      - '.github/workflows/r43-daily-calendar.yml'
permissions:
  contents: read
jobs:
  opening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/daily_report_calendar_opening_test.dart test/daily_report_calendar_test.dart test/daily_report_month_navigation_test.dart test/daily_report_month_export_test.dart
