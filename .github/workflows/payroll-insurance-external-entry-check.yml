name: Payroll insurance external entry
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/payroll/individual_payroll_settings_page.dart'
      - 'lib/features/payroll/payroll_fixed_deductions.dart'
      - 'lib/features/payroll/payroll_insurance_settings_entry.dart'
      - 'test/payroll_insurance_external_entry_test.dart'
      - '.github/workflows/payroll-insurance-external-entry-check.yml'
permissions:
  contents: read
jobs:
  external-entry-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze external entry and existing state owner
        run: flutter analyze lib/features/payroll/individual_payroll_settings_page.dart lib/features/payroll/payroll_fixed_deductions.dart lib/features/payroll/payroll_insurance_settings_entry.dart test/payroll_insurance_external_entry_test.dart
      - name: Verify one entry, view switching, draft protection and existing salary tabs
        run: flutter test --reporter expanded test/payroll_insurance_external_entry_test.dart test/payroll_insurance_settings_entry_test.dart test/individual_payroll_ui_tabs_test.dart
