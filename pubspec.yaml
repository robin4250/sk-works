name: sk_works
description: SKO company and work management app
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  crypto: 3.0.8
  http: 1.6.0
  file_picker: 13.1.0
  geolocator: 14.1.2
  google_mlkit_text_recognition: 0.17.1
  image_picker: 1.2.4
  local_auth: 2.3.0
  mobile_scanner: 7.4.2
  pdf: 3.13.1
  path_provider: 2.1.6
  qr_flutter: 4.1.0
  share_plus: 13.3.1
  archive: 4.3.0
  printing: 5.15.1
  shared_preferences: 2.5.6
  supabase_flutter: 2.18.3
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/company-seal/
    - assets/images/company-seals/sumida-v1/
    - assets/fonts/company-seal/aoyagi-reisho/
