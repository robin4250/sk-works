<!DOCTYPE html>
<html lang="ja">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SKO WEB版（準備中）">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SKO">
  <link rel="apple-touch-icon" href="icons/sko-app-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SKO</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #sko-startup { min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
      display: grid; place-content: center; padding: 24px; text-align: center;
      color: #17233b; background: #f5f7fb; font-family: system-ui, sans-serif; }
    #sko-startup[hidden], #sko-startup-retry[hidden] { display: none; }
    #sko-startup h1 { font-size: 28px; margin: 0 0 16px; }
    #sko-startup-retry { display: inline-block; text-decoration: none; margin: 20px auto 0; padding: 12px 24px; font: inherit;
      border: 0; border-radius: 8px; color: white; background: #115bc2; cursor: pointer; }
  </style>
</head>
<body style="margin:0">
  <section id="sko-startup" aria-label="SKO">
    <h1>SKO</h1>
    <p id="sko-startup-message" role="status" aria-live="polite">読み込み中です…</p>
    <a id="sko-startup-retry" href="">再読み込み</a>
    <noscript>SKOを開くには、ブラウザのJavaScriptを有効にしてください。</noscript>
  </section>
  <script src="sko_startup.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script id="sko-flutter-bootstrap" src="flutter_bootstrap.js" async></script>
</body>
</html>
